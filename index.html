  if (c.cfg.repsAltas.indexOf(nome) !== -1) { altas = 10; baixas = 8; }
  var fator = 1.0;
  if (dia === 'sexta') { altas = 12; baixas = 10; fator = 0.88; }
  if (!peso) return [[0, altas], [0, baixas]];
  peso = peso * fator;
  var passo = peso < 60 ? 2.5 : 5;
  var s1 = arredondarPy(peso * 0.95 / passo) * passo;
  var s2 = arredondarPy(peso * 1.05 / passo) * passo;
  if (s2 <= s1) s2 = s1 + passo;
  return [[s1, altas], [s2, baixas]];
}

function calendarioSemana(c, w) {
  var L = c.cfg.lifts, out = {};
  PLANO_DIAS.forEach(function (d, i) { out[d] = L[(w + i) % 4]; });
  return out;
}

function _bloqueados(c, d, diasLift) {
  var fora = {}, reg = c.cfg.interfere[diasLift[d]];
  if (reg) reg.dia.forEach(function (s) { fora[s] = 1; });
  var seg = _diaSeguinte(d);
  if (seg) {
    reg = c.cfg.interfere[diasLift[seg]];
    if (reg) reg.vespera.forEach(function (s) { fora[s] = 1; });
  }
  return fora;
}

function _grupoCabeNoDia(c, g, d, diasLift) {
  var fora = _bloqueados(c, d, diasLift);
  return c.PREF[g].some(function (x) {
    var s = c.cfg.subgrupo[x];
    return !(s !== undefined && fora[s]);
  });
}

function _nSeriesLift(c, lift, dia) { return c.cfg.lift[lift][c.cfg.modo[dia]].length; }

function _grupoDoLift(c, L) { return L === 'MORTO' ? 'morto' : c.cfg.grupoAcc[L]; }

function alocarSemana(c, diasLift) {
  var cfg = c.cfg, SA = cfg.seriesAcessorio;
  var need = {};
  Object.keys(cfg.alvo).forEach(function (g) {
    if (g === 'morto') return;
    if (g === 'perna') {
      need[g] = Object.keys(cfg.pernaPorLift).reduce(function (s, k) { return s + cfg.pernaPorLift[k]; }, 0);
      return;
    }
    var feitas = 0;
    PLANO_DIAS.forEach(function (d) {
      var L = diasLift[d];
      if (cfg.grupoAcc[L] === g && L !== 'MORTO') feitas = _nSeriesLift(c, L, d);
    });
    need[g] = Math.max(0, cfg.alvo[g] - feitas);
  });

  var carga = {}, noDia = {}, plano = {};
  PLANO_DIAS.forEach(function (d) {
    var n = _nSeriesLift(c, diasLift[d], d);
    carga[d] = n;
    noDia[d] = {};
    noDia[d][_grupoDoLift(c, diasLift[d])] = n;
    plano[d] = {};
  });

  function por(d, g, n) {
    plano[d][g] = (plano[d][g] || 0) + n;
    noDia[d][g] = (noDia[d][g] || 0) + n;
    carga[d] += n;
  }
  function teto(d) { return d === 'segunda' ? cfg.limSegunda : cfg.tetoDia; }
  function cabe(d, g, n) {
    return carga[d] + n <= teto(d) &&
      (noDia[d][g] || 0) + n <= cfg.maxGrupoDia &&
      (need[g] || 0) >= n &&
      _grupoCabeNoDia(c, g, d, diasLift);
  }
  function cobertas(d) {
    var s = {};
    s[cfg.categoria[_grupoDoLift(c, diasLift[d])]] = 1;
    Object.keys(plano[d]).forEach(function (g) { s[cfg.categoria[g]] = 1; });
    return s;
  }

  // 0. perna conforme o lift
  PLANO_DIAS.forEach(function (d) {
    var n = cfg.pernaPorLift[diasLift[d]];
    if (n) por(d, 'perna', n);
  });
  need.perna = 0;
  // 1. abs
  cfg.absDias.forEach(function (d) { por(d, 'abs', SA); });
  need.abs = 0;
  // 2. braco segue o lift
  PLANO_DIAS.forEach(function (d) {
    var g = cfg.bracoDoLift[diasLift[d]];
    por(d, g, SA);
    need[g] -= SA;
  });
  // 3. gemeos nos dias mais leves
  var perm = PLANO_DIAS.filter(function (d) { return cabe(d, 'gemeos', SA); })
    .sort(function (a, b) { return carga[a] - carga[b]; });
  perm.slice(0, cfg.gemeosDias).forEach(function (d) {
    por(d, 'gemeos', SA);
    need.gemeos -= SA;
  });
  // 4. cobertura: perna, empurrar, puxar, braco
  PLANO_DIAS.forEach(function (d) {
    cfg.obrigatorias.forEach(function (cat) {
      if (cobertas(d)[cat]) return;
      var cands = Object.keys(need).filter(function (g) {
        return cfg.categoria[g] === cat && need[g] >= SA && cabe(d, g, SA);
      });
      if (!cands.length) throw new Error('sem forma de cobrir ' + cat + ' na ' + d);
      var g = escolherMax(cands, function (x) { return need[x]; });
      por(d, g, SA);
      need[g] -= SA;
    });
  });
  // 5. o resto, pelos dias mais leves
  for (;;) {
    var ks = Object.keys(need);
    if (!ks.some(function (g) { return need[g] > 0; })) break;
    var g5 = escolherMax(ks, function (x) { return need[x]; });
    if (need[g5] <= 0) break;
    var cands5 = PLANO_DIAS.filter(function (d) { return cabe(d, g5, SA); });
    if (!cands5.length) throw new Error('sem espaco para ' + g5 + ' (faltam ' + need[g5] + ')');
    var d5 = escolherMin(cands5, function (x) { return [noDia[x][g5] || 0, carga[x]]; });
    por(d5, g5, SA);
    need[g5] -= SA;
  }
  // 6. equilibrio: puxa dos dias cheios para os curtos (perna e abs de fora)
  for (var it = 0; it < 12; it++) {
    var dMin = escolherMin(PLANO_DIAS, function (x) { return carga[x]; });
    var dMax = escolherMax(PLANO_DIAS, function (x) { return carga[x]; });
    if (carga[dMin] >= cfg.minDia || carga[dMax] - carga[dMin] < 2 * SA) break;
    var cands6 = Object.keys(plano[dMax]).filter(function (g) {
      return g !== 'perna' && g !== 'abs' &&
        plano[dMax][g] >= SA &&
        _grupoCabeNoDia(c, g, dMin, diasLift) &&
        (noDia[dMin][g] || 0) + SA <= cfg.maxGrupoDia &&
        carga[dMin] + SA <= teto(dMin);
    });
    if (!cands6.length) break;
    var g6 = escolherMax(cands6, function (x) { return plano[dMax][x]; });
    plano[dMax][g6] -= SA;
    if (plano[dMax][g6] === 0) delete plano[dMax][g6];
    noDia[dMax][g6] -= SA;
    carga[dMax] -= SA;
    por(dMin, g6, SA);
  }
  return plano;
}

function _pesadosOk(c, g, dia, diasLift) {
  return !(c.cfg.grupoAcc[diasLift.terca] === g && (dia === 'quinta' || dia === 'sexta'));
}

function escolherExercicios(c, planoSemana, diasLift, usos, semana) {
  var cfg = c.cfg, ACC = c.ACC, PREF = c.PREF, SA = cfg.seriesAcessorio;
  function familia(n) { return cfg.familia[n] !== undefined ? cfg.familia[n] : n; }
  function familiaDura(n) { return cfg.familiaDura[n]; }
  var out = {}, anterior = {};
  var diaAgach = PLANO_DIAS.filter(function (d) { return diasLift[d] === 'AGACHAMENTO'; })[0];

  PLANO_DIAS.forEach(function (d) {
    var usados = {}, linhas = [];
    var fams = {};
    fams[familia(cfg.nomeLift[diasLift[d]])] = 1;
    var duras = {};
    [_diaAnterior(d), _diaSeguinte(d)].forEach(function (viz) {
      if (!viz) return;
      var f = familiaDura(cfg.nomeLift[diasLift[viz]]);
      if (f) duras[f] = 1;
    });
    if (_diaAnterior(d)) {
      Object.keys(anterior).forEach(function (x) {
        var f = familiaDura(x);
        if (f) duras[f] = 1;
      });
    }
    var pares = Object.keys(planoSemana[d]).map(function (g) { return [g, planoSemana[d][g]]; })
      .sort(function (a, b) { return b[1] - a[1]; });

    pares.forEach(function (par) {
      var g = par[0], n = par[1];
      var permPesado = _pesadosOk(c, g, d, diasLift);
      var lista = PREF[g].filter(function (x) { return permPesado || ACC[x][4] === 'leve'; });
      if (!lista.length) {
        lista = PREF[g].filter(function (x) { return ACC[x][4] === 'leve'; });
        if (!lista.length) lista = PREF[g].slice();
      }
      var fora = _bloqueados(c, d, diasLift);
      var aj = cfg.ajustes[semana + '|' + d] || {};
      var vetados = aj.fora || [];
      var pedidos = (aj.dentro || []).filter(function (x) { return ACC[x] && ACC[x][0] === g; });
      var permitidos = lista.filter(function (x) {
        var s = cfg.subgrupo[x], fd = familiaDura(x);
        return !(s !== undefined && fora[s]) &&
          !(fd !== undefined && duras[fd]) &&
          vetados.indexOf(x) === -1;
      });
      if (permitidos.length) lista = permitidos;
      var livres = lista.filter(function (x) { return !fams[familia(x)]; });
      if (livres.length) lista = livres;
      var frescos = _diaAnterior(d)
        ? lista.filter(function (x) { return !anterior[x]; })
        : lista.slice();
      var k = Math.max(1, Math.floor(n / SA));
      for (var bloco = 0; bloco < k; bloco++) {
        var nome = null;
        var pools = [frescos, lista];
        var pedidosLivres = pedidos.filter(function (x) { return !usados[x] && lista.indexOf(x) !== -1; });
        if (pedidosLivres.length) pools = [pedidosLivres, frescos, lista];
        var pernaAcessoria = g === 'perna' && d !== diaAgach;
        if (bloco === 0 && permPesado && !pernaAcessoria && k > 1 && !pedidosLivres.length) {
          var pes = frescos.filter(function (x) { return ACC[x][4] === 'pesado'; });
          if (pes.length) pools = [pes, frescos, lista];
        }
        for (var p = 0; p < pools.length; p++) {
          var disp = pools[p].filter(function (x) { return !usados[x]; });
          if (disp.length) {
            nome = escolherMin(disp, function (x) { return [usos[x] || 0, PREF[g].indexOf(x)]; });
            break;
          }
        }
        if (nome === null) nome = escolherMin(lista, function (x) { return usos[x] || 0; });
        usos[nome] = (usos[nome] || 0) + 1;
        usados[nome] = 1;
        fams[familia(nome)] = 1;
        var semFam = lista.filter(function (x) { return !fams[familia(x)]; });
        lista = semFam.length ? semFam : lista;
        frescos = frescos.filter(function (x) { return !fams[familia(x)]; });
        linhas.push([nome, SA]);
      }
    });
    out[d] = linhas;
    anterior = usados;
  });
  return out;
}

function construirSemana(c, w, usos) {
  var cfg = c.cfg;
  var diasLift = calendarioSemana(c, w);
  var grupos = alocarSemana(c, diasLift);
  var exs = escolherExercicios(c, grupos, diasLift, usos, w + 1);
  var aprox = diasLift.terca;
  var sem = { semana: w + 1, tipo: 'progressao', ciclo: 1,
    maximos: diasLift.segunda, lift_em_aproximacao: aprox,
    grupo_em_aproximacao: cfg.grupoAcc[aprox], dias: {} };
  PLANO_DIAS.forEach(function (d) {
    var L = diasLift[d], gL = _grupoDoLift(c, L);
    var ex = [{ nome: cfg.nomeLift[L], grupo: gL, categoria: cfg.categoria[gL],
      foco: true, modo: cfg.modo[d], intensidade: 'pesado',
      series: _copia(cfg.lift[L][cfg.modo[d]]) }];
    exs[d].forEach(function (linha) {
      var a = c.ACC[linha[0]];
      ex.push({ nome: linha[0], grupo: a[0], categoria: cfg.categoria[a[0]],
        foco: false, intensidade: a[4], series: seriesAcessorio(c, linha[0], d) });
    });
    var ordemG = {}, nG = 0;
    ex.forEach(function (e) {
      if (!e.foco && ordemG[e.grupo] === undefined) ordemG[e.grupo] = nG++;
    });
    function chave(e) {
      return e.foco ? [0, 0, 0] : [cfg.ordemSessao[e.categoria], ordemG[e.grupo],
        cfg.isolamento.indexOf(e.nome) !== -1 ? 1 : 0];
    }
    ex.sort(function (a, b) { return compararChaves(chave(a), chave(b)); });
    sem.dias[d] = { lift: L, modo: cfg.modo[d], exercicios: ex };
  });
  return sem;
}

/* O plano completo de um ciclo (4 semanas), com datas. Mesmo formato do
   plano-treino.json, para o validador e o teste golden lerem os dois. */
function gerarPlano(cfg) {
  var c = _prepararConfig(cfg);
  var usos = {};
  var calendario = [0, 1, 2, 3].map(function (w) { return construirSemana(c, w, usos); });
  calendario.forEach(function (sem, i) {
    var base = _somarDias(cfg.dataInicio, 7 * i);
    sem.inicio = base;
    PLANO_DIAS.forEach(function (d) { sem.dias[d].data = _somarDias(base, PLANO_OFFSET_DIA[d]); });
  });
  var lifts = {};
  cfg.lifts.forEach(function (L) {
    lifts[L] = { nome: cfg.nomeLift[L], grupo: _grupoDoLift(c, L),
      maximo_ciclo1: cfg.lift[L].max, incremento_por_ciclo: cfg.lift[L].inc,
      maximos: _copia(cfg.lift[L].maximos), volume_5: _copia(cfg.lift[L].volume_5),
      volume_8: _copia(cfg.lift[L].volume_8), leve: _copia(cfg.lift[L].leve) };
  });
  var acessorios = {};
  cfg.acc.forEach(function (a) {
    acessorios[a[0]] = { grupo: a[1], categoria: cfg.categoria[a[1]],
      series: seriesAcessorio(c, a[0]), intensidade: a[5] };
  });
  var interferencia = {};
  Object.keys(cfg.interfere).forEach(function (L) {
    interferencia[L] = { dia: cfg.interfere[L].dia.slice().sort(),
      vespera: cfg.interfere[L].vespera.slice().sort() };
  });
  return {
    versao: 2,
    criado: cfg.criado,
    config: {
      dias: PLANO_DIAS.slice(), rotacao: 'frente', ciclo_semanas: 4,
      ordem_circular: cfg.lifts.slice(), modos: _copia(cfg.modo),
      descansos_seg: _copia(cfg.descansosSeg),
      categorias_obrigatorias_por_dia: cfg.obrigatorias.slice(),
      data_inicio: cfg.dataInicio
    },
    lifts_foco: lifts,
    acessorios: acessorios,
    regras: {
      corpo_inteiro_todos_os_dias: cfg.obrigatorias.slice(),
      aproximacao_bloqueia_pesados_em: ['quinta', 'sexta'],
      teto_series_dia_maximos: cfg.limSegunda,
      teto_series_outros_dias: cfg.tetoDia,
      max_series_por_grupo_por_dia: cfg.maxGrupoDia,
      bracos: 'biceps em 2 dias, triceps nos outros 2 -- braco todos os dias',
      perna_por_lift: _copia(cfg.pernaPorLift),
      interferencia: interferencia,
      subgrupos: _copia(cfg.subgrupo),
      perna_dia_do_agachamento: 'so o agachamento, mais nada',
      abs_dias: cfg.absDias.slice(),
      min_series_por_dia: cfg.minDia,
      familias: 'dois exercicios da mesma familia nunca no mesmo dia',
      familia_por_exercicio: _copia(cfg.familia),
      familia_dura: _copia(cfg.familiaDura),
      progressao_acessorios: 'dupla progressao: acerta o topo da faixa em todas ' +
        'as series -> +2,5 kg barra/halteres, +5 kg maquina/cabo',
      maximos_falhado: 'se o top sair facil sobe 5 kg e repete; se falhar, fica ' +
        'no peso anterior e o ciclo seguinte nao sobe'
    },
    volume_alvo_semanal: _copia(cfg.alvo),
    calendario: calendario
  };
}

/* O ciclo seguinte: cada lift sobe o seu incremento e TODAS as series dele
   sobem na mesma proporcao, arredondadas a 2,5 kg. O single dos maximos fica
   exatamente no maximo novo. Os ajustes a mao eram de semanas concretas do
   ciclo anterior, por isso nao passam. Os pesos dos acessorios ficam — e a
   fase das adaptacoes que os vai buscar ao que foi registado. */
/* resultados (opcional, de resultadosMaximos): single feito -> sobe a partir
   do melhor single; falhou ou sem teste -> fica. Sem resultados sobe tudo o
   incremento. pausados: acessorios que saem deste ciclo. */
function progredirConfig(cfg, novaDataInicio, hoje, resultados, pausados) {
  var novo = _copia(cfg);
  novo.dataInicio = novaDataInicio;
  novo.criado = hoje;
  novo.ajustes = {};
  if (pausados && pausados.length) {
    novo.acc = novo.acc.filter(function (a) { return pausados.indexOf(a[0]) === -1; });
  }
  novo.lifts.forEach(function (L) {
    var l = novo.lift[L], antes = l.max, depois = antes + l.inc;
    var r = resultados && resultados[L];
    if (r && r.estado === 'sucesso') depois = Math.max(antes, r.melhor) + l.inc;
    else if (r) depois = antes;
    ['maximos', 'volume_5', 'volume_8', 'leve'].forEach(function (m) {
      l[m] = l[m].map(function (s) {
        return [arredondarPy(s[0] * depois / antes / 2.5) * 2.5, s[1]];
      });
    });
    l.max = depois;
  });
  return novo;
}

/* ---------------------------------------------------------------------------
   Validador do plano: as 17 provas do validar.py

   Le so o plano final, nunca o gerador — para apanhar erros de traducao.
   Devolve a lista de falhas; vazia quer dizer que as 17 passam.

   Uma diferenca de proposito: a prova 16 do Python comparava a lista de
   series com o numero 1 (e['series'] == 1), o que nunca e verdade — a prova
   passava sempre sem olhar. Aqui compara-se o comprimento.
   ------------------------------------------------------------------------- */

function validarPlano(P) {
  var DIAS = P.config.dias, ALVO = P.volume_alvo_semanal, OBRIG = P.config.categorias_obrigatorias_por_dia;
  var GRUPO_ACC = { MORTO: 'costas', SUPINO: 'peito', AGACHAMENTO: 'perna', OMBRO: 'ombro' };
  var CICLO = P.calendario.filter(function (s) { return s.tipo === 'progressao'; });
  var TODAS = P.calendario;
  var OFF = PLANO_OFFSET_DIA;
  var falhas = [];
  function seguidos(a, b) { return OFF[b] - OFF[a] === 1; }
  function exs(sem, d) { return sem.dias[d].exercicios; }
  function S(sem) { return 'S' + sem.semana + ' '; }

  // 1. volume por grupo
  CICLO.forEach(function (sem) {
    var v = {};
    DIAS.forEach(function (d) { exs(sem, d).forEach(function (e) { v[e.grupo] = (v[e.grupo] || 0) + e.series.length; }); });
    Object.keys(ALVO).sort().forEach(function (g) {
      if ((v[g] || 0) !== ALVO[g]) falhas.push('P1 ' + S(sem) + g + ': ' + (v[g] || 0) + ' (alvo ' + ALVO[g] + ')');
    });
  });
  // 2. corpo inteiro
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d) {
      var cats = {};
      exs(sem, d).forEach(function (e) { cats[e.categoria] = 1; });
      var falta = OBRIG.filter(function (c) { return !cats[c]; });
      if (falta.length) falhas.push('P2 ' + S(sem) + d + ' sem ' + falta.join('+'));
    });
  });
  // aparicoes de cada lift no ciclo: [dia absoluto, dia, modo, semana]
  function aparicoes(L) {
    var ap = [];
    CICLO.forEach(function (sem) {
      DIAS.forEach(function (d) {
        if (sem.dias[d].lift === L) ap.push([(sem.semana - 1) * 7 + OFF[d] + 1, d, sem.dias[d].modo, sem.semana]);
      });
    });
    return ap.sort(function (a, b) { return a[0] - b[0]; });
  }
  var ESPERADO = ['segunda', 'sexta', 'quinta', 'terca'];
  // 3. rotacao
  P.config.ordem_circular.forEach(function (L) {
    var ap = aparicoes(L);
    var seq = ap.map(function (x) { return x[1]; });
    var i0 = ESPERADO.indexOf(seq[0]);
    var esp = [0, 1, 2, 3].map(function (k) { return ESPERADO[(i0 + k) % 4]; });
    var modos = ap.map(function (x) { return x[2]; }).sort();
    var ok = ap.length === 4 && modos.join() === 'leve,maximos,volume_5,volume_8' && seq.join() === esp.join();
    if (!ok) falhas.push('P3 ' + L + ' rotacao: ' + ap.length + 'x, dias ' + seq.join('>') + ' (esperado ' + esp.join('>') + ')');
  });
  // 4. 11 dias depois dos maximos
  P.config.ordem_circular.forEach(function (L) {
    var ap = aparicoes(L);
    var dias = ap.map(function (x) { return x[0]; });
    var gaps = [];
    for (var i = 0; i < dias.length - 1; i++) gaps.push(dias[i + 1] - dias[i]);
    gaps.push(dias[0] + 28 - dias[dias.length - 1]);
    var im = ap.map(function (x) { return x[2]; }).indexOf('maximos');
    if (gaps[im] !== 11) falhas.push('P4 ' + L + ': ' + gaps[im] + ' dias depois dos maximos, esperado 11');
  });
  // 5. sexta nunca e o dos maximos seguintes
  CICLO.forEach(function (sem, i) {
    var prox = CICLO[(i + 1) % CICLO.length];
    if (sem.dias.sexta.lift === prox.dias.segunda.lift) {
      falhas.push('P5 ' + S(sem) + 'sexta=' + sem.dias.sexta.lift + ' e S' + prox.semana + ' segunda igual');
    }
  });
  // 6. aproximacao
  CICLO.forEach(function (sem, i) {
    var ap = sem.grupo_em_aproximacao;
    var prox = CICLO[(i + 1) % CICLO.length];
    var esperado = GRUPO_ACC[prox.dias.segunda.lift];
    var mau = [];
    ['quinta', 'sexta'].forEach(function (d) {
      exs(sem, d).forEach(function (e) {
        if (e.grupo === ap && e.intensidade === 'pesado') mau.push(d + ': ' + e.nome);
      });
    });
    if (ap !== esperado || mau.length) falhas.push('P6 ' + S(sem) + 'aproximacao ' + ap + ' (esperado ' + esperado + ') pesados=' + mau.join(', '));
  });
  // 7. bracos e gemeos
  CICLO.forEach(function (sem) {
    function nd(teste) { return DIAS.filter(function (d) { return exs(sem, d).some(teste); }).length; }
    var nb = nd(function (e) { return e.grupo === 'biceps'; });
    var nt = nd(function (e) { return e.grupo === 'triceps'; });
    var ng = nd(function (e) { return e.grupo === 'gemeos'; });
    var nbr = nd(function (e) { return e.categoria === 'braco'; });
    if (!(nb === 2 && nt === 2 && ng === 2 && nbr === 4)) falhas.push('P7 ' + S(sem) + 'bi=' + nb + ' tri=' + nt + ' gem=' + ng + ' braco=' + nbr);
  });
  // 8. tetos
  CICLO.forEach(function (sem) {
    DIAS.forEach(function (d) {
      var tot = 0, porg = {};
      exs(sem, d).forEach(function (e) { tot += e.series.length; porg[e.grupo] = (porg[e.grupo] || 0) + e.series.length; });
      var teto = d === 'segunda' ? P.regras.teto_series_dia_maximos : P.regras.teto_series_outros_dias;
      var pior = Math.max.apply(null, Object.keys(porg).map(function (g) { return porg[g]; }));
      if (tot > teto || pior > P.regras.max_series_por_grupo_por_dia) falhas.push('P8 ' + S(sem) + d + ': ' + tot + ' series (teto ' + teto + '), maior grupo ' + pior);
    });
  });
  // 9. repetidos
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d, i) {
      var nomes = exs(sem, d).filter(function (e) { return !e.foco; }).map(function (e) { return e.nome; });
      var unicos = {};
      nomes.forEach(function (n) { unicos[n] = 1; });
      if (Object.keys(unicos).length !== nomes.length) falhas.push('P9 ' + S(sem) + d + ': repetido no proprio dia');
      if (i > 0 && seguidos(DIAS[i - 1], d)) {
        var ant = {};
        exs(sem, DIAS[i - 1]).forEach(function (e) { if (!e.foco) ant[e.nome] = 1; });
        var colados = Object.keys(unicos).filter(function (n) { return ant[n]; });
        if (colados.length) falhas.push('P9 ' + S(sem) + d + ': ' + colados.sort().join(', ') + ' tambem ontem');
      }
    });
  });
  // 10. ordem
  var ESCALAO = { perna: 1, empurrar: 1, puxar: 1, braco: 2, gemeos: 3, abs: 4 };
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d) {
      var esc = exs(sem, d).map(function (e) { return e.foco ? 0 : ESCALAO[e.categoria]; });
      for (var i = 1; i < esc.length; i++) {
        if (esc[i] < esc[i - 1]) { falhas.push('P10 ' + S(sem) + d + ': ordem errada'); break; }
      }
    });
  });
  // 11. perna por lift
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d) {
      var L = sem.dias[d].lift;
      var n = exs(sem, d).filter(function (e) { return e.grupo === 'perna' && !e.foco; })
        .reduce(function (s, e) { return s + e.series.length; }, 0);
      if (n !== P.regras.perna_por_lift[L]) falhas.push('P11 ' + S(sem) + d + ' (' + L + '): ' + n + ', esperado ' + P.regras.perna_por_lift[L]);
    });
  });
  // 12. abs
  TODAS.forEach(function (sem) {
    var diasAbs = DIAS.filter(function (d) { return exs(sem, d).some(function (e) { return e.categoria === 'abs'; }); });
    if (diasAbs.join() !== P.regras.abs_dias.join()) falhas.push('P12 ' + S(sem) + 'abs em ' + diasAbs.join(','));
  });
  // 13. familias
  var FAM = P.regras.familia_por_exercicio;
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d) {
      var vistas = {};
      exs(sem, d).forEach(function (e) {
        var f = FAM[e.nome];
        if (!f) return;
        if (vistas[f]) falhas.push('P13 ' + S(sem) + d + ': ' + vistas[f] + ' + ' + e.nome + ' (ambos ' + f + ')');
        vistas[f] = e.nome;
      });
    });
  });
  // 14. braco segue o lift
  var ESPERA = { SUPINO: 'triceps', OMBRO: 'triceps', MORTO: 'biceps', AGACHAMENTO: 'biceps' };
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d) {
      var gs = {};
      exs(sem, d).forEach(function (e) { if (e.categoria === 'braco') gs[e.grupo] = 1; });
      var want = ESPERA[sem.dias[d].lift];
      if (Object.keys(gs).join() !== want) falhas.push('P14 ' + S(sem) + d + ': ' + (Object.keys(gs).join('+') || 'nenhum') + ', esperado ' + want);
    });
  });
  // 15. interferencia
  var SUB = P.regras.subgrupos, INT = P.regras.interferencia;
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d, i) {
      var fora = {};
      var reg = INT[sem.dias[d].lift];
      if (reg) reg.dia.forEach(function (s) { fora[s] = 1; });
      if (i + 1 < DIAS.length && seguidos(d, DIAS[i + 1])) {
        reg = INT[sem.dias[DIAS[i + 1]].lift];
        if (reg) reg.vespera.forEach(function (s) { fora[s] = 1; });
      }
      exs(sem, d).forEach(function (e) {
        if (!e.foco && SUB[e.nome] && fora[SUB[e.nome]]) falhas.push('P15 ' + S(sem) + d + ': ' + e.nome + ' (' + SUB[e.nome] + ')');
      });
    });
  });
  // 16. sem series orfas
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d) {
      exs(sem, d).forEach(function (e) {
        if (!e.foco && e.series.length === 1 && e.categoria !== 'abs') falhas.push('P16 ' + S(sem) + d + ': ' + e.nome + ' com 1 serie');
      });
    });
  });
  // 17. reps
  var LIMITE_REPS = {};
  Object.keys(P.acessorios).forEach(function (n) { if (P.acessorios[n].series[0][1] === 10) LIMITE_REPS[n] = 10; });
  TODAS.forEach(function (sem) {
    DIAS.forEach(function (d) {
      exs(sem, d).forEach(function (e) {
        if (e.categoria === 'abs') return;
        var n = e.series.length;
        e.series.forEach(function (s, j) {
          var backoff = e.foco && e.modo === 'maximos' && j === n - 1;
          var teto = d === 'sexta' ? 12 : (LIMITE_REPS[e.nome] || 8);
          if (s[1] > teto && !backoff) falhas.push('P17 ' + S(sem) + d + ': ' + e.nome + ' serie ' + (j + 1) + ' com ' + s[1] + ' reps');
        });
      });
    });
  });
  return falhas;
}

/* ---------------------------------------------------------------------------
   Do plano para sessoes e series da app (o para_app.py)

   As series entram com feita:false — plano, nao registo. Dias que ja tem
   treino ficam de fora (choques). Um exercicio que a app nao conhece nao e
   inventado: vai para emFalta e nada se grava, porque um plano a meio e pior
   do que nenhum.
   ------------------------------------------------------------------------- */

var PLANO_NOME_NA_APP = {
  'Peso morto convencional': 'Deadlift',
  'Supino plano com barra': 'Flat Barbell Bench Press',
  'Agachamento com barra livre': 'Barbell Squat',
  'Press de ombro com barra': 'Barbell Shoulder Press'
};

function planoParaSessoes(plano, exercicios, sessoesExistentes, proxIds) {
  var bib = {};
  exercicios.forEach(function (e) { bib[e.nome] = e; });
  var datas = {};
  sessoesExistentes.forEach(function (s) { datas[s.data] = 1; });
  var idSessao = proxIds.sessao, idSerie = proxIds.serie;
  var sessoes = [], series = [], choques = [], emFalta = [];

  plano.calendario.forEach(function (sem) {
    plano.config.dias.forEach(function (dia) {
      var d = sem.dias[dia];
      d.exercicios.forEach(function (ex) {
        var nome = PLANO_NOME_NA_APP[ex.nome] || ex.nome;
        if (!bib[nome] && emFalta.indexOf(nome) === -1) emFalta.push(nome);
      });
    });
  });
  if (emFalta.length) return { sessoes: [], series: [], choques: [], emFalta: emFalta };

  plano.calendario.forEach(function (sem) {
    plano.config.dias.forEach(function (dia) {
      var d = sem.dias[dia];
      if (datas[d.data]) { choques.push(d.data); return; }
      sessoes.push({ id: idSessao, data: d.data, inicio: null, fim: null,
        notas: 'Semana ' + sem.semana + ' - ' + d.modo });
      var ordem = 0;
      d.exercicios.forEach(function (ex, i) {
        var e = bib[PLANO_NOME_NA_APP[ex.nome] || ex.nome];
        var porTempo = e.tipo === 'peso_tempo';
        ex.series.forEach(function (s) {
          series.push({ id: idSerie++, sessaoId: idSessao, exercicioId: e.id, data: d.data,
            ordemExercicio: i, ordem: ordem++, peso: s[0],
            reps: porTempo ? 0 : s[1], rir: null, tempoSeg: porTempo ? s[1] : null,
            distancia: null, supersetId: null, recordeOriginal: false, nota: null,
            feita: false });
        });
      });
      idSessao++;
    });
  });
  return { sessoes: sessoes, series: series, choques: choques, emFalta: [] };
}

/* ===========================================================================
   Adaptacao: o plano a olhar para o que foi feito

   Nada disto muda o plano sozinho. Cada funcao devolve SUGESTOES, cada uma
   com o numero que a justifica; o ecra mostra-as com Aceitar e Ignorar.
   Regras combinadas com o Bruno a 13/09/2026:

   - Faltar a segunda (maximos) ou a quinta (pesado) empurra o plano uma
     semana. Faltar a terca ou a sexta segue. So se sugere empurrar quando nao
     houve treino do plano DEPOIS do dia falhado: se ja continuou, empurrar
     baralhava o que ja fez.
   - A carga dos acessorios sai do que ele fez: kg, reps e RIR (quando ha).
     Quem faz exatamente o plano fica com a mesma carga.
   - Os maximos: se o single saiu, o ciclo seguinte sobe a partir do melhor
     single; se falhou (ou nao se fez), nao sobe.
   - Tres sessoes do plano sem progresso num acessorio: sugere tira-lo do
     ciclo seguinte.
   - Uma semana com muitas series aquem das reps: sugere a seguinte a -10%.
   ======================================================================== */

var DIAS_QUE_EMPURRAM = ['segunda', 'quinta'];

/* Liga cada dia do plano a sessao da app que o representa. A sessao guarda
   a identidade em s.plano ({ ciclo, semana, dia }) — e o que a deixa mudar
   de data sem se perder. As do ciclo 1 entraram pelo para_app.py sem ela e
   reconhecem-se pela data e pela nota "Semana N - modo". */
function mapaDoPlano(ciclos, sessoes) {
  var porData = {}, porIdentidade = {};
  sessoes.forEach(function (s) {
    if (s.plano) porIdentidade[s.plano.ciclo + '|' + s.plano.semana + '|' + s.plano.dia] = s;
    else (porData[s.data] = porData[s.data] || []).push(s);
  });
  return ciclos.map(function (rec, i) {
    var plano = gerarPlano(rec.cfg);
    var dias = [];
    plano.calendario.forEach(function (sem) {
      PLANO_DIAS.forEach(function (d) {
        var dia = sem.dias[d];
        var sessao = porIdentidade[rec.dataInicio + '|' + sem.semana + '|' + d] || null;
        if (!sessao) {
          var nota = 'Semana ' + sem.semana + ' - ' + dia.modo;
          sessao = (porData[dia.data] || []).filter(function (s) { return s.notas === nota; })[0] || null;
        }
        dias.push({ ciclo: rec.dataInicio, indiceCiclo: i, semana: sem.semana, dia: d,
          dataPlano: dia.data, data: sessao ? sessao.data : dia.data,
          lift: dia.lift, modo: dia.modo, exercicios: dia.exercicios, sessao: sessao });
      });
    });
    return { rec: rec, plano: plano, dias: dias };
  });
}

function _seriesPorSessao(series) {
  var m = {};
  series.forEach(function (s) { (m[s.sessaoId] = m[s.sessaoId] || []).push(s); });
  return m;
}

function _diasDoMapa(mapa) {
  var todos = [];
  mapa.forEach(function (c) { todos = todos.concat(c.dias); });
  return todos.sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; });
}

function _feitasDoDia(dia, porSessao) {
  if (!dia.sessao) return { total: 0, feitas: 0 };
  var ss = porSessao[dia.sessao.id] || [];
  return { total: ss.length, feitas: ss.filter(serieFeita).length };
}

/* --- Empurrar ------------------------------------------------------------ */

function sugerirEmpurrar(mapa, series, hoje) {
  var porSessao = _seriesPorSessao(series);
  var dias = _diasDoMapa(mapa);
  var ultimoFeito = -1;
  dias.forEach(function (d, i) { if (_feitasDoDia(d, porSessao).feitas > 0) ultimoFeito = i; });
  for (var i = ultimoFeito + 1; i < dias.length; i++) {
    var d = dias[i];
    if (d.data >= hoje) break;
    if (!d.sessao || DIAS_QUE_EMPURRAM.indexOf(d.dia) === -1) continue;
    var afetados = dias.slice(i).filter(function (x) { return x.sessao; }).length;
    return {
      tipo: 'empurrar',
      chave: 'empurrar|' + d.ciclo + '|' + d.semana + '|' + d.dia,
      titulo: 'Empurrar o plano uma semana',
      detalhe: 'Faltou ' + d.dia + ' ' + d.data.slice(8) + '/' + d.data.slice(5, 7) +
        ' (' + NOME_MODO_PLANO[d.modo] + '). ' + afetados + ' treinos passam 7 dias para a frente.',
      desde: d.data
    };
  }
  return null;
}

var NOME_MODO_PLANO = { maximos: 'máximos', volume_8: 'médio', volume_5: 'pesado', leve: 'leve' };

/* Muda 7 dias todas as sessoes do plano, a partir de `desde`, que ainda nao
   tem nenhuma serie feita. Devolve so as copias alteradas. Se uma data de
   destino ja tem outro treino, nao muda nada e diz qual. */
function aplicarEmpurrar(mapa, sessoes, series, desde) {
  var porSessao = _seriesPorSessao(series);
  var mover = _diasDoMapa(mapa).filter(function (d) {
    return d.sessao && d.data >= desde && _feitasDoDia(d, porSessao).feitas === 0;
  });
  var ids = {};
  mover.forEach(function (d) { ids[d.sessao.id] = 1; });
  var ocupadas = {};
  sessoes.forEach(function (s) { if (!ids[s.id]) ocupadas[s.data] = 1; });
  var conflitos = [];
  var novasSessoes = mover.map(function (d) {
    var nova = _copia(d.sessao);
    nova.data = _somarDias(d.sessao.data, 7);
    nova.plano = { ciclo: d.ciclo, semana: d.semana, dia: d.dia };
    if (ocupadas[nova.data]) conflitos.push(nova.data);
    return nova;
  });
  if (conflitos.length) return { sessoes: [], series: [], conflitos: conflitos };
  var novasSeries = [];
  mover.forEach(function (d) {
    (porSessao[d.sessao.id] || []).forEach(function (s) {
      var n = _copia(s);
      n.data = _somarDias(s.data, 7);
      novasSeries.push(n);
    });
  });
  return { sessoes: novasSessoes, series: novasSeries, conflitos: [] };
}

/* --- Carga dos acessorios ------------------------------------------------ */

function _passoKg(kg) { return kg < 60 ? 2.5 : 5; }

/* A carga de catalogo (a media das duas series) que o que foi feito aguenta.
   Cada serie feita da uma estimativa de 1RM com as reps que ainda havia no
   tanque (RIR). Sem RIR: se chegou as reps do plano conta-se RIR 2, que e o
   que o plano pressupoe; se nao chegou, RIR 0. Depois pergunta-se que carga
   faz a segunda serie do plano (a mais pesada, 1,05 x) com RIR 2. */
function cargaDoFeito(alvo, feitas, dia) {
  var melhor = null;
  feitas.forEach(function (s, i) {
    if (!(s.peso > 0) || !(s.reps >= 1)) return;
    var alvoReps = alvo[Math.min(i, alvo.length - 1)][1];
    var rir = Number.isFinite(s.rir) ? s.rir : (s.reps >= alvoReps ? 2 : 0);
    var e1 = s.peso * (1 + (s.reps + rir) / 30);
    if (melhor === null || e1 > melhor) melhor = e1;
  });
  if (melhor === null) return null;
  var baixas = alvo[alvo.length - 1][1];
  var fator = dia === 'sexta' ? 0.88 : 1;
  var kg = melhor / (1 + (baixas + 2) / 30) / 1.05 / fator;
  return arredondarPy(kg / 2.5) * 2.5;
}

function sugerirCargas(mapa, series, exercicios, hoje) {
  var porSessao = _seriesPorSessao(series);
  var idPorNome = {};
  exercicios.forEach(function (e) { idPorNome[e.nome] = e.id; });
  var ultimo = {};   // nome -> { dia, alvo, feitas }
  _diasDoMapa(mapa).forEach(function (d) {
    if (!d.sessao || d.data >= hoje) return;
    d.exercicios.forEach(function (e) {
      if (e.foco || e.categoria === 'abs') return;
      var id = idPorNome[e.nome];
      var feitas = (porSessao[d.sessao.id] || []).filter(function (s) {
        return s.exercicioId === id && serieFeita(s);
      }).sort(function (a, b) { return a.ordem - b.ordem; });
      if (feitas.length) ultimo[e.nome] = { dia: d, alvo: e.series, feitas: feitas };
    });
  });
  var cfgAtual = mapa[mapa.length - 1].rec.cfg;
  var sug = [];
  Object.keys(ultimo).forEach(function (nome) {
    var u = ultimo[nome];
    var acc = cfgAtual.acc.filter(function (a) { return a[0] === nome; })[0];
    if (!acc || !acc[2]) return;
    var feito = cargaDoFeito(u.alvo, u.feitas, u.dia.dia);
    // O que a mesma conta da com o plano feito tal e qual. O arredondamento
    // das series do plano (a 2,5 ou 5) desvia a conta um passo para cima ou
    // para baixo; comparar com isto, e nao com o catalogo, e o que faz quem
    // cumpriu o plano ficar com a mesma carga.
    var neutro = cargaDoFeito(u.alvo, u.alvo.map(function (s) { return { peso: s[0], reps: s[1], rir: null }; }), u.dia.dia);
    if (feito === null || neutro === null) return;
    var antes = acc[2];
    var novo = Math.max(2.5, antes + (feito - neutro));
    if (Math.abs(novo - antes) < _passoKg(Math.min(novo, antes))) return;
    sug.push({
      tipo: 'carga',
      chave: 'carga|' + nome + '|' + u.dia.data,
      titulo: nome + ': ' + num_(antes) + ' → ' + num_(novo) + ' kg',
      detalhe: 'A ' + u.dia.data.slice(8) + '/' + u.dia.data.slice(5, 7) + ' fizeste ' +
        u.feitas.map(function (s) { return num_(s.peso) + '×' + s.reps + (Number.isFinite(s.rir) ? ' RIR ' + s.rir : ''); }).join(', ') +
        ' (plano: ' + u.alvo.map(function (s) { return num_(s[0]) + '×' + s[1]; }).join(', ') + ').',
      nome: nome, antes: antes, novo: novo
    });
  });
  return sug;
}

/* Numero curto para textos do nucleo (sem depender do toLocaleString da UI). */
function num_(v) { return String(Math.round(v * 10) / 10).replace('.', ','); }
/* Com duas casas: 0,25 kg por semana nao pode aparecer como 0,3. */
function kg2_(v) { return String(Math.round(v * 100) / 100).replace('.', ','); }

/* Escreve a carga nova no catalogo de todos os ciclos e refaz as series
   ainda por fazer desse exercicio, de hoje em diante. */
function aplicarCarga(mapa, series, exercicios, nome, novoKg, hoje) {
  var id = (exercicios.filter(function (e) { return e.nome === nome; })[0] || {}).id;
  var porSessao = _seriesPorSessao(series);
  var ciclos = mapa.map(function (c) {
    var rec = _copia(c.rec);
    rec.cfg.acc.forEach(function (a) { if (a[0] === nome) a[2] = novoKg; });
    return rec;
  });
  var alteradas = [];
  mapa.forEach(function (c, i) {
    var prep = _prepararConfig(ciclos[i].cfg);
    c.dias.forEach(function (d) {
      if (!d.sessao || d.data < hoje || !prep.ACC[nome]) return;
      if (!d.exercicios.some(function (e) { return e.nome === nome; })) return;
      var alvo = seriesAcessorio(prep, nome, d.dia);
      var doEx = (porSessao[d.sessao.id] || []).filter(function (s) { return s.exercicioId === id; })
        .sort(function (a, b) { return a.ordem - b.ordem; });
      doEx.forEach(function (s, k) {
        if (serieFeita(s) || !alvo[k]) return;
        var n = _copia(s);
        n.peso = alvo[k][0];
        n.reps = alvo[k][1];
        alteradas.push(n);
      });
    });
  });
  return { ciclos: ciclos, series: alteradas };
}

/* --- Maximos ------------------------------------------------------------- */

/* Para cada lift, o resultado do dia de maximos mais recente que ja passou. */
function resultadosMaximos(mapa, series, exercicios, hoje) {
  var porSessao = _seriesPorSessao(series);
  var idPorNome = {};
  exercicios.forEach(function (e) { idPorNome[e.nome] = e.id; });
  var res = {};
  _diasDoMapa(mapa).forEach(function (d) {
    if (d.modo !== 'maximos' || d.data >= hoje) return;
    var foco = d.exercicios[0];
    var topo = foco.series[2][0];
    var id = idPorNome[PLANO_NOME_NA_APP[foco.nome] || foco.nome];
    var feitas = d.sessao ? (porSessao[d.sessao.id] || []).filter(function (s) {
      return s.exercicioId === id && serieFeita(s) && s.reps >= 1;
    }) : [];
    var melhor = feitas.reduce(function (m, s) { return Math.max(m, s.peso); }, 0);
    res[d.lift] = {
      data: d.data, topo: topo, melhor: feitas.length ? melhor : null,
      estado: !feitas.length ? 'sem-teste' : melhor >= topo ? 'sucesso' : 'falhou'
    };
  });
  return res;
}

/* --- Estagnacao ---------------------------------------------------------- */

function sugerirEstagnacao(mapa, series, exercicios, hoje) {
  var porSessao = _seriesPorSessao(series);
  var idPorNome = {};
  exercicios.forEach(function (e) { idPorNome[e.nome] = e.id; });
  var historico = {};   // nome -> [{ data, e1 }]
  _diasDoMapa(mapa).forEach(function (d) {
    if (!d.sessao || d.data >= hoje) return;
    d.exercicios.forEach(function (e) {
      if (e.foco || e.categoria === 'abs') return;
      var id = idPorNome[e.nome];
      var e1 = (porSessao[d.sessao.id] || []).reduce(function (m, s) {
        if (s.exercicioId !== id || !serieFeita(s) || !(s.peso > 0) || !(s.reps >= 1)) return m;
        return Math.max(m, s.peso * (1 + s.reps / 30));
      }, 0);
      if (e1 > 0) (historico[e.nome] = historico[e.nome] || []).push({ data: d.data, e1: e1 });
    });
  });
  var sug = [];
  Object.keys(historico).forEach(function (nome) {
    var h = historico[nome];
    if (h.length < 4) return;
    var ult = h.slice(-4);
    var depois = Math.max(ult[1].e1, ult[2].e1, ult[3].e1);
    if (depois > ult[0].e1) return;
    sug.push({
      tipo: 'estagnado',
      chave: 'estagnado|' + nome + '|' + ult[3].data,
      titulo: 'Tirar ' + nome + ' do ciclo seguinte',
      detalhe: '3 sessões seguidas sem passar o que fizeste a ' + ult[0].data.slice(8) + '/' +
        ult[0].data.slice(5, 7) + '. O gerador escolhe outro do mesmo grupo.',
      nome: nome
    });
  });
  return sug;
}

/* --- Descarga ------------------------------------------------------------ */

function sugerirDescarga(mapa, series, exercicios, hoje) {
  var porSessao = _seriesPorSessao(series);
  var idPorNome = {};
  exercicios.forEach(function (e) { idPorNome[e.nome] = e.id; });
  var dias = _diasDoMapa(mapa);
  // a semana do plano mais recente que ja acabou toda
  var semanas = {};
  dias.forEach(function (d) {
    var k = d.ciclo + '|' + d.semana;
    (semanas[k] = semanas[k] || []).push(d);
  });
  var fechada = null;
  Object.keys(semanas).forEach(function (k) {
    var ds = semanas[k];
    if (ds.every(function (d) { return d.data < hoje; }) &&
        ds.filter(function (d) { return _feitasDoDia(d, porSessao).feitas > 0; }).length >= 3) {
      if (!fechada || ds[ds.length - 1].data > fechada[fechada.length - 1].data) fechada = ds;
    }
  });
  if (!fechada) return null;
  var comparadas = 0, aquem = 0, rirZero = 0;
  fechada.forEach(function (d) {
    if (!d.sessao) return;
    d.exercicios.forEach(function (e) {
      var id = idPorNome[PLANO_NOME_NA_APP[e.nome] || e.nome];
      var feitas = (porSessao[d.sessao.id] || []).filter(function (s) {
        return s.exercicioId === id && serieFeita(s);
      }).sort(function (a, b) { return a.ordem - b.ordem; });
      feitas.forEach(function (s, i) {
        var alvo = e.series[i];
        if (!alvo || e.categoria === 'abs') return;
        var topoMaximos = e.foco && e.modo === 'maximos' && i === 2;
        comparadas++;
        if (!topoMaximos && s.peso >= alvo[0] * 0.95 && s.reps < alvo[1] - 1) aquem++;
        if (!topoMaximos && s.rir === 0) rirZero++;
      });
    });
  });
  if (comparadas < 10 || (aquem / comparadas < 0.3 && rirZero < 4)) return null;
  var fim = fechada[fechada.length - 1].data;
  return {
    tipo: 'descarga',
    chave: 'descarga|' + fechada[0].ciclo + '|' + fechada[0].semana,
    titulo: 'Semana seguinte mais leve (-10%)',
    detalhe: 'Na semana ' + fechada[0].semana + ', ' + aquem + ' de ' + comparadas +
      ' séries ficaram 2+ reps aquém do plano e ' + rirZero + ' foram a RIR 0.',
    depoisDe: fim
  };
}

function aplicarDescarga(mapa, series, depoisDe) {
  var porSessao = _seriesPorSessao(series);
  var ate = _somarDias(depoisDe, 8);
  var alteradas = [];
  _diasDoMapa(mapa).forEach(function (d) {
    if (!d.sessao || d.data <= depoisDe || d.data > ate) return;
    (porSessao[d.sessao.id] || []).forEach(function (s) {
      if (serieFeita(s) || !(s.peso > 0)) return;
      var n = _copia(s);
      n.peso = arredondarPy(s.peso * 0.9 / 2.5) * 2.5;
      alteradas.push(n);
    });
  });
  return alteradas;
}

/* --- Tudo junto ---------------------------------------------------------- */

function calcularSugestoes(ciclos, sessoes, series, exercicios, hoje, decididas) {
  var mapa = mapaDoPlano(ciclos, sessoes);
  var todas = [];
  var e = sugerirEmpurrar(mapa, series, hoje);
  if (e) todas.push(e);
  var d = sugerirDescarga(mapa, series, exercicios, hoje);
  if (d) todas.push(d);
  todas = todas.concat(sugerirCargas(mapa, series, exercicios, hoje))
    .concat(sugerirEstagnacao(mapa, series, exercicios, hoje));
  return todas.filter(function (s) { return !decididas[s.chave]; });
}

/* ===========================================================================
   Comida: alimentos, pesquisa e somas do dia

   Tres origens de alimentos, todos com a mesma forma:
     { id, origem: 'insa'|'off'|'meu', nome, marca?, codigoBarras?,
       por100: { kcal, p, h, g, fibra, acucar, sal } }
   - 'insa': a Tabela da Composicao de Alimentos (alimentos-insa.json, fixa)
   - 'off' : Open Food Facts, guardado na loja alimentos quando e usado
   - 'meu' : criado a mao

   Cada registo do dia leva uma COPIA dos valores por 100 g. Se a tabela for
   atualizada ou um alimento for editado, o que ja foi comido nao muda.
   ======================================================================== */

var REFEICOES = ['Pequeno-almoço', 'Meio da manhã', 'Almoço', 'Lanche', 'Jantar', 'Ceia', 'Extra'];

function normalizarTexto(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9%]+/g, ' ').trim();
}

function alimentosDoInsa(json) {
  var c = json.campos, i = {};
  c.forEach(function (nome, k) { i[nome] = k; });
  return json.alimentos.map(function (a) {
    return {
      id: 'insa:' + a[i.cod], origem: 'insa', nome: a[i.nome], grupo: a[i.grupo],
      por100: { kcal: a[i.kcal], p: a[i.proteina], h: a[i.hidratos], g: a[i.gordura],
        fibra: a[i.fibra], acucar: a[i.acucares], sal: a[i.sal] }
    };
  });
}

/* Pesquisa por palavras, sem acentos: "frango peito cru" encontra
   "Frango, peito sem pele, cru". Todas as palavras tem de aparecer. Ganha:
   o que ja foi usado (usos), o que tem as palavras no inicio, o nome mais
   curto (o alimento simples antes do prato composto). */
function pesquisarAlimentos(lista, termo, usos, max) {
  var palavras = normalizarTexto(termo).split(' ').filter(Boolean);
  if (!palavras.length) return [];
  usos = usos || {};
  var achados = [];
  lista.forEach(function (a) {
    var nome = normalizarTexto(a.nome + ' ' + (a.marca || ''));
    var inicioPalavra = 0;
    for (var k = 0; k < palavras.length; k++) {
      var pos = nome.indexOf(palavras[k]);
      if (pos === -1) return;
      if (pos === 0 || nome[pos - 1] === ' ') inicioPalavra++;
    }
    // Os pratos compostos do INSA (arroz de pato, arroz doce) descem: quem
    // procura "arroz" quer quase sempre o arroz.
    var pontos = (usos[a.id] || 0) * 100 + inicioPalavra * 10 +
      (nome.indexOf(palavras[0]) === 0 ? 20 : 0) - nome.length / 10 +
      (a.grupo === 'Pratos compostos' ? -15 : 0);
    achados.push({ a: a, pontos: pontos });
  });
  achados.sort(function (x, y) { return y.pontos - x.pontos; });
  return achados.slice(0, max || 30).map(function (x) { return x.a; });
}

function _um(v) { return Math.round(v * 10) / 10; }

function macrosDe(por100, gramas) {
  var f = (gramas || 0) / 100;
  return { kcal: Math.round((por100.kcal || 0) * f), p: _um((por100.p || 0) * f),
    h: _um((por100.h || 0) * f), g: _um((por100.g || 0) * f) };
}

function totaisDoDia(comidas, data) {
  var total = { kcal: 0, p: 0, h: 0, g: 0 }, porRefeicao = {};
  REFEICOES.forEach(function (r) { porRefeicao[r] = { kcal: 0, p: 0, h: 0, g: 0, itens: [] }; });
  comidas.forEach(function (c) {
    if (c.data !== data) return;
    var m = macrosDe(c.por100, c.gramas);
    var r = porRefeicao[c.refeicao] || (porRefeicao[c.refeicao] = { kcal: 0, p: 0, h: 0, g: 0, itens: [] });
    r.itens.push(c);
    ['kcal', 'p', 'h', 'g'].forEach(function (k) { r[k] += m[k]; total[k] += m[k]; });
  });
  ['p', 'h', 'g'].forEach(function (k) {
    total[k] = _um(total[k]);
    Object.keys(porRefeicao).forEach(function (r) { porRefeicao[r][k] = _um(porRefeicao[r][k]); });
  });
  return { total: total, porRefeicao: porRefeicao };
}

/* Um produto do Open Food Facts para a forma de alimento. Sem kcal (nem kJ
   para converter) nao serve: devolve null em vez de inventar. */
function alimentoDoOff(produto) {
  if (!produto) return null;
  var n = produto.nutriments || {};
  function v(k) { var x = n[k + '_100g']; return Number.isFinite(+x) && x !== '' && x !== null ? +x : null; }
  var kcal = v('energy-kcal');
  if (kcal === null && v('energy') !== null) kcal = v('energy') / 4.184;
  if (kcal === null) return null;
  var nome = String(produto.product_name_pt || produto.product_name || '').trim();
  if (!nome) return null;
  var p = v('proteins'), h = v('carbohydrates'), g = v('fat');
  return {
    id: 'off:' + produto.code, origem: 'off', nome: nome,
    marca: String(produto.brands || '').split(',')[0].trim() || null,
    codigoBarras: String(produto.code || '') || null,
    incompleto: p === null || h === null || g === null,
    por100: { kcal: Math.round(kcal), p: p || 0, h: h || 0, g: g || 0,
      fibra: v('fiber') || 0, acucar: v('sugars') || 0, sal: v('salt') || 0 }
  };
}

function registoDeComida(alimento, data, refeicao, gramas) {
  return { data: data, refeicao: refeicao, nome: alimento.nome, marca: alimento.marca || null,
    origem: alimento.origem, ref: alimento.id, gramas: gramas, por100: _copia(alimento.por100) };
}

/* Copia os registos de um dia (ou so de uma refeicao) para outro. */
function copiarComidas(comidas, de, para, refeicao) {
  return comidas.filter(function (c) {
    return c.data === de && (!refeicao || c.refeicao === refeicao);
  }).map(function (c) {
    var n = _copia(c);
    delete n.id;
    n.data = para;
    return n;
  });
}

/* Quantas vezes cada alimento foi usado e com que gramas da ultima vez:
   e o que poe o frango do costume no topo e ja com os 150 g do costume. */
function habitosDeComida(comidas) {
  var usos = {}, gramas = {};
  comidas.slice().sort(function (a, b) { return a.data < b.data ? -1 : 1; }).forEach(function (c) {
    usos[c.ref] = (usos[c.ref] || 0) + 1;
    gramas[c.ref] = c.gramas;
  });
  return { usos: usos, gramas: gramas };
}

/* ===========================================================================
   Macros: meta, gasto medido, avaliacao semanal e sugestoes para a dieta

   A meta arranca numa formula (Mifflin-St Jeor x atividade). Com 2 a 3
   semanas de comida registada e pesagens, passa a haver um gasto MEDIDO:
   o que se comeu em media menos o que o peso mostra que sobrou ou faltou
   (7700 kcal por kg). Esse numero ganha a formula, porque e dele.

   As sugestoes seguem a regra das do treino: numero + Aceitar/Ignorar.
   ======================================================================== */

var KCAL_POR_KG = 7700;

var ATIVIDADES = {
  sedentario: { nome: 'Sentado quase todo o dia', fator: 1.2 },
  leve: { nome: 'Leve (anda a pé, 1-3 treinos)', fator: 1.375 },
  moderado: { nome: 'Moderado (3-5 treinos)', fator: 1.55 },
  alto: { nome: 'Alto (6-7 treinos ou trabalho físico)', fator: 1.725 },
  muitoAlto: { nome: 'Muito alto (atleta, 2x por dia)', fator: 1.9 }
};

/* Por objetivo: ajuste as kcal de manutencao, proteina por kg, e o ritmo de
   peso que se procura (kg por semana). */
var OBJETIVOS = {
  perder: { nome: 'Perder gordura', ajuste: -0.2, proteina: 2.2, ritmo: -0.5 },
  manter: { nome: 'Manter / recompor', ajuste: 0, proteina: 2.0, ritmo: 0 },
  ganhar: { nome: 'Ganhar força e massa', ajuste: 0.1, proteina: 1.8, ritmo: 0.25 }
};

function gastoPorFormula(perfil, pesoKg) {
  var bmr = 10 * pesoKg + 6.25 * perfil.altura - 5 * perfil.idade + (perfil.sexo === 'F' ? -161 : 5);
  return Math.round(bmr * ATIVIDADES[perfil.atividade].fator);
}

function _arredondar(v, passo) { return Math.round(v / passo) * passo; }

/* kcal -> macros: proteina e gordura primeiro (por kg), hidratos o resto. */
function macrosParaKcal(kcal, pesoKg, objetivo) {
  var p = Math.round(OBJETIVOS[objetivo].proteina * pesoKg);
  var g = Math.round(Math.max(0.8 * pesoKg, kcal * 0.25 / 9));
  var h = Math.max(0, Math.round((kcal - p * 4 - g * 9) / 4));
  return { kcal: kcal, p: p, h: h, g: g };
}

function metaDeMacros(perfil, pesoKg, gasto) {
  var obj = OBJETIVOS[perfil.objetivo];
  var kcal = _arredondar(gasto * (1 + obj.ajuste), 50);
  return macrosParaKcal(kcal, pesoKg, perfil.objetivo);
}

/* Media das pesagens nos `dias` ate `data` (inclusive). */
function pesoMedio(pesagens, data, dias) {
  var desde = _somarDias(data, -(dias - 1));
  var v = pesagens.filter(function (p) { return p.data >= desde && p.data <= data && p.kg > 0; });
  if (!v.length) return null;
  return _um(v.reduce(function (s, p) { return s + p.kg; }, 0) / v.length);
}

/* Tendencia do peso em kg/semana: reta dos minimos quadrados nas pesagens da
   janela. Uma pesagem isolada num dia de muita agua pesa pouco numa reta. */
function tendenciaPeso(pesagens, ate, dias) {
  var desde = _somarDias(ate, -(dias - 1));
  var pts = pesagens.filter(function (p) { return p.data >= desde && p.data <= ate && p.kg > 0; })
    .map(function (p) { return [diasEntre(desde, p.data), p.kg]; });
  if (pts.length < 3) return null;
  var xs = pts.map(function (p) { return p[0]; });
  var span = Math.max.apply(null, xs) - Math.min.apply(null, xs);
  if (span < Math.min(14, dias - 1)) return null;
  var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  pts.forEach(function (p) { sx += p[0]; sy += p[1]; sxx += p[0] * p[0]; sxy += p[0] * p[1]; });
  var declive = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  return { kgSemana: Math.round(declive * 7 * 100) / 100, pesagens: n, dias: span };
}

/* ---------------------------------------------------------------------------
   Plano alimentar fixo

   O Bruno come quase sempre o mesmo: um plano para os dias de treino
   (seg/ter/qui/sex) e outro para os de descanso. Nao ha registo diario
   obrigatorio — um dia sem registos conta como o plano desse tipo de dia.

   O plano tem versoes: { versoes: [{ desde, treino: [itens], descanso: [itens] }] }.
   Aceitar um ajuste cria uma versao nova a partir de hoje, e os dias de antes
   continuam a contar com o plano que se comia nessa altura — senao o gasto
   medido mudava para tras sempre que o plano mudasse.
   ------------------------------------------------------------------------- */

function tipoDeDia(data) {
  var d = (_dataUtc(data).getUTCDay() + 6) % 7;   // 0 = segunda
  return [0, 1, 3, 4].indexOf(d) !== -1 ? 'treino' : 'descanso';
}

function versaoDoPlano(planoAlimentar, data) {
  var v = null;
  ((planoAlimentar && planoAlimentar.versoes) || []).forEach(function (x) {
    if (x.desde <= data && (!v || x.desde >= v.desde)) v = x;
  });
  return v;
}

function planoAtualAlimentar(planoAlimentar) {
  var vs = (planoAlimentar && planoAlimentar.versoes) || [];
  return vs.length ? vs[vs.length - 1] : null;
}

function totaisDeItens(itens) {
  var t = { kcal: 0, p: 0, h: 0, g: 0 };
  itens.forEach(function (it) {
    var m = macrosDe(it.por100, it.gramas);
    ['kcal', 'p', 'h', 'g'].forEach(function (k) { t[k] += m[k]; });
  });
  ['p', 'h', 'g'].forEach(function (k) { t[k] = _um(t[k]); });
  return t;
}

/* O que se comeu num dia: o registado, se houver; senao o plano. */
function consumoDoDia(data, comidas, planoAlimentar) {
  var reg = comidas.filter(function (c) { return c.data === data; });
  if (reg.length) return Object.assign(totaisDeItens(reg), { origem: 'registo' });
  var v = versaoDoPlano(planoAlimentar, data);
  var itens = v ? (v[tipoDeDia(data)] || []) : [];
  if (itens.length) return Object.assign(totaisDeItens(itens), { origem: 'plano' });
  return null;
}

/* Dias com comida conhecida (registo ou plano) acima de 800 kcal: abaixo
   disso e um dia registado a metade, e puxava a media para baixo. */
function diasComComida(comidas, ate, dias, planoAlimentar) {
  var out = [];
  for (var i = dias - 1; i >= 0; i--) {
    var data = _somarDias(ate, -i);
    var c = consumoDoDia(data, comidas, planoAlimentar);
    if (c && c.kcal >= 800) out.push(Object.assign({ data: data }, c));
  }
  return out;
}

/* Gasto medido em `dias` (21): media do que se comeu menos a variacao do
   peso convertida em kcal. So com 14+ dias de comida e tendencia de peso. */
function gastoMedido(pesagens, comidas, ate, dias, planoAlimentar) {
  dias = dias || 21;
  var t = tendenciaPeso(pesagens, ate, dias);
  var dc = diasComComida(comidas, ate, dias, planoAlimentar);
  if (!t || dc.length < 14) return null;
  var media = dc.reduce(function (s, d) { return s + d.kcal; }, 0) / dc.length;
  return { gasto: _arredondar(media - t.kgSemana * KCAL_POR_KG / 7, 10),
    kcalMedia: Math.round(media), diasComida: dc.length, tendencia: t };
}

/* Tendencia da cintura em cm/semana, entre a primeira e a ultima medida da
   janela (28 dias), com pelo menos 14 dias entre elas. */
function tendenciaCintura(avaliacoes, ate, dias) {
  dias = dias || 28;
  var desde = _somarDias(ate, -(dias - 1));
  var m = avaliacoes.filter(function (a) { return a.data >= desde && a.data <= ate && a.cintura > 0; })
    .sort(function (a, b) { return a.data < b.data ? -1 : 1; });
  if (m.length < 2) return null;
  var span = diasEntre(m[0].data, m[m.length - 1].data);
  if (span < 14) return null;
  return { cmSemana: Math.round((m[m.length - 1].cintura - m[0].cintura) / span * 7 * 100) / 100,
    primeira: m[0].cintura, ultima: m[m.length - 1].cintura, medidas: m.length, dias: span };
}

/* Mexe `delta` kcal num plano pelas gramas.

   Se o plano tem alimentos marcados como ajustaveis, so esses mexem — e a
   escolha do Bruno (14/09): o arroz do jantar e a aveia do pequeno-almoco e do
   lanche; o meio da manha esta marcado 'subir', so recebe quando e para
   acrescentar. Sem marcas: os alimentos em que os hidratos dao metade ou mais
   das kcal, e se for para tirar mais do que eles tem, entram os de gordura.
   A proteina nunca mexe. Gramas a 5 g, nunca abaixo de 30% do que eram. */
function ajustarPlanoKcal(itens, delta) {
  var copia = itens.map(_copia);
  function kcalDe(it) { return (it.por100.kcal || 0) * it.gramas / 100; }
  function domina(it, macro, fator) { return it.por100.kcal > 0 && (it.por100[macro] || 0) * fator >= 0.5 * it.por100.kcal; }
  var marcados = copia.some(function (it) { return it.ajustavel; });
  var alvo = marcados
    ? copia.filter(function (it) { return it.ajustavel === true || (delta > 0 && it.ajustavel === 'subir'); })
    : copia.filter(function (it) { return domina(it, 'h', 4); });
  var base = alvo.reduce(function (s, it) { return s + kcalDe(it); }, 0);
  if (!marcados && delta < 0 && base * 0.7 < -delta) {
    alvo = alvo.concat(copia.filter(function (it) { return domina(it, 'g', 9) && alvo.indexOf(it) === -1; }));
    base = alvo.reduce(function (s, it) { return s + kcalDe(it); }, 0);
  }
  if (!base) return null;
  var fator = Math.max(0.3, 1 + delta / base);
  var mudancas = [];
  alvo.forEach(function (it) {
    var antes = it.gramas;
    var depois = Math.max(5, _arredondar(antes * fator, 5));
    if (depois === antes) return;
    it.gramas = depois;
    mudancas.push({ refeicao: it.refeicao, nome: it.nome, antes: antes, depois: depois,
      kcal: Math.round((depois - antes) * it.por100.kcal / 100) });
  });
  if (!mudancas.length) return null;
  return { itens: copia, mudancas: mudancas,
    kcal: mudancas.reduce(function (s, m) { return s + m.kcal; }, 0) };
}

/* O treino da ultima semana, para a avaliacao. */
function resumoTreinoSemana(ciclos, sessoes, series, exercicios, hoje) {

  var feitos = dias.filter(function (d) { return _feitasDoDia(d, porSessao).feitas > 0; }).length;
  var res = resultadosMaximos(mapa, series, exercicios, hoje);

/* Sugestoes para o plano alimentar, a partir do peso e da cintura. */
function sugerirDieta(dados, hoje) {
  var perfil = dados.perfil, plano = planoAtualAlimentar(dados.planoAlimentar);
  if (!perfil || !plano || !((plano.treino || []).length || (plano.descanso || []).length)) return [];
  var obj = OBJETIVOS[perfil.objetivo];
  var semanaChave = segundaDaSemana(hoje);
  var sug = [];
  var peso = pesoMedio(dados.pesagens, hoje, 7) || dados.pesoAtual;

  var recentes = dados.pesagens.filter(function (p) { return p.data > _somarDias(hoje, -14) && p.data <= hoje; }).length;
  var t = tendenciaPeso(dados.pesagens, hoje, 21);
  var c = tendenciaCintura(dados.avaliacoes, hoje, 28);
  var textoCintura = c ? ' A cintura ' + (c.cmSemana > 0.05 ? 'sobe ' : c.cmSemana < -0.05 ? 'desce ' : 'está estável, ') +
    (Math.abs(c.cmSemana) > 0.05 ? num_(Math.abs(c.cmSemana)) + ' cm/semana ' : '') +
    '(' + num_(c.primeira) + ' → ' + num_(c.ultima) + ' cm em ' + c.dias + ' dias).' : '';

  if (!t) {
    if (recentes < 3) {
      sug.push({ tipo: 'dieta-pesar', chave: 'dieta-pesar|' + semanaChave, informativa: true,
        titulo: 'Pesa-te 3 ou mais vezes por semana',
        detalhe: 'Só ' + recentes + ' pesagens nas últimas 2 semanas. Com 3 pesagens em 14 dias ou mais a app ' +
          'já vê a tendência e começa a ajustar o plano.' });
    }
  } else {
    var diferenca = obj.ritmo - t.kgSemana;
    var textoPeso = (Math.abs(t.kgSemana) < 0.05 ? 'O peso está parado' : 'O peso ' + (t.kgSemana > 0 ? 'sobe ' : 'desce ') +
      kg2_(Math.abs(t.kgSemana)) + ' kg/semana') + ' (' + t.pesagens + ' pesagens em ' + t.dias + ' dias); para "' +
      obj.nome.toLowerCase() + '" o alvo é ' + (obj.ritmo >= 0 ? '+' : '') + kg2_(obj.ritmo) + ' kg/semana.';
    var recomposicao = c && c.cmSemana <= -0.25 && diferenca < 0 && perfil.objetivo !== 'ganhar';
    if (recomposicao) {
      sug.push({ tipo: 'dieta-recomposicao', chave: 'dieta-recomposicao|' + semanaChave, informativa: true,
        titulo: 'Não mexer: estás a perder gordura',
        detalhe: textoPeso + textoCintura + ' Peso quase parado com a cintura a descer é músculo a ficar e gordura a sair.' });
    } else if (Math.abs(diferenca) >= 0.15) {
      var ajuste = Math.max(-300, Math.min(300, _arredondar(diferenca * KCAL_POR_KG / 7, 50)));
      var aT = (plano.treino || []).length ? ajustarPlanoKcal(plano.treino, ajuste) : null;
      var aD = (plano.descanso || []).length ? ajustarPlanoKcal(plano.descanso, ajuste) : null;
      if (ajuste !== 0 && (aT || aD)) {
        var linhas = [];
        [['Treino', aT], ['Descanso', aD]].forEach(function (par) {
          if (!par[1]) return;
          par[1].mudancas.forEach(function (m) {
            linhas.push(par[0] + ' · ' + m.refeicao + ': ' + m.nome + ' ' + m.antes + ' → ' + m.depois + ' g');
          });
        });
        sug.push({
          tipo: 'dieta-plano', chave: 'dieta-plano|' + semanaChave,
          titulo: (ajuste > 0 ? '+' : '') + ajuste + ' kcal por dia no plano',
          detalhe: textoPeso + textoCintura,
          linhas: linhas,
          novoPlano: { treino: aT ? aT.itens : (plano.treino || []), descanso: aD ? aD.itens : (plano.descanso || []) }
        });
      }
    }
  }

  // proteina do plano (media da semana: 4 dias de treino, 3 de descanso)
  if (peso) {
    var pT = totaisDeItens(plano.treino || []).p, pD = totaisDeItens(plano.descanso || []).p;
    var pMedia = ((plano.treino || []).length && (plano.descanso || []).length) ? (pT * 4 + pD * 3) / 7
      : (plano.treino || []).length ? pT : pD;
    var alvoP = Math.round(obj.proteina * peso);
    if (pMedia < alvoP * 0.85) {
      var falta = Math.round(alvoP - pMedia);
      sug.push({ tipo: 'dieta-proteina', chave: 'dieta-proteina|' + semanaChave, informativa: true,
        titulo: 'O plano tem pouca proteína: faltam ' + falta + ' g por dia',
        detalhe: 'O plano dá ' + Math.round(pMedia) + ' g (' + num_(pMedia / peso) + ' g/kg); para "' +
          obj.nome.toLowerCase() + '" o alvo é ' + alvoP + ' g. ' + falta + ' g são ~' + Math.round(falta / 0.241) +
          ' g de peito de frango cru ou ~' + Math.round(falta / 0.1) + ' g de iogurte grego magro.' });
    }
  }
  return sug.filter(function (s) { return !(dados.decididas || {})[s.chave]; });
}

   registo editado no telemovel fica com a versao do backup, e o que so existe
   na app fica.

   ter o id 1255 para uma sessao de outro dia, e escrever por cima trocava um
   treino por outro sem dizer nada. Por isso cada loja tem uma identidade (o
   que faz de um registo "o mesmo"), e um id igual com identidade diferente e
   um conflito: nao se junta nada e diz-se porque.
   ------------------------------------------------------------------------- */

   aparelho de proposito — e ai que mora a chave da IA. */

var IDENTIDADE_BACKUP = {
  exercicios: function (r) { return String(r.nome || '').trim().toLowerCase(); },
  sessoes: function (r) { return r.data; },
  series: function (r) { return r.data + '|' + r.exercicioId; },
  pesagens: function (r) { return r.data; },
  alimentos: function (r) { return String(r.nome || '').trim().toLowerCase(); },
  comidas: function (r) { return r.data; },
  avaliacoes: function (r) { return r.data; }

function juntarBackup(atual, backup) {
  var conflitos = [];
  var contagem = {};
  LOJAS_BACKUP.forEach(function (loja) {
    var c = { novos: 0, atualizados: 0, iguais: 0 };
    contagem[loja] = c;
    var porId = {};
    (atual[loja] || []).forEach(function (r) { porId[r.id] = r; });
    var identidade = IDENTIDADE_BACKUP[loja];
    (backup[loja] || []).forEach(function (r) {
      var existente = porId[r.id];

      if (identidade && identidade(existente) !== identidade(r)) {
        conflitos.push({ loja: loja, id: r.id, atual: identidade(existente), backup: identidade(r) });
        return;
      }
      if (JSON.stringify(existente) === JSON.stringify(r)) c.iguais++;
      else c.atualizados++;

  return { conflitos: conflitos, contagem: contagem };

  // gramas: 200 g no treino e 150 g no descanso a "180 g" baixava um e subia o outro.
  var atuais = {};

    novoPlano[t].forEach(function (it) {

    });

  }

  tipos.forEach(function (t) {

/* --- Pelo Hermes no Vostro (a subscricao do Claude, sem chave) -------------

      if (!(novo >= 2.5) || !Number.isFinite(novo)) return recusar(s, 'carga inválida');
      if (novo === acc[2]) return recusar(s, 'a carga já é essa');
      if (Math.abs(novo - acc[2]) > acc[2] * IA_MAX_CARGA + 1e-9) {
        return recusar(s, num_(acc[2]) + ' → ' + num_(novo) + ' kg muda mais de 25%');
      }
      // Os kg nao entram em nenhuma das 17 provas (sao so estrutura): nao ha o que validar aqui.
      r = base(s, 'carga', nome);
      r.nome = nome; r.antes = acc[2]; r.novo = novo;
      r.titulo = 'IA · ' + nome + ': ' + num_(acc[2]) + ' → ' + num_(novo) + ' kg';
    } else if (s.tipo === 'estagnado') {
      if (ctx.area === 'comida') return recusar(s, 'fora do foco pedido');
      if (!acc) return recusar(s, '"' + nome + '" não é um acessório do plano');
      var pausados = ctx.pausados || [];
      if (pausados.indexOf(nome) !== -1) return recusar(s, nome + ' já sai no ciclo seguinte');
      var c3;
      try { c3 = progredirConfig(cfg, _somarDias(cfg.dataInicio, 28), hoje, {}, pausados.concat([nome])); }
      catch (e) { return recusar(s, 'o ciclo seguinte não se consegue gerar sem ' + nome); }
      if (!planoPassa(c3)) return recusar(s, 'sem ' + nome + ' o ciclo seguinte falha as 17 provas');
      r = base(s, 'estagnado', nome);
      r.nome = nome;
    } else if (s.tipo === 'descarga') {
      if (ctx.area === 'comida') return recusar(s, 'fora do foco pedido');
      r = base(s, 'descarga', 'semana');
      r.depoisDe = _somarDias(hoje, -1);
    } else if (s.tipo === 'dieta-gramas') {
      if (ctx.area !== 'comida') return recusar(s, 'fora do foco pedido');
      var m = { nome: nome, refeicao: String(s.refeicao || ''), plano: s.plano, gramas: Number(s.gramas) };
      var ap = aplicarDietaGramas(ctx.planoAlimentar, m);
      if (ap.erro) return recusar(s, ap.erro);
      var tipos = m.plano === 'treino' || m.plano === 'descanso' ? [m.plano] : ['treino', 'descanso'];
      m.gramas = ap.gramas;
      r = base(s, 'dieta-plano', nome + '|' + (s.refeicao || '') + '|' + tipos.join('+'));
      r.mudanca = m;
      r.linhas = ap.linhas;
      r.novoPlano = ap.novoPlano;
    } else {
      r = base(s, 'nota', String(s.titulo || '').slice(0, 40));
      r.informativa = true;
    }
    if (usadas[r.chave]) return recusar(s, 'repetida');
    usadas[r.chave] = 1;
    sugestoes.push(r);
  });
  return { sugestoes: sugestoes, recusadas: recusadas };
}

/* ===========================================================================
   Base de dados local (IndexedDB)

   Porque IndexedDB e nao localStorage: 28.747 series ocupam uns 6 MB, e o
   localStorage costuma parar nos 5 MB — e guarda tudo como texto, o que
   obrigaria a reescrever o ficheiro inteiro a cada serie gravada.

   Como as 28.747 series cabem folgadamente na memoria de um iPhone, sao lidas
   todas de uma vez ao arrancar e ficam em Estado. A IndexedDB e o sitio onde
   se escreve; a memoria e o sitio de onde se le. Assim os graficos sao
   instantaneos e nao ha uma unica leitura assincrona no meio do ecra.
   ======================================================================== */

var BD = (function () {
  var NOME = 'treinos', VERSAO = 3, ligacao = null;

  function abrir() {
    if (ligacao) return Promise.resolve(ligacao);
    return new Promise(function (resolve, reject) {
      var pedido = indexedDB.open(NOME, VERSAO);
      pedido.onupgradeneeded = function (e) {
        var bd = e.target.result;
        if (!bd.objectStoreNames.contains('exercicios')) {
          var ex = bd.createObjectStore('exercicios', { keyPath: 'id', autoIncrement: true });
          ex.createIndex('grupo', 'grupo', { unique: false });
          ex.createIndex('nome', 'nome', { unique: false });
        }
        if (!bd.objectStoreNames.contains('sessoes')) {
          var se = bd.createObjectStore('sessoes', { keyPath: 'id', autoIncrement: true });
          se.createIndex('data', 'data', { unique: false });
        }
        if (!bd.objectStoreNames.contains('series')) {
          var sr = bd.createObjectStore('series', { keyPath: 'id', autoIncrement: true });
          sr.createIndex('data', 'data', { unique: false });
          sr.createIndex('sessaoId', 'sessaoId', { unique: false });
          // Indice composto: e o que faz a ficha de um exercicio abrir de
          // imediato mesmo com 6 anos de historico atras.
          sr.createIndex('exercicioData', ['exercicioId', 'data'], { unique: false });
        }
        if (!bd.objectStoreNames.contains('definicoes')) {
          bd.createObjectStore('definicoes', { keyPath: 'chave' });
        }
        // A chave e um id proprio e nao a data: ha dias com duas pesagens
        // (27/06 e 12/07 de 2020, no historico do Bruno) e com a data por
        // chave a segunda apagava a primeira sem dizer nada.
        if (bd.objectStoreNames.contains('pesagens') && e.oldVersion < 2) {
          bd.deleteObjectStore('pesagens');
        }
        if (!bd.objectStoreNames.contains('pesagens')) {
          var pe = bd.createObjectStore('pesagens', { keyPath: 'id', autoIncrement: true });
          pe.createIndex('data', 'data', { unique: false });
        }
        // Versao 3: alimentacao e sugestoes. So se criam lojas novas e vazias —
        // nenhuma das anteriores e tocada, e o teste de migracao prova-o.
        if (!bd.objectStoreNames.contains('alimentos')) {
          var al = bd.createObjectStore('alimentos', { keyPath: 'id', autoIncrement: true });
          al.createIndex('nome', 'nome', { unique: false });
          al.createIndex('codigoBarras', 'codigoBarras', { unique: false });
        }
        if (!bd.objectStoreNames.contains('refeicoes')) {
          bd.createObjectStore('refeicoes', { keyPath: 'id', autoIncrement: true });
        }
        if (!bd.objectStoreNames.contains('comidas')) {
          var co = bd.createObjectStore('comidas', { keyPath: 'id', autoIncrement: true });
          co.createIndex('data', 'data', { unique: false });
        }
        if (!bd.objectStoreNames.contains('avaliacoes')) {
          var av = bd.createObjectStore('avaliacoes', { keyPath: 'id', autoIncrement: true });
          av.createIndex('data', 'data', { unique: false });
        }
        if (!bd.objectStoreNames.contains('sugestoes')) {
          var su = bd.createObjectStore('sugestoes', { keyPath: 'id', autoIncrement: true });
          su.createIndex('estado', 'estado', { unique: false });
        }
      };
      pedido.onsuccess = function () {
        ligacao = pedido.result;
        // Se outro separador pedir uma versao mais nova, esta ligacao tem de
        // sair da frente, senao e ela que fica a bloquear a app do lado de la.
        ligacao.onversionchange = function () { ligacao.close(); ligacao = null; };
        resolve(ligacao);
      };
      pedido.onerror = function () { reject(pedido.error); };

      // A IndexedDB nao falha quando esta bloqueada: fica calada para sempre.
      // Sem isto, uma app aberta noutro separador deixava este ecra em branco
      // sem uma unica mensagem.
      pedido.onblocked = function () {
        reject(new Error('A base está a ser usada noutro separador. ' +
          'Fecha os outros separadores da app e volta a abrir.'));
      };
      setTimeout(function () {
        if (!ligacao) {
          reject(new Error('A base de dados demorou de mais a abrir. ' +
            'Fecha os outros separadores da app e tenta outra vez.'));
        }
      }, 10000);
    });
  }

  function transacao(lojas, modo) {
    return abrir().then(function (bd) { return bd.transaction(lojas, modo); });
  }

  function pedir(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  return {
    abrir: abrir,

    todos: function (loja) {
      return transacao([loja], 'readonly').then(function (t) {
        return pedir(t.objectStore(loja).getAll());
      });
    },

    guardar: function (loja, objeto) {
      return transacao([loja], 'readwrite').then(function (t) {
        return pedir(t.objectStore(loja).put(objeto));
      });
    },

    apagar: function (loja, chave) {
      return transacao([loja], 'readwrite').then(function (t) {
        return pedir(t.objectStore(loja).delete(chave));
      });
    },

    /* Escreve muitos registos numa transacao so. Importar 28.747 series uma a
       uma levaria minutos; assim demora segundos. */
    guardarMuitos: function (loja, objetos) {
      if (!objetos || !objetos.length) return Promise.resolve(0);
      return transacao([loja], 'readwrite').then(function (t) {
        var armazem = t.objectStore(loja);
        return new Promise(function (resolve, reject) {
          t.oncomplete = function () { resolve(objetos.length); };
          t.onerror = function () { reject(t.error); };
          t.onabort = function () { reject(t.error); };
          // Todos os pedidos de seguida, sem esperar pela resposta de cada um:
          // a IndexedDB poe-nos em fila e despacha-os em bloco. Esperar por
          // cada put antes de mandar o seguinte faz cada um dar uma volta ao
          // ciclo de eventos, e com 28.747 series isso pesa muito.
          for (var i = 0; i < objetos.length; i++) armazem.put(objetos[i]);
        });
      });
    },

    /* Apaga muitos registos numa transacao so, pela mesma razao que
       guardarMuitos: mil transacoes separadas sao mil idas ao ciclo de
       eventos, e apagar um exercicio pode levar mil e duzentas series. */
    apagarMuitos: function (loja, chaves) {
      if (!chaves || !chaves.length) return Promise.resolve(0);
      return transacao([loja], 'readwrite').then(function (t) {
        var armazem = t.objectStore(loja);
        return new Promise(function (resolve, reject) {
          t.oncomplete = function () { resolve(chaves.length); };
          t.onerror = function () { reject(t.error); };
          t.onabort = function () { reject(t.error); };
          for (var i = 0; i < chaves.length; i++) armazem.delete(chaves[i]);
        });
      });
    },

    limpar: function (lojas) {
      return transacao(lojas, 'readwrite').then(function (t) {
        lojas.forEach(function (l) { t.objectStore(l).clear(); });
        return new Promise(function (resolve, reject) {
          t.oncomplete = resolve;
          t.onerror = function () { reject(t.error); };
        });
      });
    }
  };
})();
