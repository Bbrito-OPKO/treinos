  { chave: 'volume', nome: 'Volume' },
  { chave: 'exercicio', nome: 'Exercício' },
  { chave: 'esforco', nome: 'Esforço' },
  { chave: 'objetivos', nome: 'Objetivos' },
  { chave: 'recordes', nome: 'Recordes' }
];

/* As metricas que o grafico de um exercicio pode mostrar. */
var METRICAS = [
  { chave: 'peso', nome: 'Peso máx.', campo: 'pesoMax', cor: '#3b82f6', unidade: 'kg' },
  { chave: '1rm', nome: '1RM', campo: 'melhor1RM', cor: '#22c55e', unidade: 'kg' },
  { chave: 'volume', nome: 'Volume', campo: 'volume', cor: '#f59e0b', unidade: 'volume' },
  { chave: 'series', nome: 'Séries', campo: 'series', cor: '#06b6d4', unidade: '' },
  { chave: 'reps', nome: 'Reps', campo: 'reps', cor: '#84cc16', unidade: '' },
  { chave: 'rir', nome: 'RIR', campo: 'rirMedio', cor: '#ec4899', unidade: '' },
  { chave: 'porReps', nome: 'Máx. a N reps', campo: null, cor: '#ef4444', unidade: 'kg' }
];

function metricaAtual() {
  return METRICAS.filter(function (m) { return m.chave === Estado.metricaAnalise; })[0] || METRICAS[0];
}

/* O intervalo escolhido, e as series que lhe pertencem. */
function intervaloAtual() { return intervaloDoPeriodo(Estado.periodo, hojeIso()); }
function seriesDoPeriodo() { return filtrarPorIntervalo(Estado.series, intervaloAtual()); }

/* A barra de periodo, partilhada por todas as analises. */
function seletorDePeriodo() {
  var esc1 = Estado.periodo || {};
  var botoes = PERIODOS.map(function (p) {
    return '<button data-periodo="' + p.chave + '"' +
      (esc1.tipo === p.chave ? ' class="on"' : '') + '>' + esc(p.nome) + '</button>';
  }).join('') +
    '<button data-periodo="datas"' + (esc1.tipo === 'datas' ? ' class="on"' : '') + '>Datas</button>';

  var legenda = '';
  if (esc1.tipo === 'datas' && esc1.de && esc1.ate) {
    legenda = '<p class="mini fraco centro" style="margin:-6px 0 12px">' +
      esc(dataLonga(esc1.de)) + ' a ' + esc(dataLonga(esc1.ate)) + '</p>';
  }
  return '<div class="selseg rolavel">' + botoes + '</div>' + legenda;
}

function ligarSeletorDePeriodo() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-periodo]'), function (b) {
    b.onclick = function () {
      if (b.dataset.periodo === 'datas') return escolherDatas();
      Estado.periodo = { tipo: b.dataset.periodo };
      render();
    };
  });
}

function escolherDatas() {
  var p = Estado.periodo || {};
  var datas = Estado.series.map(function (s) { return s.data; }).filter(Boolean).sort();
  var primeira = datas[0] || hojeIso();

  abrirFolha('Escolher datas',
    '<label class="campo"><span>De</span><input id="pdDe" type="date" value="' +
      (p.de || primeira) + '" min="' + primeira + '" max="' + hojeIso() + '"></label>' +
    '<label class="campo"><span>Até</span><input id="pdAte" type="date" value="' +
      (p.ate || hojeIso()) + '" min="' + primeira + '" max="' + hojeIso() + '"></label>' +
    '<button class="btn primaria larga" id="pdOk">Ver este intervalo</button>',
    function (corpo) {
      corpo.querySelector('#pdOk').onclick = function () {
        var de = corpo.querySelector('#pdDe').value;
        var ate = corpo.querySelector('#pdAte').value;
        if (!de || !ate) { avisar('Faltam as datas'); return; }
        if (de > ate) { var t = de; de = ate; ate = t; }   // trocadas: endireita-se
        Estado.periodo = { tipo: 'datas', de: de, ate: ate };
        fecharFolha();
        render();
      };
    });
}

function renderAnalises() {
  $('#titulo').textContent = 'Análises';
  $('#btVoltar').hidden = true;
  $('#btAcao').hidden = true;

  $('#v-analises').innerHTML = '<div class="selseg rolavel">' + ABAS_ANALISE.map(function (a) {
    return '<button data-aba="' + a.chave + '"' +
      (Estado.abaAnalises === a.chave ? ' class="on"' : '') + '>' + esc(a.nome) + '</button>';
  }).join('') + '</div><div id="corpoAnalise"></div>';

  Array.prototype.forEach.call(document.querySelectorAll('[data-aba]'), function (b) {
    b.onclick = function () { Estado.abaAnalises = b.dataset.aba; render(); };
  });

  var corpo = $('#corpoAnalise');

  if (!Estado.series.length) {
    corpo.innerHTML = '<p class="vazio">Ainda não há treinos.<br>' +
      'Importa o histórico do FitNotes em Definições &rsaquo; Dados.</p>';
    return;
  }

  if (Estado.abaAnalises === 'volume') return analiseVolume(corpo);
  if (Estado.abaAnalises === 'exercicio') return analiseExercicio(corpo);
  if (Estado.abaAnalises === 'esforco') return analiseEsforco(corpo);
  if (Estado.abaAnalises === 'objetivos') return analiseObjetivos(corpo);
  return analiseRecordes(corpo);
}

function nomeDoPeriodo() {
  var p = Estado.periodo || {};
  if (p.tipo === 'datas') return 'de ' + dataCurta(p.de) + ' a ' + dataCurta(p.ate);
  var achado = PERIODOS.filter(function (x) { return x.chave === p.tipo; })[0];
  return achado ? achado.nome.toLowerCase() : 'sempre';
}

function analiseVolume(corpo) {
  var intervalo = intervaloAtual();
  var semanas = agregarPorPeriodo(Estado.series, Estado.exercicios,
    { periodo: 'semana', de: intervalo.de, ate: intervalo.ate });

  var html = seletorDePeriodo();

  if (!semanas.length) {
    corpo.innerHTML = html + '<p class="vazio">Sem treinos neste período.</p>';
    ligarSeletorDePeriodo();
    return;
  }

  var ultima = semanas[semanas.length - 1];
  var anterior = semanas[semanas.length - 2];

  html += '<div class="cartao"><h3>Volume por semana · ' + esc(nomeDoPeriodo()) + '</h3>' +
    grafBarras(semanas, { campo: 'volume', titulo: 'Volume semanal por grupo muscular' }) +
    '</div>';

  html += '<div class="cartao"><h3>Séries por semana · ' + esc(nomeDoPeriodo()) + '</h3>' +
    grafBarras(semanas, { campo: 'series', altura: 170, titulo: 'Séries semanais por grupo' }) +
    '</div>';

  var linhas = Object.keys(ultima.grupos).map(function (g) {
    var antes = anterior && anterior.grupos[g] ? anterior.grupos[g].series : null;
    var delta = antes === null ? '' : (ultima.grupos[g].series - antes >= 0 ? ' +' : ' ') +
      (ultima.grupos[g].series - antes);
    return {
      nome: g, valor: ultima.grupos[g].series,
      texto: plural(ultima.grupos[g].series, 'série', 'séries') + (delta ? ' (' + delta.trim() + ')' : '')
    };
  }).sort(function (a, b) { return b.valor - a.valor; });

  html += '<div class="cartao"><h3>Séries na última semana · desde ' +
    esc(dataCurta(ultima.inicio)) + '</h3>' + grafBarrasH(linhas) +
    '<p class="mini fraco" style="margin:12px 0 0">Entre 10 e 20 séries por grupo por semana é a ' +
    'faixa que a maioria dos estudos usa para hipertrofia. Não é uma regra — é uma referência.</p>' +
    '</div>';

  html += resumoDoPeriodo(intervalo);
  corpo.innerHTML = html;
  ligarSeletorDePeriodo();
}

function resumoDoPeriodo(intervalo) {
  var series = filtrarPorIntervalo(Estado.series, intervalo).filter(serieFeita);
  var volume = series.reduce(function (t, s) {
    return t + (Number.isFinite(s.peso) ? s.peso : 0) * (Number.isFinite(s.reps) ? s.reps : 0);
  }, 0);
  var dias = new Set(series.map(function (s) { return s.data; })).size;
  var datas = series.map(function (s) { return s.data; }).sort();

  return '<div class="cartao"><h3>No período escolhido</h3><div class="linha entre">' +
    '<div class="centro crescer"><div style="font-size:20px;font-weight:700" class="nums">' +
      num(dias, 0) + '</div><div class="mini fraco">treinos</div></div>' +
    '<div class="centro crescer"><div style="font-size:20px;font-weight:700" class="nums">' +
      num(series.length, 0) + '</div><div class="mini fraco">séries</div></div>' +
    '<div class="centro crescer"><div style="font-size:20px;font-weight:700" class="nums">' +
      volumeCurto(volume) + '</div><div class="mini fraco">levantados</div></div>' +
    '</div><p class="mini fraco" style="margin:12px 0 0">' +
    (datas.length ? 'De ' + esc(dataLonga(datas[0])) + ' a ' + esc(dataLonga(datas[datas.length - 1])) : '') +
    '</p></div>';
}

function analiseExercicio(corpo) {
  if (!Estado.exercicioAnalise) {
    var contas = {};
    Estado.series.forEach(function (s) { contas[s.exercicioId] = (contas[s.exercicioId] || 0) + 1; });
    var melhor = Object.keys(contas).sort(function (a, b) { return contas[b] - contas[a]; })[0];
    Estado.exercicioAnalise = melhor ? +melhor : null;
  }
  var e = exercicioPorId(Estado.exercicioAnalise);
  if (!e) { corpo.innerHTML = '<p class="vazio">Escolhe um exercício.</p>'; return; }

  var m = metricaAtual();
  var intervalo = intervaloAtual();

  var html = '<button class="btn larga" id="trocarEx" style="margin-bottom:10px">' +
    esc(e.nome) + ' &#9662;</button>' +
    seletorDePeriodo() +
    '<div class="selseg rolavel" style="margin-top:-4px">' + METRICAS.map(function (x) {
      return '<button data-metrica="' + x.chave + '"' +
        (m.chave === x.chave ? ' class="on"' : '') + '>' + esc(x.nome) + '</button>';
    }).join('') + '</div>';

  // "Máx. a N reps" precisa de saber que N.
  if (m.chave === 'porReps') {
    var feitas = curvaDe(e.id).repsFeitas;
    html += '<div class="selseg rolavel" style="margin-top:-4px">' +
      (feitas.length
        ? feitas.map(function (r) {
            return '<button data-reps="' + r + '"' +
              (Estado.repsDaMetrica === r ? ' class="on"' : '') + '>' + r + '×</button>';
          }).join('')
        : '<button disabled>sem repetições registadas</button>') +
      '</div>';
  }

  var pontos = m.chave === 'porReps'
    ? pesoPorDiaParaReps(seriesDoPeriodo(), e.id, Estado.repsDaMetrica)
        .map(function (p) { return { x: p.data, y: p.peso }; })
    : progressaoExercicio(seriesDoPeriodo(), e.id)
        .filter(function (d) { return d[m.campo] !== null && d[m.campo] !== undefined; })
        .map(function (d) { return { x: d.data, y: d[m.campo] }; });

  if (!pontos.length) {
    html += '<p class="vazio">Sem dados para ' + esc(m.nome.toLowerCase()) +
      ' neste período.</p>';
  } else {
    var valores = pontos.map(function (p) { return p.y; });
    var maximo = Math.max.apply(null, valores);
    var ultimo = pontos[pontos.length - 1].y;
    var formatar = function (v) {
      return m.unidade === 'kg' ? kg(v) : m.unidade === 'volume' ? volumeCurto(v) : num(v, 1);
    };

    html += '<div class="cartao"><h3>' + esc(m.nome) +
      (m.chave === 'porReps' ? ' · ' + Estado.repsDaMetrica + ' reps' : '') +
      ' · ' + esc(nomeDoPeriodo()) + '</h3>' +
      grafLinhas([{ nome: m.nome, cor: m.cor, pontos: pontos }],
        { unidade: m.unidade === 'volume' ? 'volume' : '', desdeZero: m.unidade === 'kg' ? false : true,
          titulo: m.nome + ' de ' + e.nome }) +
      '<div class="linha entre" style="margin-top:12px">' +
        '<div class="centro crescer"><div style="font-size:18px;font-weight:700" class="nums">' +
          formatar(ultimo) + '</div><div class="mini fraco">último</div></div>' +
        '<div class="centro crescer"><div style="font-size:18px;font-weight:700" class="nums">' +
          formatar(maximo) + '</div><div class="mini fraco">melhor no período</div></div>' +
        '<div class="centro crescer"><div style="font-size:18px;font-weight:700" class="nums">' +
          pontos.length + '</div><div class="mini fraco">treinos</div></div>' +
      '</div></div>';
  }

  html += htmlTabelaRepMax(e.id);

  corpo.innerHTML = html;
  $('#trocarEx').onclick = trocarExercicioAnalise;
  ligarSeletorDePeriodo();
  Array.prototype.forEach.call(document.querySelectorAll('[data-metrica]'), function (b) {
    b.onclick = function () { Estado.metricaAnalise = b.dataset.metrica; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-reps]'), function (b) {
    b.onclick = function () { Estado.repsDaMetrica = +b.dataset.reps; render(); };
  });
  ligarLinhasDeSerie();
}

function trocarExercicioAnalise() {
  abrirFolha('Ver a progressão de',
    '<label class="campo"><span>Procurar</span>' +
      '<input id="procA" type="search" autocomplete="off"></label><div id="listaA"></div>',
    function (corpo) {
      var proc = corpo.querySelector('#procA'), lista = corpo.querySelector('#listaA');
      var contas = {};
      Estado.series.forEach(function (s) { contas[s.exercicioId] = (contas[s.exercicioId] || 0) + 1; });

      function desenhar() {
        var termo = normalizarCabecalho(proc.value);
        var visiveis = Estado.exercicios
          .filter(function (e) { return contas[e.id]; })
          .filter(function (e) { return !termo || normalizarCabecalho(e.nome).indexOf(termo) !== -1; })
          .sort(function (a, b) { return contas[b.id] - contas[a.id]; });
        lista.innerHTML = '<div class="lista">' + visiveis.map(function (e) {
          return '<button class="item" data-exa="' + e.id + '">' +
            '<div class="crescer"><div style="font-weight:600">' + esc(e.nome) + '</div>' +
            '<div class="mini fraco">' + esc(e.grupo) + ' · ' +
              plural(contas[e.id], 'série', 'séries') + '</div></div>' +
            '<span class="seta">&#8250;</span></button>';
        }).join('') + '</div>';
        Array.prototype.forEach.call(lista.querySelectorAll('[data-exa]'), function (b) {
          b.onclick = function () {
            Estado.exercicioAnalise = +b.dataset.exa;
            // As repeticoes escolhidas podem nao existir no exercicio novo.
            var feitas = curvaDe(Estado.exercicioAnalise).repsFeitas;
            if (feitas.length && feitas.indexOf(Estado.repsDaMetrica) === -1) {
              Estado.repsDaMetrica = feitas[Math.floor(feitas.length / 2)];
            }
            fecharFolha(); render();
          };
        });
      }
      proc.oninput = desenhar;
      desenhar();
    });
}

function analiseEsforco(corpo) {
  var rir = mediaRir(seriesDoPeriodo());
  var html = seletorDePeriodo();

  if (!rir.comRir) {
    corpo.innerHTML = html + '<div class="cartao"><h3>Ainda sem RIR</h3>' +
      '<p class="suave" style="margin:0">O histórico que veio do FitNotes não traz RIR: ' +
      'a app tinha a coluna mas nunca foi preenchida, nas ' + num(Estado.series.length, 0) +
      ' séries todas.</p>' +
      '<p class="suave">A partir de agora, cada série que gravares com RIR entra aqui — ' +
      'média por treino, média por exercício e a evolução ao longo do tempo.</p>' +
      '<p class="mini fraco" style="margin-bottom:0">RIR é quantas repetições ainda davas ' +
      'quando paraste. RIR 0 é ir à falha; RIR 3 é parar com três no bolso.</p></div>';
    ligarSeletorDePeriodo();
    return;
  }

  html += '<div class="cartao"><h3>RIR médio por treino · ' + esc(nomeDoPeriodo()) + '</h3>' +
    grafLinhas([{ nome: 'RIR médio', cor: '#06b6d4',
      pontos: rir.porSessao.map(function (s) { return { x: s.data, y: s.media }; }) }],
      { titulo: 'Esforço ao longo do tempo' }) +
    '<p class="mini fraco" style="margin:10px 0 0">Mais baixo é mais perto da falha. ' +
    'Uma linha que sobe devagar costuma querer dizer fadiga acumulada ou pesos que já sabem a pouco.' +
    '</p></div>';

  html += '<div class="cartao"><h3>Em números</h3><div class="linha entre">' +
    '<div class="centro crescer"><div style="font-size:21px;font-weight:700" class="nums">' +
      num(rir.global, 1) + '</div><div class="mini fraco">RIR médio</div></div>' +
    '<div class="centro crescer"><div style="font-size:21px;font-weight:700" class="nums">' +
      num(rir.comRir, 0) + '</div><div class="mini fraco">séries com RIR</div></div>' +
    '<div class="centro crescer"><div style="font-size:21px;font-weight:700" class="nums">' +
      num(rir.porSessao.length, 0) + '</div><div class="mini fraco">treinos</div></div>' +
    '</div></div>';

  var linhas = Object.keys(rir.porExercicio).map(function (id) {
    var e = exercicioPorId(+id);
    return {
      nome: e ? e.nome : 'Exercício apagado',
      valor: rir.porExercicio[id].media,
      texto: num(rir.porExercicio[id].media, 1) + ' · ' +
        plural(rir.porExercicio[id].series, 'série', 'séries'),
      cor: e ? corDoGrupo(e.grupo) : '#64748b'
    };
  }).sort(function (a, b) { return a.valor - b.valor; }).slice(0, 15);

  if (linhas.length) {
    html += '<div class="cartao"><h3>Onde treinas mais perto da falha</h3>' +
      grafBarrasH(linhas) + '</div>';
  }
  corpo.innerHTML = html;
  ligarSeletorDePeriodo();
}

function analiseRecordes(corpo) {
  var intervalo = intervaloAtual();
  var prs = detetarRecordes(Estado.series)
    .filter(function (r) {
      if (intervalo.de && r.data < intervalo.de) return false;
      if (intervalo.ate && r.data > intervalo.ate) return false;
      return true;
    });

  var html = seletorDePeriodo();

  if (!prs.length) {
    corpo.innerHTML = html + '<p class="vazio">Nenhum recorde neste período.</p>';
    ligarSeletorDePeriodo();
    return;
  }

  var porSerie = {};
  Estado.series.forEach(function (s) { porSerie[s.id] = s; });

  html += '<div class="cartao"><h3>' + plural(prs.length, 'recorde', 'recordes') + ' · ' +
    esc(nomeDoPeriodo()) + '</h3>' +
    '<p class="mini suave" style="margin:0">Uma série é recorde quando nenhuma anterior do mesmo ' +
    'exercício a bate ao mesmo tempo no peso e nas repetições. É a mesma regra que o FitNotes ' +
    'usa: foi conferida contra os recordes que ele já tinha marcado.</p></div>';

  html += '<div class="lista">' +
    prs.slice().reverse().slice(0, 80).map(function (pr) {
      var s = porSerie[pr.serieId];
      var e = exercicioPorId(pr.exercicioId);
      if (!s) return '';
      return '<button class="item" data-serie="' + s.id + '">' +
        '<div class="crescer"><div style="font-weight:600">' + esc(e ? e.nome : '—') + '</div>' +
        '<div class="mini fraco">' + esc(dataLonga(pr.data)) + ' · ' +
        (s.peso > 0 ? kg(s.peso) : 'peso corporal') + ' × ' + s.reps + '</div></div>' +
        '<span class="etiqueta pr">' + esc(nomeDoRecorde(pr)) + '</span></button>';
    }).join('') + '</div>';

  corpo.innerHTML = html;
  ligarSeletorDePeriodo();
  ligarLinhasDeSerie();
}


/* --------------------------------------------------------------------------
   Analises: objetivos dos levantamentos

   Um objetivo e "chegar a X kg com N repeticoes ate uma data". A marca que
   conta e a mesma da curva: o melhor peso feito com N repeticoes OU MAIS —
   quem faz 8 com um peso fez 5 com esse peso pelo caminho.

   So estes levantamentos e que levam objetivo, de proposito. Sao os que o
   Bruno quis seguir, e ter objetivos em tudo era tirar-lhes o significado.
   ----------------------------------------------------------------------- */

var LEVANTAMENTOS_PRINCIPAIS = [
  'Barbell Squat',
  'Flat Barbell Bench Press',
  'Incline Barbell Bench Press',
  'Deadlift',
  'Barbell Shoulder Press'
];

/* Os que existem mesmo na biblioteca, pela ordem da lista acima. */
function levantamentosComObjetivo() {
  var achados = [];
  LEVANTAMENTOS_PRINCIPAIS.forEach(function (nome) {
    var e = Estado.exercicios.filter(function (x) { return x.nome === nome && !x.arquivado; })[0];
    if (e) achados.push(e);
  });
  return achados;
}

function objetivosGuardados() {
  var lista = Estado.definicoes.objetivos;
  return Array.isArray(lista) ? lista : [];
}

function objetivoDe(exercicioId) {
  return objetivosGuardados().filter(function (o) { return o.exercicioId === exercicioId; })[0] || null;
}

function guardarObjetivos(lista) {
  return guardarDefinicao('objetivos', lista);
}

/* O que conta hoje para um objetivo: a melhor carga com aquelas repeticoes. */
function valorDoObjetivo(o) {
  return melhorPesoParaReps(curvaDe(o.exercicioId), o.reps);
}

/* O fim do ano corrente, que e o prazo por defeito. */
function fimDoAno() {
  var ano = +hojeIso().slice(0, 4);
  var fim = ano + '-12-31';
  return fim > hojeIso() ? fim : (ano + 1) + '-12-31';
}

function analiseObjetivos(corpo) {
  var levantamentos = levantamentosComObjetivo();

  if (!levantamentos.length) {
    corpo.innerHTML = '<p class="vazio">Nenhum dos levantamentos principais está na tua ' +
      'biblioteca.<br>Os objetivos são para: ' + esc(LEVANTAMENTOS_PRINCIPAIS.join(', ')) + '.</p>';
    return;
  }

  var comObjetivo = objetivosGuardados().length;
  var html = '<div class="cartao" style="margin-top:0"><h3>Objetivos para ' +
    esc(fimDoAno().slice(0, 4)) + '</h3>' +
    '<p class="mini fraco" style="margin:0">' +
    (comObjetivo
      ? plural(comObjetivo, 'levantamento com objetivo', 'levantamentos com objetivo') +
        ' de ' + levantamentos.length + '.'
      : 'Define onde queres chegar em cada um. Toca para escolher o peso, as ' +
        'repetições e o prazo.') + '</p></div>';

  html += levantamentos.map(function (e) {
    var o = objetivoDe(e.id);
    if (!o) return cartaoSemObjetivo(e);
    return cartaoComObjetivo(e, o);
  }).join('');

  corpo.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('[data-obj-ex]'), function (b) {
    b.onclick = function () { editarObjetivo(+b.dataset.objEx); };
  });
}

/* Um levantamento ainda sem objetivo: mostra onde esta e convida a definir. */
function cartaoSemObjetivo(e) {
  var curva = curvaDe(e.id);
  var marca5 = melhorPesoParaReps(curva, 5);
  var m = melhores()[e.id];

  return '<div class="cartao"><div class="linha entre" style="margin-bottom:8px">' +
      '<h3 style="margin:0;text-transform:none;font-size:16px;color:var(--texto)">' +
        esc(e.nome) + '</h3>' +
      '<span class="etiqueta">sem objetivo</span>' +
    '</div>' +
    '<p class="mini fraco" style="margin:0 0 12px">' +
      (marca5 !== null ? 'Agora: ' + kg(marca5) + ' a 5 reps' : 'Ainda sem marca a 5 reps') +
      (m && Number.isFinite(m.melhor1RM) ? ' · 1RM ~' + kg(m.melhor1RM) : '') + '</p>' +
    '<button class="btn primaria larga fina" data-obj-ex="' + e.id + '">Definir objetivo</button>' +
    '</div>';
}

/* Um levantamento com objetivo: o progresso e o grafico. */
function cartaoComObjetivo(e, o) {
  var p = progressoDeObjetivo(valorDoObjetivo(o), o, hojeIso());
  if (!p) return cartaoSemObjetivo(e);

  var cor = p.atingido ? 'var(--verde)' : p.adiantado ? 'var(--verde)' : 'var(--ambar)';
  var historico = pesoPorDiaParaReps(Estado.series, o.exercicioId, o.reps)
    .filter(function (x) { return x.data >= o.desde; })
    .map(function (x) { return { x: x.data, y: x.peso }; });

  return '<div class="cartao">' +
    '<div class="linha entre" style="margin-bottom:8px">' +
      '<h3 style="margin:0;text-transform:none;font-size:16px;color:var(--texto)">' +
        esc(e.nome) + '</h3>' +
      '<button class="acao" data-obj-ex="' + e.id + '" style="color:var(--azul)">Mudar</button>' +
    '</div>' +
    '<p class="pequeno suave" style="margin:0 0 10px">' + kg(o.alvo) + ' × ' +
      plural(o.reps, 'rep', 'reps') + ' até ' + esc(dataLonga(o.ate)) + '</p>' +

    '<div style="height:9px;background:var(--sup3);border-radius:99px;overflow:hidden">' +
      '<div style="height:100%;width:' + p.percentagem.toFixed(1) +
      '%;background:' + cor + ';border-radius:99px"></div></div>' +
    '<div class="linha entre mini" style="margin-top:6px">' +
      '<span class="fraco">' + num(p.inicial) + ' kg</span>' +
      '<span style="color:' + cor + ';font-weight:700">' + num(p.percentagem, 0) + '%</span>' +
      '<span class="fraco">' + num(p.alvo) + ' kg</span>' +
    '</div>' +

    '<div class="linha entre" style="margin-top:14px">' +
      '<div class="centro crescer"><div style="font-size:19px;font-weight:700" class="nums">' +
        num(p.atual) + '</div><div class="mini fraco">agora</div></div>' +
      '<div class="centro crescer"><div style="font-size:19px;font-weight:700;color:' + cor +
        '" class="nums">' + (p.atingido ? '✓' : num(Math.abs(p.falta))) + '</div>' +
        '<div class="mini fraco">' + (p.atingido ? 'atingido' : 'kg a subir') + '</div></div>' +
      '<div class="centro crescer"><div style="font-size:19px;font-weight:700" class="nums">' +
        (p.diasRestantes > 0 ? p.diasRestantes : 0) +
        '</div><div class="mini fraco">dias</div></div>' +
    '</div>' +

    (p.atingido ? ''
      : '<p class="pequeno" style="margin:12px 0 0;color:' + cor + '">' +
        (p.adiantado ? 'A cumprir.' : 'Atrasado.') + ' Para hoje, o esperado era ' +
        num(p.esperadoHoje) + ' kg.</p>' +
        (p.ritmoSemanal !== null
          ? '<p class="mini fraco" style="margin:6px 0 0">Daqui para a frente dá ' +
            num(Math.abs(p.ritmoSemanal), 2) + ' kg por semana.</p>'
          : '<p class="mini fraco" style="margin:6px 0 0">A data já passou.</p>')) +

    (historico.length > 1
      ? '<div style="margin-top:12px">' + grafLinhas([
          { nome: 'Feito', cor: '#3b82f6', pontos: historico },
          { nome: 'Objetivo', cor: '#f59e0b', pontos: p.linha }
        ], { altura: 170, desdeZero: false, legenda: true,
             titulo: e.nome + ' a ' + o.reps + ' reps' }) + '</div>'
      : '<p class="mini fraco" style="margin:12px 0 0">Ainda não há séries a ' +
        plural(o.reps, 'rep', 'reps') + ' desde que definiste o objetivo.</p>') +
    '</div>';
}

/* Definir ou mudar o objetivo de um levantamento. */
function editarObjetivo(exercicioId) {
  var e = exercicioPorId(exercicioId);
  if (!e) return;
  var o = objetivoDe(exercicioId);

  abrirFolha(e.nome,
    '<div class="linha" style="gap:10px">' +
      '<label class="campo crescer"><span>Chegar a (kg)</span>' +
        '<input id="obKg" type="number" inputmode="decimal" step="any" value="' +
        (o ? o.alvo : '') + '"></label>' +
      '<label class="campo" style="width:96px"><span>Com (reps)</span>' +
        '<input id="obReps" type="number" inputmode="numeric" value="' +
        (o ? o.reps : 5) + '"></label>' +
    '</div>' +
    '<label class="campo"><span>Até</span>' +
      '<input id="obAte" type="date" value="' + (o ? o.ate : fimDoAno()) +
      '" min="' + hojeIso() + '"></label>' +
    '<p class="mini fraco" id="obAgora"></p>' +
    '<button class="btn primaria larga" id="obGuardar">Guardar objetivo</button>' +
    (o ? '<button class="btn perigo larga" id="obApagar" style="margin-top:8px">' +
      'Apagar objetivo</button>' : ''),
    function (corpo) {
      var campoReps = corpo.querySelector('#obReps');
      var nota = corpo.querySelector('#obAgora');

      /* Mostra a marca de agora, que e o ponto de partida do objetivo. */
      function mostrarAgora() {
        var reps = parseInt(campoReps.value, 10);
        var marca = melhorPesoParaReps(curvaDe(exercicioId), reps);
        nota.textContent = !Number.isFinite(reps) || reps < 1
          ? 'Põe o número de repetições.'
          : marca === null
            ? 'Ainda nunca fizeste ' + reps + ' repetições neste exercício. A contagem começa do zero.'
            : 'Agora estás em ' + num(marca) + ' kg a ' + plural(reps, 'rep', 'reps') +
              '. É daí que a contagem começa.';
      }
      campoReps.oninput = mostrarAgora;
      mostrarAgora();

      corpo.querySelector('#obGuardar').onclick = function () {
        var alvo = parseFloat(corpo.querySelector('#obKg').value);
        var reps = parseInt(campoReps.value, 10);
        var ate = corpo.querySelector('#obAte').value;

        if (!Number.isFinite(alvo) || alvo <= 0) { avisar('Falta o peso do objetivo'); return; }
        if (!Number.isFinite(reps) || reps < 1) { avisar('Faltam as repetições'); return; }
        if (!ate) { avisar('Falta a data'); return; }
        if (ate <= hojeIso()) { avisar('A data tem de ser no futuro'); return; }

        var marca = melhorPesoParaReps(curvaDe(exercicioId), reps);
        var inicial = Number.isFinite(marca) ? marca : 0;
        if (alvo <= inicial) {
          avisar('Já estás em ' + num(inicial) + ' kg. Põe um objetivo mais alto.');
          return;
        }

        // Mudar as repeticoes ou o prazo recomeca a contagem, senao a linha
        // vinha de um ponto de partida que ja nao e o que se decidiu agora.
        var igual = o && o.reps === reps && o.ate === ate;
        var novo = {
          exercicioId: exercicioId,
          alvo: Math.round(alvo * 100) / 100,
          reps: reps,
          ate: ate,
          desde: igual ? o.desde : hojeIso(),
          inicial: igual ? o.inicial : inicial
        };

        var lista = objetivosGuardados().filter(function (x) { return x.exercicioId !== exercicioId; });
        lista.push(novo);
        guardarObjetivos(lista).then(function () {
          fecharFolha(); avisar('Objetivo guardado'); render();
        });
      };

      var apagar = corpo.querySelector('#obApagar');
      if (apagar) {
        apagar.onclick = function () {
          var lista = objetivosGuardados().filter(function (x) { return x.exercicioId !== exercicioId; });
          guardarObjetivos(lista).then(function () {
            fecharFolha(); avisar('Objetivo apagado'); render();
          });
        };
      }
    });
}

function renderPeso() {
  $('#titulo').textContent = 'Peso corporal';
  $('#btVoltar').hidden = true;
  $('#btAcao').hidden = true;
  analisePeso($('#v-peso'));
}

function analisePeso(corpo) {
  var todas = Estado.pesagens.slice()
    .sort(function (a, b) { return a.data < b.data ? -1 : 1; });

  var intervalo = intervaloAtual();
  var pesagens = filtrarPorIntervalo(todas, intervalo);

  var html = seletorDePeriodo() +
    '<div class="cartao">' +
    '<div class="linha" style="gap:8px;align-items:flex-end">' +
      '<label class="campo crescer" style="margin:0"><span>Peso de hoje (kg)</span>' +
        '<input id="pcValor" type="number" inputmode="decimal" step="any" placeholder="' +
        (todas.length ? num(todas[todas.length - 1].kg, 1) : '75,0') + '"></label>' +
      '<button class="btn primaria" id="pcGuardar" style="flex:none">Registar</button>' +
    '</div></div>';

  if (!todas.length) {
    corpo.innerHTML = html +
      '<p class="vazio">Ainda não há pesagens.<br>Regista a primeira aqui em cima.</p>';
    ligarPeso();
    return;
  }

  // O grafico aparece sempre que haja mais do que uma pesagem. Se o periodo
  // escolhido nao tiver pontos que cheguem, desenha-se o historico todo e
  // diz-se que foi isso que se fez — melhor do que o grafico desaparecer sem
  // explicacao.
  if (todas.length > 1) {
    var doGrafico = pesagens.length > 1 ? pesagens : todas;
    var usouTudo = doGrafico !== pesagens;
    html += '<div class="cartao"><h3>Evolução · ' +
      esc(usouTudo ? 'tudo' : nomeDoPeriodo()) + '</h3>' +
      grafLinhas([{ nome: 'Peso', cor: '#22c55e',
        pontos: doGrafico.map(function (p) { return { x: p.data, y: p.kg }; }) }],
        { altura: 220, desdeZero: false, titulo: 'Peso corporal' }) +
      (usouTudo
        ? '<p class="mini fraco" style="margin:10px 0 0">' +
          (pesagens.length
            ? 'Só há ' + plural(pesagens.length, 'pesagem', 'pesagens') + ' em ' + esc(nomeDoPeriodo()) +
              ', por isso está aqui o histórico todo.'
            : 'Não há pesagens em ' + esc(nomeDoPeriodo()) + ', por isso está aqui o histórico todo.') +
          '</p>'
        : pesagens.length < todas.length
          ? '<p class="mini fraco" style="margin:10px 0 0">' +
            plural(todas.length - pesagens.length, 'pesagem fora', 'pesagens fora') +
            ' deste período. Escolhe "Tudo" para as ver.</p>'
          : '') + '</div>';
  }

  var primeira = todas[0], ultima = todas[todas.length - 1];
  var diferenca = ultima.kg - primeira.kg;
  html += '<div class="cartao"><h3>Desde sempre</h3><div class="linha entre">' +
    '<div class="centro crescer"><div style="font-size:20px;font-weight:700" class="nums">' +
      num(ultima.kg, 1) + '</div><div class="mini fraco">' + esc(dataCurta(ultima.data)) +
      '</div></div>' +
    '<div class="centro crescer"><div style="font-size:20px;font-weight:700" class="nums">' +
      (diferenca >= 0 ? '+' : '') + num(diferenca, 1) + '</div><div class="mini fraco">desde ' +
      esc(dataCurta(primeira.data)) + '</div></div>' +
    '<div class="centro crescer"><div style="font-size:20px;font-weight:700" class="nums">' +
      todas.length + '</div><div class="mini fraco">pesagens</div></div>' +
    '</div></div>';

  html += '<div class="lista" style="margin-top:12px"><div class="cab">Últimas pesagens</div>' +
    todas.slice(-10).reverse().map(function (p) {
      return '<button class="item" data-pesagem="' + p.id + '">' +
        '<span class="crescer">' + esc(dataLonga(p.data)) + '</span>' +
        '<span class="nums" style="font-weight:600">' + num(p.kg, 1) + ' kg</span>' +
        '<span class="seta">&#8250;</span></button>';
    }).join('') + '</div>';

  corpo.innerHTML = html;
  ligarPeso();
}

function ligarPeso() {
  var guardar = $('#pcGuardar');
  if (guardar) {
    guardar.onclick = function () {
      var v = parseFloat($('#pcValor').value);
      if (!Number.isFinite(v) || v <= 0) { avisar('Falta o peso'); return; }
      registarPeso(hojeIso(), Math.round(v * 10) / 10);
    };
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-pesagem]'), function (b) {
    b.onclick = function () { editarPesagem(+b.dataset.pesagem); };
  });
  ligarSeletorDePeriodo();
}

/* ===========================================================================
   Vista: Exercicios e dados
   ======================================================================== */

function renderExercicios() {
  // Dois niveis: primeiro os grupos, depois os exercicios do grupo escolhido.
  // Com 131 exercicios, a lista toda de uma vez era uma parede.
  if (Estado.grupoAberto) return renderExerciciosDoGrupo(Estado.grupoAberto);

  $('#titulo').textContent = 'Exercícios';
  $('#btVoltar').hidden = true;
  var acao = $('#btAcao');
  acao.hidden = false;
  acao.textContent = 'Novo';
  acao.onclick = function () { editarExercicio(null); };

  var porGrupo = {};
  Estado.exercicios.filter(function (e) { return !e.arquivado; })
    .forEach(function (e) { (porGrupo[e.grupo] = porGrupo[e.grupo] || []).push(e); });

  var seriesPorGrupo = {};
  Estado.series.forEach(function (s) {
    var e = exercicioPorId(s.exercicioId);
    if (!e) return;
    seriesPorGrupo[e.grupo] = (seriesPorGrupo[e.grupo] || 0) + 1;
  });

  var nomes = Object.keys(porGrupo).sort(function (a, b) {
    var ia = GRUPOS_APP.indexOf(a), ib = GRUPOS_APP.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b);
  });

  var html = '';
  if (!nomes.length) {
    html = '<p class="vazio">Ainda não há exercícios.<br>Importa o histórico ou cria o primeiro.</p>';
  } else {
    html = '<label class="campo"><span>Procurar exercício</span>' +
      '<input id="exProc" type="search" placeholder="agachamento, supino…" autocomplete="off">' +
      '</label><div id="exResultado"></div>' +
      '<div class="lista" id="exGrupos">' + nomes.map(function (g) {
        return '<button class="item" data-grupo="' + esc(g) + '">' +
          '<span style="width:10px;height:10px;border-radius:3px;flex:none;background:' +
            corDoGrupo(g) + '"></span>' +
          '<div class="crescer"><div style="font-weight:600">' + esc(g) + '</div>' +
          '<div class="mini fraco">' + plural(porGrupo[g].length, 'exercício', 'exercícios') +
          ' · ' + plural(seriesPorGrupo[g] || 0, 'série', 'séries') + '</div></div>' +
          '<span class="seta">&#8250;</span></button>';
      }).join('') + '</div>';
  }

  $('#v-exercicios').innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('[data-grupo]'), function (b) {
    b.onclick = function () { Estado.grupoAberto = b.dataset.grupo; render(); };
  });

  // A procura atravessa os grupos: quem sabe o nome nao devia ter de se
  // lembrar em que grupo o pôs.
  var proc = $('#exProc');
  if (proc) {
    // Esta procura nao vive numa folha, vive na propria pagina -- por isso o
    // --teclado nao lhe chega. Ao ganhar foco, pede ao browser para a trazer
    // para dentro do que o teclado deixa ver.
    proc.addEventListener('focus', function () {
      setTimeout(function () {
        proc.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }, 300); // o teclado leva ~250ms a subir; medir antes disso nao serve
    });
    proc.oninput = function () {
      var termo = normalizarCabecalho(proc.value);
      var alvo = $('#exResultado'), grupos = $('#exGrupos');
      if (!termo) { alvo.innerHTML = ''; grupos.hidden = false; return; }
      grupos.hidden = true;
      var achados = Estado.exercicios.filter(function (e) {
        return !e.arquivado && normalizarCabecalho(e.nome).indexOf(termo) !== -1;
      }).sort(function (a, b) { return a.nome.localeCompare(b.nome); });
      alvo.innerHTML = achados.length
        ? '<div class="lista">' + achados.map(itemDaFicha).join('') + '</div>'
        : '<p class="vazio pequeno">Nenhum exercício com esse nome.</p>';
      ligarFichas();
    };
  }
}

/* Uma linha de exercicio, com o que ele ja levou de series e a melhor marca. */
function itemDaFicha(e) {
  var m = melhores()[e.id];
  var n = seriesDoExercicio(e.id).length;
  return '<button class="item" data-ficha="' + e.id + '">' +
    '<div class="crescer"><div style="font-weight:600">' + esc(e.nome) + '</div>' +
    '<div class="mini fraco">' + plural(n, 'série', 'séries') +
    (m ? ' · melhor ' + kg(m.pesoMax) : '') + '</div></div>' +
    '<span class="seta">&#8250;</span></button>';
}

function ligarFichas() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-ficha]'), function (b) {
    b.onclick = function () { fichaExercicio(+b.dataset.ficha); };
  });
}

function renderExerciciosDoGrupo(grupo) {
  $('#titulo').textContent = grupo;
  $('#btVoltar').hidden = false;
  var acao = $('#btAcao');
  acao.hidden = false;
  acao.textContent = 'Novo';
  acao.onclick = function () { editarExercicio(null); };

  var doGrupo = Estado.exercicios
    .filter(function (e) { return !e.arquivado && e.grupo === grupo; })
    .sort(function (a, b) { return a.nome.localeCompare(b.nome); });

  var html = doGrupo.length
    ? '<div class="lista">' + doGrupo.map(itemDaFicha).join('') + '</div>'
    : '<p class="vazio">Este grupo ficou sem exercícios.</p>';

  $('#v-exercicios').innerHTML = html;
  ligarFichas();
}

/* Ha quanto tempo foi o ultimo backup, e em que estado esta o armazenamento.
   Nao ha servidor nenhum: o backup e mesmo a unica copia que existe. */
function estadoDoBackup() {
  var ultimo = Estado.definicoes.ultimoBackup;
  var linhas = [];

  if (!Estado.series.length) {
    linhas.push('<p class="mini fraco" style="margin:12px 0 0">Ainda não há nada para guardar.</p>');
  } else if (!ultimo) {
    linhas.push('<p class="pequeno" style="margin:12px 0 0;color:var(--ambar)">' +
      'Nunca guardaste um backup. Os dados vivem só neste telemóvel — não há cópia ' +
      'em mais lado nenhum.</p>');
  } else {
    var dias = diasEntre(ultimo, hojeIso());
    var cor = dias > 21 ? 'var(--ambar)' : 'var(--suave)';
    linhas.push('<p class="pequeno" style="margin:12px 0 0;color:' + cor + '">Último backup: ' +
      (dias === 0 ? 'hoje' : dias === 1 ? 'ontem' : 'há ' + dias + ' dias') +
      ' (' + esc(dataCurta(ultimo)) + ').' +
      (dias > 21 ? ' Já vai longe.' : '') + '</p>');
  }

  if (Armazenamento.persistente === false) {
    linhas.push('<p class="mini fraco" style="margin-bottom:0">O browser não garantiu ' +
      'armazenamento permanente. Mais uma razão para guardares backups.</p>');
  } else if (Armazenamento.persistente === true) {
    linhas.push('<p class="mini fraco" style="margin-bottom:0">Armazenamento marcado como ' +
      'permanente por este browser.</p>');
  }

  return linhas.join('');
}

function guardarDefinicao(chave, valor) {
  Estado.definicoes[chave] = valor;
  return BD.guardar('definicoes', { chave: chave, valor: valor });
}

function fichaExercicio(id) {
  var e = exercicioPorId(id);
  if (!e) return;
  var m = melhores()[id];
  var series = seriesDoExercicio(id);
  var pontos = progressaoExercicio(Estado.series, id);

  abrirFolha(e.nome,
    '<div class="cartao" style="margin-top:0"><div class="linha entre">' +
      '<div class="centro crescer"><div style="font-size:19px;font-weight:700" class="nums">' +
        (m ? kg(m.pesoMax) : '—') + '</div><div class="mini fraco">peso máximo</div></div>' +
      '<div class="centro crescer"><div style="font-size:19px;font-weight:700" class="nums">' +
        (m ? kg(m.melhor1RM) : '—') + '</div><div class="mini fraco">1RM estimado</div></div>' +
      '<div class="centro crescer"><div style="font-size:19px;font-weight:700" class="nums">' +
        series.length + '</div><div class="mini fraco">séries</div></div>' +
    '</div></div>' +
    (pontos.length > 1 ? '<div class="cartao"><h3>Peso máximo</h3>' +
      grafLinhas([{ nome: 'Peso', cor: '#3b82f6',
        pontos: pontos.filter(function (p) { return p.pesoMax !== null; })
          .map(function (p) { return { x: p.data, y: p.pesoMax }; }) }],
        { altura: 200, desdeZero: false }) + '</div>' : '') +
    htmlTabelaRepMax(id) +
    '<button class="btn primaria larga" id="fRegistar">Registar série hoje</button>' +
    '<button class="btn larga" id="fEditar" style="margin-top:8px">Editar exercício</button>' +
    '<button class="btn perigo larga" id="fApagar" style="margin-top:8px">Apagar exercício</button>',
    function (corpo) {
      corpo.querySelector('#fRegistar').onclick = function () {
        // Poe uma serie no treino de hoje, por fazer, e leva-o para la.
        fecharFolha();
        Estado.dataAtual = hojeIso();
        Estado.exercicioAtivo = null;
        Estado.vista = 'treino';
        Array.prototype.forEach.call(document.querySelectorAll('#separadores button'), function (b) {
          b.classList.toggle('ativa', b.dataset.vista === 'treino');
        });
        Array.prototype.forEach.call(document.querySelectorAll('.vista'), function (v) {
          v.classList.toggle('ativa', v.id === 'v-treino');
        });
        acrescentarSerie(id);
      };
      corpo.querySelector('#fEditar').onclick = function () { editarExercicio(id); };
      corpo.querySelector('#fApagar').onclick = function () { apagarExercicio(id); };
      ligarLinhasDeSerie();
    });
}

/* Apaga um exercicio e tudo o que ele tem registado. Chamado da ficha do
   exercicio e do ecra de editar — antes so estava enterrado no segundo. */
function apagarExercicio(id) {
  var e = exercicioPorId(id);
  if (!e) return;
  var apagadas = seriesDoExercicio(id);
  fecharFolha();

  confirmar('Apagar ' + e.nome,
    apagadas.length
      ? 'Este exercício tem ' + plural(apagadas.length, 'série registada', 'séries registadas') +
        '. Apagar leva as séries também, e isso não se desfaz. Se tiveres dúvidas, ' +
        'guarda antes um backup em Exercícios › Dados.'
      : 'Não tem nenhuma série registada.',
    'Apagar', function () {
      Estado.exercicios = Estado.exercicios.filter(function (x) { return x.id !== id; });
      Estado.series = Estado.series.filter(function (s) { return s.exercicioId !== id; });
      reindexar();
      Promise.all([
        BD.apagar('exercicios', id),
        BD.apagarMuitos('series', apagadas.map(function (s) { return s.id; }))
      ]).then(function () {
        avisar(e.nome + ' apagado');
        if (Estado.exercicioAtivo === id) Estado.exercicioAtivo = null;
        if (Estado.exercicioAnalise === id) Estado.exercicioAnalise = null;
        render();
      });
    });
}

function editarExercicio(id) {
  var e = id ? exercicioPorId(id) : null;
  var grupos = [...new Set(GRUPOS_APP.concat(Estado.exercicios.map(function (x) { return x.grupo; })))];

  abrirFolha(e ? 'Editar exercício' : 'Exercício novo',
    '<label class="campo"><span>Nome</span>' +
      '<input id="xNome" type="text" value="' + esc(e ? e.nome : '') + '" ' +
      'placeholder="Supino inclinado com barra"></label>' +
    '<label class="campo"><span>Grupo muscular</span><select id="xGrupo">' +
      grupos.map(function (g) {
        return '<option value="' + esc(g) + '"' +
          (e && e.grupo === g ? ' selected' : '') + '>' + esc(g) + '</option>';
      }).join('') + '</select></label>' +
    '<label class="campo"><span>Como se mede</span><select id="xTipo">' +
      [['peso_reps', 'Peso e repetições'],
       ['peso_tempo', 'Peso e tempo (prancha, isométricos)'],
       ['distancia_tempo', 'Tempo e distância (cardio)']].map(function (t) {
        return '<option value="' + t[0] + '"' +
          ((e ? tipoDoExercicio(e) : 'peso_reps') === t[0] ? ' selected' : '') +
          '>' + esc(t[1]) + '</option>';
      }).join('') + '</select></label>' +
    '<label class="campo"><span>Descanso entre séries (segundos)</span>' +
      '<input id="xDescanso" type="number" inputmode="numeric" value="' +
      (e && e.descansoSeg ? e.descansoSeg : Estado.definicoes.descansoPadraoSeg) + '"></label>' +
    '<button class="btn primaria larga" id="xGuardar">Guardar</button>' +
    (e ? '<button class="btn perigo larga" id="xApagar" style="margin-top:8px">Apagar exercício</button>' : ''),
    function (corpo) {
      corpo.querySelector('#xGuardar').onclick = function () {
        var nome = corpo.querySelector('#xNome').value.trim();
        if (!nome) { avisar('Falta o nome'); return; }
        var descanso = parseInt(corpo.querySelector('#xDescanso').value, 10);
        var alvo = e || {
          id: proximoId(Estado.exercicios), notas: null, arquivado: false
        };
        alvo.nome = nome;
        alvo.grupo = corpo.querySelector('#xGrupo').value;
        alvo.tipo = corpo.querySelector('#xTipo').value;
        alvo.descansoSeg = Number.isFinite(descanso) && descanso > 0 ? descanso : null;
        if (!e) Estado.exercicios.push(alvo);
        reindexar();
        BD.guardar('exercicios', alvo).then(function () {
          fecharFolha(); avisar('Guardado'); render();
        });
      };
      var apagar = corpo.querySelector('#xApagar');
      if (apagar) apagar.onclick = function () { apagarExercicio(id); };
    });
}

function ligarDefinicoes() {
  $('#dImportarCsv').onclick = function () { pedirFicheiro('.csv,text/csv', importarCsvFicheiro); };
  $('#dImportarBackup').onclick = function () { pedirFicheiro('.json,application/json', importarBackupFicheiro); };

  $('#dExportarCsv').onclick = exportarCsv;
  $('#dProcurarVersao').onclick = procurarAtualizacao;

  $('#ecraLigado').onclick = function () {
    var novo = !Ecra.querAtivo();

      return Ecra.aplicar();
    }).then(function () {
      avisar(novo ? 'O ecrã fica ligado' : 'O ecrã volta a apagar-se sozinho');
      render();
    });
  };

  $('#iaHermes').onclick = function () {
    guardarDefinicao('iaHermes', !Estado.definicoes.iaHermes).then(render);
  };
  if ($('#iaHermesTestar')) $('#iaHermesTestar').onclick = function () {
    var b = this;
    b.disabled = true; b.textContent = 'A testar…';
    chamarHermes('/saude', null, 20000)
      .then(function (r) { avisar(r.hermes ? 'O Vostro responde e o Hermes está lá' : 'O Vostro responde, mas não encontra o Hermes'); })

  };
  if ($('#iaTestar')) $('#iaTestar').onclick = function () {
    var b = this;
    b.disabled = true; b.textContent = 'A testar…';
    chamarIA({ model: IA_MODELO, max_tokens: 1024, fallbacks: 'default',
      messages: [{ role: 'user', content: 'Responde só: OK' }] }, 60000)
      .then(function () { avisar('A chave funciona'); })
      .catch(function (e) { avisar(e.message); })
      .then(function () { b.disabled = false; b.textContent = 'Testar'; });
  };
  if ($('#iaApagar')) $('#iaApagar').onclick = function () {
    var b = this;
    if (!b.dataset.confirmar) { b.dataset.confirmar = '1'; b.textContent = 'Toca outra vez'; return; }
    BD.apagar('definicoes', 'chaveIA').then(function () {
      delete Estado.definicoes.chaveIA;
      avisar('Chave apagada');
      render();
    });
  };
  $('#dsGuardar').onclick = function () {
    var v = parseInt($('#dsValor').value, 10);
    if (!Number.isFinite(v) || v <= 0) { avisar('Valor inválido'); return; }
    guardarDefinicao('descansoPadraoSeg', v).then(function () { avisar('Guardado'); });
  };

  $('#dApagarTudo').onclick = function () {
    confirmar('Apagar todos os dados',
      'Vai apagar ' + plural(Estado.series.length, 'série', 'séries') + ', ' +
      plural(Estado.exercicios.length, 'exercício', 'exercícios') + ' e ' +
      plural(Estado.pesagens.length, 'pesagem', 'pesagens') + '. Isto não se desfaz.',
      'Apagar tudo', function () {
        BD.limpar(['exercicios', 'sessoes', 'series', 'pesagens'])

          .then(function () {

            avisar('Apagado');
            render();

/* Uma pesagem por dia: registar outra vez no mesmo dia substitui. */
function registarPeso(data, kg) {
  var ja = Estado.pesagens.find(function (p) { return p.data === data; });
  var registo = ja || { id: proximoId(Estado.pesagens), data: data, kg: kg };
  registo.kg = kg;
  if (!ja) Estado.pesagens.push(registo);
  BD.guardar('pesagens', registo).then(function () {
    avisar(ja ? 'Peso de hoje atualizado' : 'Peso registado');
    render();
  });
}

function editarPesagem(id) {
  var p = Estado.pesagens.find(function (x) { return x.id === id; });
  if (!p) return;
  abrirFolha(dataLonga(p.data),
    '<label class="campo"><span>Peso (kg)</span>' +
      '<input id="epValor" type="number" inputmode="decimal" step="any" value="' + p.kg + '"></label>' +
    '<button class="btn primaria larga" id="epGuardar">Guardar</button>' +
    '<button class="btn perigo larga" id="epApagar" style="margin-top:8px">Apagar pesagem</button>',
    function (corpo) {
      corpo.querySelector('#epGuardar').onclick = function () {
        var v = parseFloat(corpo.querySelector('#epValor').value);
        if (!Number.isFinite(v) || v <= 0) { avisar('Valor inválido'); return; }
        p.kg = Math.round(v * 10) / 10;
        BD.guardar('pesagens', p).then(function () { fecharFolha(); avisar('Guardado'); render(); });
      };
      corpo.querySelector('#epApagar').onclick = function () {
        Estado.pesagens = Estado.pesagens.filter(function (x) { return x.id !== id; });
        BD.apagar('pesagens', id).then(function () { fecharFolha(); avisar('Apagada'); render(); });
      };
    });
}

/* Pergunta ao service worker se ha versao nova, agora. Diz sempre alguma
   coisa — um botao que fica calado nao serve para nada. */
function procurarAtualizacao() {
  var sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!sw) {
    avisar('Sem service worker: recarrega a página');
    return;
  }

  avisar('A procurar…');
  var canal = new MessageChannel();
  var respondeu = false;

  canal.port1.onmessage = function (e) {
    respondeu = true;
    var estado = e.data && e.data.estado;
    if (estado === 'nova') {
      $('#versaoNova').classList.add('on');
      avisar('Há uma versão nova');
    } else if (estado === 'ja-atualizada') {
      avisar('Já estás na versão mais recente');
    } else {
      avisar('Sem ligação à internet');
    }
  };

  sw.postMessage({ tipo: 'procurar-atualizacao', url: location.href }, [canal.port2]);

  // Um service worker antigo nao sabe responder a esta mensagem; mais vale
  // dizer o que fazer do que deixar o botao pendurado.
  setTimeout(function () {
    if (!respondeu) avisar('Não obtive resposta. Fecha e abre a app.');
  }, 8000);
}

function pedirFicheiro(aceita, aoLer) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = aceita;
  input.onchange = function () {
    var f = input.files && input.files[0];
    if (!f) return;
    var leitor = new FileReader();
    leitor.onload = function () { aoLer(String(leitor.result), f.name); };
    leitor.onerror = function () { avisar('Não consegui ler o ficheiro'); };
    leitor.readAsText(f, 'utf-8');
  };
  input.click();
}

function aplicarImportacao(dados, origem, modo) {
  var presentes = LOJAS_BACKUP.filter(function (l) { return Array.isArray(dados[l]); });
  // Repor limpa as quatro de sempre e as que o ficheiro traz. Um backup antigo,
  // sem alimentacao, nao leva consigo a alimentacao registada na app.
  var aLimpar = ['exercicios', 'sessoes', 'series', 'pesagens'];
  presentes.forEach(function (l) { if (aLimpar.indexOf(l) === -1) aLimpar.push(l); });
  var antes = modo === 'juntar' ? Promise.resolve() : BD.limpar(aLimpar);
  avisar('A importar…');
  antes.then(function () {
    return Promise.all(presentes.map(function (l) { return BD.guardarMuitos(l, dados[l]); }))
      .then(function () {
        // so as definicoes da lista: nunca a chave da IA nem o que for do aparelho
        return Promise.all((Array.isArray(dados.definicoes) ? dados.definicoes : []).filter(function (d) {
          return d && DEFINICOES_NO_BACKUP.indexOf(d.chave) !== -1;
        }).map(function (d) { return guardarDefinicao(d.chave, d.valor); }));
      });
  }).then(function () {
    return carregarTudo();
  }).then(function () {
    Estado.exercicioAnalise = null;
    Estado.exercicioAtivo = null;
    avisar(num(Estado.series.length, 0) + ' séries na app depois de ' +
      (modo === 'juntar' ? 'juntar' : 'importar') + ' o ' + origem);
    render();
  }).catch(function (erro) {
    avisar('A importação falhou: ' + erro.message);
  });
}

function descarregar(nomeFicheiro, texto, tipo) {
  var blob = new Blob([texto], { type: tipo + ';charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = nomeFicheiro;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function exportarCsv() {
  var campos = ['Data', 'Exercicio', 'Grupo', 'Peso (kg)', 'Reps', 'RIR', 'Tempo (s)',
    'Distancia', 'Nota'];
  var linhas = [campos.join(',')];

  Estado.series.slice().sort(_ordemCronologica).forEach(function (s) {
    var e = exercicioPorId(s.exercicioId);
    linhas.push([
      s.data,
      csvCampo(e ? e.nome : ''),
      csvCampo(e ? e.grupo : ''),
      s.peso === null ? '' : s.peso,
      s.reps === null ? '' : s.reps,
      Number.isFinite(s.rir) ? s.rir : '',
      s.tempoSeg === null ? '' : s.tempoSeg,
      s.distancia === null ? '' : s.distancia,
      csvCampo(s.nota || '')
    ].join(','));
  });

  descarregar('treinos-' + hojeIso() + '.csv', linhas.join('\n'), 'text/csv');
  avisar('CSV guardado');
}

/* Poe aspas quando o valor tem virgulas, aspas ou mudancas de linha — a mesma
   regra que o nosso proprio leitor sabe desfazer. */
function csvCampo(valor) {
  var t = String(valor == null ? '' : valor);
  if (/[",\n\r]/.test(t)) return '"' + t.replace(/"/g, '""') + '"';
  return t;
}

  if (Insa.promessa) return Insa.promessa;
  Insa.promessa = fetch('alimentos-insa.json').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (j) {
    Insa.lista = alimentosDoInsa(j);
    Insa.fonte = j.fonte;
    return Insa.lista;
  }).catch(function (e) {
    Insa.promessa = null;
    throw e;

  return Insa.promessa;
}

/* Um dia do plano passa a registado: copia os itens do plano para esse dia. */
function materializarDia(data, itens) {
  var novos = itens.map(function (it) { var n = _copia(it); n.data = data; return n; });
  return gravarComidas(novos).then(function () { return novos; });
}

/* --- Plano alimentar: guardar versoes e editar --------------------------- */

/* Guarda { treino, descanso } como versao a partir de hoje. Se ja ha uma
   versao de hoje, substitui-a (mexer tres vezes no mesmo dia nao cria tres). */
function guardarVersaoPlano(novo) {
  var hoje = hojeIso();
  var pa = _copia(Estado.definicoes.planoAlimentar || { versoes: [] });
  var atual = planoAtualAlimentar(pa);
  var v = { desde: hoje, treino: novo.treino || (atual ? atual.treino : []), descanso: novo.descanso || (atual ? atual.descanso : []) };
  if (atual && atual.desde === hoje) pa.versoes[pa.versoes.length - 1] = v;
  else pa.versoes.push(v);
  return guardarDefinicao('planoAlimentar', pa);
}

function editarPlanoAlimentar(tipo) {
  var atual = planoAtualAlimentar(Estado.definicoes.planoAlimentar);
  var itens = atual ? _copia(atual[tipo] || []) : [];
  var outro = tipo === 'treino' ? 'descanso' : 'treino';
  var registosDoDia = Estado.comidas.filter(function (c) { return c.data === Estado.dataComida; });

  function gravar(novos) {
    var v = {}; v[tipo] = novos;
    return guardarVersaoPlano(v).then(function () { editarPlanoAlimentar(tipo); render(); });
  }

  var t = totaisDeItens(itens);
  var html = '<div class="cartao" style="margin-top:0"><div class="linha entre">' +
    [[t.kcal, 'kcal'], [t.p, 'proteína'], [t.h, 'hidratos'], [t.g, 'gordura']].map(function (x) {
      return '<div class="centro crescer"><div style="font-weight:700;font-size:19px" class="nums">' + num(x[0], 0) +
        '</div><div class="mini fraco">' + x[1] + '</div></div>';
    }).join('') + '</div><p class="mini fraco" style="margin:10px 0 0">Seg, ter, qui e sex são dias de treino; ' +
    'qua, sáb e dom de descanso. Mudar o plano conta a partir de hoje. Os ajustes pelo peso só mexem ' +
    'nos alimentos marcados <b>⇅ ajusta</b> (e nos <b>↑ só sobe</b> quando é para acrescentar); sem marcas, ' +
    'mexem nos hidratos.</p></div>';

  REFEICOES.forEach(function (r) {
    var daRefeicao = itens.map(function (it, i) { return [it, i]; }).filter(function (x) { return x[0].refeicao === r; });
    html += '<div class="lista"><div class="cab">' + esc(r) + '</div>' +
      daRefeicao.map(function (x) {
        var it = x[0], m = macrosDe(it.por100, it.gramas);
        return '<div class="item"><div class="crescer"><div style="font-weight:600">' + esc(it.nome) + '</div>' +
          '<div class="mini fraco">' + m.kcal + ' kcal · P ' + num(m.p) + '</div>' +
          '<button class="etiqueta" data-paajusta="' + x[1] + '" style="margin-top:4px' +
            (it.ajustavel ? ';color:var(--azul)' : '') + '">' +
            (it.ajustavel === true ? '⇅ ajusta' : it.ajustavel === 'subir' ? '↑ só sobe' : 'fixo') + '</button></div>' +
          '<input type="number" inputmode="decimal" data-pag="' + x[1] + '" value="' + it.gramas + '" ' +
            'style="width:72px;min-height:40px;border-radius:10px;padding:0 8px;background:var(--sup2);color:inherit;border:1px solid var(--borda);text-align:right"> g' +
          '<button class="fraco" data-paapagar="' + x[1] + '" style="font-size:20px;padding:0 4px" aria-label="tirar">&times;</button></div>';
      }).join('') +
      '<button class="item" data-paadd="' + esc(r) + '" style="color:var(--azul)">+ Adicionar</button></div>';
  });
  html += (registosDoDia.length ? '<button class="btn larga fina" id="paDoDia">Usar o que registei a ' +
      esc(dataCurta(Estado.dataComida)) + '</button>' : '') +
    (atual && (atual[outro] || []).length ? '<button class="btn larga fina" id="paOutro" style="margin-top:8px">Copiar o plano de ' +
      outro + '</button>' : '');

  abrirFolha('Plano de ' + tipo, html, function (c) {
    Array.prototype.forEach.call(c.querySelectorAll('[data-pag]'), function (inp) {
      inp.onchange = function () {
        var g = +inp.value;
        if (!(g > 0)) { avisar('Gramas em falta'); return; }
        itens[+inp.dataset.pag].gramas = g;
        gravar(itens);
      };
    });
    // fixo -> ajusta (sobe e desce) -> so sobe -> fixo
    Array.prototype.forEach.call(c.querySelectorAll('[data-paajusta]'), function (b) {
      b.onclick = function () {
        var it = itens[+b.dataset.paajusta];
        if (!it.ajustavel) it.ajustavel = true;
        else if (it.ajustavel === true) it.ajustavel = 'subir';
        else delete it.ajustavel;
        gravar(itens);
      };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-paapagar]'), function (b) {
      b.onclick = function () { itens.splice(+b.dataset.paapagar, 1); gravar(itens); };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-paadd]'), function (b) {
      b.onclick = function () { adicionarComida({ plano: tipo }, b.dataset.paadd); };
    });
    if (c.querySelector('#paDoDia')) c.querySelector('#paDoDia').onclick = function () {
      gravar(registosDoDia.map(function (r) { var n = _copia(r); delete n.id; delete n.data; return n; }));
    };
    if (c.querySelector('#paOutro')) c.querySelector('#paOutro').onclick = function () { gravar(_copia(atual[outro])); };
  });
}

/* Onde vai parar um alimento escolhido: um dia (data ISO) ou um plano. */
function juntarAoDestino(destino, alimento, refeicao, gramas) {
  var reg = registoDeComida(alimento, typeof destino === 'string' ? destino : null, refeicao, gramas);
  if (typeof destino === 'string') { fecharFolha(); return gravarComidas([reg]); }
  delete reg.data;
  var atual = planoAtualAlimentar(Estado.definicoes.planoAlimentar);
  var itens = (atual ? _copia(atual[destino.plano] || []) : []).concat([reg]);
  var v = {}; v[destino.plano] = itens;
  return guardarVersaoPlano(v).then(function () { editarPlanoAlimentar(destino.plano); render(); });
}

/* --- Perfil e cintura ----------------------------------------------------- */

function pesoAtual() {
  var p = Estado.pesagens.slice().sort(function (a, b) { return a.data < b.data ? 1 : -1; })[0];
  return p ? p.kg : null;
}

function dadosDieta() {
  var hoje = hojeIso();
  var decididas = {};
  Estado.sugestoes.forEach(function (s) { decididas[s.chave] = 1; });
  var pa = Estado.definicoes.planoAlimentar || null;
  var medido = gastoMedido(Estado.pesagens, Estado.comidas, _somarDias(hoje, -1), 21, pa);
  return {
    perfil: Estado.definicoes.perfilDieta || null, planoAlimentar: pa,
    pesoAtual: pesoAtual(), pesagens: Estado.pesagens, comidas: Estado.comidas,
    avaliacoes: Estado.avaliacoes, decididas: decididas, medido: medido
  };
}

function editarPerfilDieta() {
  var p = Object.assign({ idade: '', altura: '', sexo: 'M', atividade: 'moderado', objetivo: 'manter' },
    Estado.definicoes.perfilDieta || {});
  var peso = pesoMedio(Estado.pesagens, hojeIso(), 7) || pesoAtual();
  var dieta = dadosDieta();
  var plano = planoAtualAlimentar(dieta.planoAlimentar);
  function opcoes(mapa, atual) {
    return Object.keys(mapa).map(function (k) {
      return '<option value="' + k + '"' + (k === atual ? ' selected' : '') + '>' + esc(mapa[k].nome) + '</option>';
    }).join('');
  }
  abrirFolha('Objetivo', '<div id="pdCorpo"></div>', function (c) {
    var corpo = c.querySelector('#pdCorpo');
    corpo.innerHTML = (peso ? '' : '<p class="mini" style="color:var(--ambar);margin-top:0">Sem pesagens: regista o ' +
        'peso primeiro (Peso corporal).</p>') +
      '<label class="campo"><span>Objetivo</span><select id="pdObj">' + opcoes(OBJETIVOS, p.objetivo) + '</select></label>' +
      '<div class="linha" style="gap:8px;margin-bottom:14px">' +
        '<label class="campo crescer" style="margin:0"><span>Idade</span><input id="pdIdade" type="number" inputmode="numeric" value="' + p.idade + '"></label>' +
        '<label class="campo crescer" style="margin:0"><span>Altura (cm)</span><input id="pdAltura" type="number" inputmode="numeric" value="' + p.altura + '"></label>' +
        '<label class="campo crescer" style="margin:0"><span>Sexo</span><select id="pdSexo"><option value="M"' +
          (p.sexo === 'M' ? ' selected' : '') + '>M</option><option value="F"' + (p.sexo === 'F' ? ' selected' : '') +
          '>F</option></select></label></div>' +
      '<label class="campo"><span>Atividade (com os treinos)</span><select id="pdAtiv">' + opcoes(ATIVIDADES, p.atividade) + '</select></label>' +
      '<div class="cartao" style="margin-top:0" id="pdResultado"></div>' +
      '<button class="btn primaria larga" id="pdOk">Guardar</button>';
    var novo = null;
    function atualizar() {
      novo = { objetivo: corpo.querySelector('#pdObj').value, idade: +corpo.querySelector('#pdIdade').value,
        altura: +corpo.querySelector('#pdAltura').value, sexo: corpo.querySelector('#pdSexo').value,
        atividade: corpo.querySelector('#pdAtiv').value };
      var r = corpo.querySelector('#pdResultado');
      if (!peso || !(novo.idade > 10) || !(novo.altura > 100)) {
        r.innerHTML = '<p class="mini fraco" style="margin:0">Preenche idade e altura.</p>';
        return;
      }
      var obj = OBJETIVOS[novo.objetivo];
      var formula = gastoPorFormula(novo, peso);
      var gasto = dieta.medido ? dieta.medido.gasto : formula;
      var linhas = [
        ['Proteína alvo', Math.round(obj.proteina * peso) + ' g (' + num(obj.proteina) + ' g/kg)'],
        ['Gasto pela fórmula', formula + ' kcal'],
        ['Gasto medido', dieta.medido ? dieta.medido.gasto + ' kcal (' + dieta.medido.diasComida + ' dias)' : 'com 21 dias de pesagens'],
        ['Kcal para o objetivo', _arredondar(gasto * (1 + obj.ajuste), 50) + ' kcal']
      ];
      if (plano) {
        linhas.push(['Plano de treino', totaisDeItens(plano.treino || []).kcal + ' kcal']);
        linhas.push(['Plano de descanso', totaisDeItens(plano.descanso || []).kcal + ' kcal']);
      }
      r.innerHTML = linhas.map(function (l) {
        return '<div class="linha entre pequeno" style="padding:3px 0"><span class="suave">' + l[0] + '</span><b>' + esc(l[1]) + '</b></div>';
      }).join('') + '<p class="mini fraco" style="margin:8px 0 0">O ritmo que se procura: ' +
        (obj.ritmo >= 0 ? '+' : '') + num(obj.ritmo, 2) + ' kg/semana. As sugestões mexem nas gramas do plano até lá chegar.</p>';
    }
    Array.prototype.forEach.call(corpo.querySelectorAll('input,select'), function (i) { i.oninput = i.onchange = atualizar; });
    atualizar();
    corpo.querySelector('#pdOk').onclick = function () {
      if (!(novo.idade > 10) || !(novo.altura > 100)) { avisar('Faltam idade e altura'); return; }
      guardarDefinicao('perfilDieta', novo).then(function () { fecharFolha(); avisar('Objetivo guardado'); render(); });
    };
  });
}

/* Avaliacao da semana: a cintura, o que o peso e a cintura andam a fazer, e
   as sugestoes para o plano — tudo no mesmo sitio, uma vez por semana. */
function medirCinturaFolha() {
  var hoje = hojeIso();
  var peso = pesoMedio(Estado.pesagens, hoje, 7);
  var ult = Estado.avaliacoes.filter(function (a) { return a.cintura > 0; })
    .sort(function (a, b) { return a.data < b.data ? 1 : -1; })[0];
  var tc = tendenciaCintura(Estado.avaliacoes, hoje, 28);
  var tp = tendenciaPeso(Estado.pesagens, hoje, 21);
  var sug = sugerirDieta(dadosDieta(), hoje).concat(sugestoesIA('comida'));

  var html = '<div class="cartao" style="margin-top:0">' +
      '<div class="linha entre pequeno"><span class="suave">Peso médio (7 dias)</span><b>' + (peso ? num(peso) + ' kg' : '—') + '</b></div>' +
      '<div class="linha entre pequeno" style="margin-top:4px"><span class="suave">Peso</span><b>' +
        (tp ? (Math.abs(tp.kgSemana) < 0.05 ? 'parado' : (tp.kgSemana > 0 ? '+' : '') + num(tp.kgSemana, 2) + ' kg/semana') : 'faltam pesagens') + '</b></div>' +
      '<div class="linha entre pequeno" style="margin-top:4px"><span class="suave">Cintura</span><b>' +
        (tc ? (tc.cmSemana > 0 ? '+' : '') + num(tc.cmSemana) + ' cm/semana' : ult ? num(ult.cintura) + ' cm a ' + esc(dataCurta(ult.data)) : '—') +
      '</b></div></div>' +
    '<label class="campo"><span>Cintura hoje (cm)</span><input id="ciCm" type="number" inputmode="decimal" value="' +
      (ult && ult.data === hoje ? ult.cintura : '') + '" placeholder="' + (ult ? num(ult.cintura) : '') + '"></label>' +
    '<p class="mini fraco" style="margin:-6px 0 10px">Fita à altura do umbigo, de manhã, em jejum, sem apertar nem ' +
      'encolher a barriga. Sempre da mesma maneira.</p>' +
    '<button class="btn primaria larga" id="ciOk">Guardar a cintura</button>';

  html += sug.length
    ? '<div class="lista" style="margin-top:14px"><div class="cab">' + plural(sug.length, 'sugestão', 'sugestões') + '</div>' +
      sug.map(function (s, i) {
        return '<div class="item" style="display:block"><div style="font-weight:600">' + esc(s.titulo) + '</div>' +
          '<div class="mini fraco" style="margin:3px 0 6px">' + esc(s.detalhe) + '</div>' +
          (s.linhas ? '<div class="mini" style="margin:0 0 10px">' + s.linhas.map(esc).join('<br>') + '</div>' : '') +
          '<div class="linha" style="gap:8px">' +
          '<button class="btn primaria fina crescer" data-dtaceitar="' + i + '">' + (s.novoPlano ? 'Aceitar' : 'Ok') + '</button>' +
          '<button class="btn fina crescer" data-dtignorar="' + i + '">Ignorar</button></div></div>';
      }).join('') + '</div>'
    : '<p class="mini fraco" style="margin-top:14px">Sem sugestões esta semana.</p>';
  if (iaLigada()) {
    html += '<button class="btn larga fina" id="ciIA" style="margin-top:12px;color:var(--azul)">Pedir revisão à IA</button>' +
      '<div style="margin-top:12px">' + htmlRecusadasIA('comida') + '</div>';
  }

  abrirFolha('Avaliação da semana', html, function (c) {
    if (c.querySelector('#ciIA')) c.querySelector('#ciIA').onclick = function () {
      pedirRevisaoIA('comida', this).then(function (ok) { if (ok) { render(); medirCinturaFolha(); } });
    };
    c.querySelector('#ciOk').onclick = function () {
      var cm = +c.querySelector('#ciCm').value;
      if (!(cm > 40 && cm < 200)) { avisar('Cintura em cm'); return; }
      var existente = Estado.avaliacoes.filter(function (a) { return a.data === hoje; })[0];
      var reg = existente || { id: proximoId(Estado.avaliacoes), data: hoje };
      reg.cintura = cm;
      reg.pesoMedio = peso;
      BD.guardar('avaliacoes', reg).then(function () {
        if (!existente) Estado.avaliacoes.push(reg);
        avisar('Cintura guardada');
        render();
        medirCinturaFolha();   // reabre com a tendencia e as sugestoes ja com esta medida
      });
    };
    Array.prototype.forEach.call(c.querySelectorAll('[data-dtaceitar]'), function (b) {
      b.onclick = function () {
        var s = sug[+b.dataset.dtaceitar];
        var novoPlano = s.novoPlano;
        if (s.mudanca) {
          // Da IA: refaz-se sobre o plano de AGORA, que pode ja ter outra sugestao aceite.
          var ap = aplicarDietaGramas(Estado.definicoes.planoAlimentar, s.mudanca);
          if (ap.erro) { avisar('Não aplico: ' + ap.erro); return; }
          novoPlano = ap.novoPlano;
        }
        b.disabled = true;
        (novoPlano ? guardarVersaoPlano(novoPlano) : Promise.resolve())
          .then(function () { return decidirSugestao(s, 'aceite'); })
          .then(function () {
            avisar(s.novoPlano ? 'Plano atualizado a partir de hoje' : 'Anotado');
            render();
            medirCinturaFolha();
          });
      };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-dtignorar]'), function (b) {
      b.onclick = function () {
        decidirSugestao(sug[+b.dataset.dtignorar], 'ignorada').then(function () { render(); medirCinturaFolha(); });
      };
    });
  });
}

function gravarComidas(novas) {
  if (!novas.length) return Promise.resolve(0);
  var prox = proximoId(Estado.comidas);
  novas.forEach(function (c) { c.id = prox++; });
  return BD.guardarMuitos('comidas', novas).then(function () {
    Estado.comidas = Estado.comidas.concat(novas);
    render();
    return novas.length;
  });
}

/* --- Folha de adicionar --------------------------------------------------- */

function adicionarComida(data, refeicao) {
  var habitos = habitosDeComida(Estado.comidas);
  abrirFolha(refeicao, '<div id="acCorpo"></div>', function (c) {
    var corpo = c.querySelector('#acCorpo');
    corpo.innerHTML =
      '<label class="campo"><span>Procurar alimento</span>' +
      '<input id="acProc" type="search" placeholder="frango, arroz, iogurte…" autocomplete="off"></label>' +
      '<div class="linha" style="gap:8px;margin-bottom:12px">' +
        '<button class="btn fina crescer" id="acBarras">Código de barras</button>' +
        '<button class="btn fina crescer" id="acCriar">Criar alimento</button></div>' +
      '<div id="acLista"></div>';
    var lista = corpo.querySelector('#acLista');

    function linhaAlimento(a, i) {
      return '<button class="item" data-aci="' + i + '"><div class="crescer">' +
        '<div style="font-weight:600">' + esc(a.nome) + (a.marca ? ' <span class="fraco">· ' + esc(a.marca) + '</span>' : '') + '</div>' +
        '<div class="mini fraco">' + num(a.por100.kcal, 0) + ' kcal · P ' + num(a.por100.p) + ' · H ' +
        num(a.por100.h) + ' · G ' + num(a.por100.g) + ' /100 g' +
        (a.origem === 'off' ? ' · OFF' : a.origem === 'meu' ? ' · meu' : '') + '</div></div></button>';
    }
    function mostrar(achados, extra) {
      lista.innerHTML = (achados.length ? '<div class="lista">' + achados.map(linhaAlimento).join('') + '</div>' : '') + (extra || '');
      Array.prototype.forEach.call(lista.querySelectorAll('[data-aci]'), function (b) {
        b.onclick = function () { escolherGramas(achados[+b.dataset.aci], data, refeicao, habitos); };
      });
      var online = lista.querySelector('#acOnline');
      if (online) online.onclick = function () { procurarOnline(corpo.querySelector('#acProc').value); };
    }
    function inicio() {
      // sem texto: os mais usados e as refeicoes guardadas
      var usados = Object.keys(habitos.usos).sort(function (a, b) { return habitos.usos[b] - habitos.usos[a]; });
      var todos = todosOsAlimentos(), porId = {};
      todos.forEach(function (a) { porId[a.id] = a; });
      var frequentes = usados.map(function (id) { return porId[id]; }).filter(Boolean).slice(0, 12);
      var modelos = Estado.refeicoes.map(function (m, i) {
        var kcal = m.itens.reduce(function (s, it) { return s + macrosDe(it.por100, it.gramas).kcal; }, 0);
        return '<button class="item" data-acm="' + i + '"><div class="crescer"><div style="font-weight:600">' +
          esc(m.nome) + '</div><div class="mini fraco">' + m.itens.length + ' alimentos · ' + kcal + ' kcal</div></div></button>';
      }).join('');
      mostrar(frequentes, modelos ? '<div class="lista"><div class="cab">Refeições guardadas</div>' + modelos + '</div>' : '');
      if (frequentes.length) lista.querySelector('.lista').insertAdjacentHTML('afterbegin', '<div class="cab">Mais usados</div>');
      Array.prototype.forEach.call(lista.querySelectorAll('[data-acm]'), function (b) {
        b.onclick = function () {
          var m = Estado.refeicoes[+b.dataset.acm];
          if (typeof data !== 'string') {
            var atual = planoAtualAlimentar(Estado.definicoes.planoAlimentar);
            var v = {}; v[data.plano] = (atual ? _copia(atual[data.plano] || []) : []).concat(m.itens.map(function (it) {
              var n = _copia(it); n.refeicao = refeicao; return n;
            }));
            guardarVersaoPlano(v).then(function () { editarPlanoAlimentar(data.plano); render(); });
            return;
          }
          fecharFolha();
          gravarComidas(m.itens.map(function (it) {
            var n = _copia(it); n.data = data; n.refeicao = refeicao; return n;
          })).then(function (n) { avisar(m.nome + ': ' + n + ' alimentos'); });
        };
      });
    }
    function procurarOnline(termo) {
      if (!termo.trim()) return;
      lista.innerHTML = '<p class="mini fraco">A procurar no Open Food Facts…</p>';
      var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&json=1&page_size=20' +
        '&fields=code,product_name,product_name_pt,brands,nutriments&search_terms=' + encodeURIComponent(termo);
      fetch(url).then(function (r) { return r.json(); }).then(function (j) {
        var achados = (j.products || []).map(alimentoDoOff).filter(Boolean);
        mostrar(achados, achados.length ? '' : '<p class="mini fraco">Nada no Open Food Facts com esse nome.</p>');
      }).catch(function () {
        lista.innerHTML = '<p class="mini" style="color:var(--ambar)">Sem rede: o Open Food Facts precisa de internet. ' +
          'A tabela do INSA funciona sem.</p>';
      });
    }

    var proc = corpo.querySelector('#acProc');
    proc.oninput = function () {
      if (!proc.value.trim()) return inicio();
      var achados = pesquisarAlimentos(todosOsAlimentos(), proc.value, habitos.usos, 30);
      mostrar(achados, '<button class="btn larga fina" id="acOnline" style="margin-top:4px">Procurar "' +
        esc(proc.value) + '" no Open Food Facts</button>');
    };
    corpo.querySelector('#acBarras').onclick = function () { lerCodigoBarras(data, refeicao, habitos); };
    corpo.querySelector('#acCriar').onclick = function () { criarAlimento(data, refeicao, habitos, proc.value); };
    if (!Insa.lista) {
      lista.innerHTML = '<p class="mini fraco">A carregar a tabela de alimentos…</p>';
      carregarInsa().then(inicio).catch(function (e) {
        lista.innerHTML = '<p class="mini" style="color:var(--ambar)">Não carreguei a tabela do INSA (' + esc(e.message) + ').</p>';
      });
    } else {
      inicio();
    }
  });
}

/* Alimentos de fora (OFF) ficam guardados na loja ao serem usados: da proxima
   vez aparecem na pesquisa sem rede. */
function guardarAlimentoSeFor(a) {
  if (a.origem === 'insa') return Promise.resolve(a);
  var existente = Estado.alimentos.filter(function (x) { return x.id === a.id; })[0];
  if (existente) return Promise.resolve(existente);
  var registo = _copia(a);
  return BD.guardar('alimentos', registo).then(function () {
    Estado.alimentos.push(registo);
    return registo;
  });
}

function escolherGramas(a, data, refeicao, habitos) {

      '<label class="campo"><span>Gramas</span><input id="egG" type="number" inputmode="decimal" value="' +
      inicial + '"></label><div class="cartao" style="margin-top:0" id="egMacros"></div>' +
      '<button class="btn primaria larga" id="egOk">Adicionar a ' + esc(refeicao) + '</button>';
    var campo = corpo.querySelector('#egG');
    function atualizar() {
      var m = macrosDe(a.por100, +campo.value || 0);
      corpo.querySelector('#egMacros').innerHTML = '<div class="linha entre">' +
        [[m.kcal, 'kcal'], [m.p, 'proteína'], [m.h, 'hidratos'], [m.g, 'gordura']].map(function (x) {
