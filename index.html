/* --- Codigo de barras ------------------------------------------------------
   O Safari do iPhone nao tem BarcodeDetector, por isso usa-se a ZXing
   (@zxing/browser 0.1.5, MIT), guardada ao lado da app e na cache do service
   worker: le o codigo sem rede, e um produto ja usado encontra-se sem rede.
   So se carrega a primeira vez que se carrega no botao (sao 400 KB). */
var ZXING_URL = 'zxing-browser.min.js';

function carregarZxing() {
  if (window.ZXingBrowser) return Promise.resolve(window.ZXingBrowser);
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = ZXING_URL;
    s.onload = function () { window.ZXingBrowser ? resolve(window.ZXingBrowser) : reject(new Error('ZXing não carregou')); };
    s.onerror = function () { reject(new Error('sem rede para o leitor')); };
    document.head.appendChild(s);
  });
}

function procurarCodigo(codigo) {
  var local = Estado.alimentos.filter(function (a) { return a.codigoBarras === codigo; })[0];
  if (local) return Promise.resolve(local);
  return fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(codigo) +
    '.json?fields=code,product_name,product_name_pt,brands,nutriments')
    .then(function (r) { return r.status === 404 ? { status: 0 } : r.json(); })
    .then(function (j) { return j && j.status === 1 ? alimentoDoOff(j.product) : null; });
}

function lerCodigoBarras(data, refeicao, habitos) {
  var controlos = null;
  function parar() { try { if (controlos) controlos.stop(); } catch (e) { /* ja parado */ } controlos = null; }
  abrirFolha('Código de barras',
    '<video id="cbVideo" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:280px"></video>' +
    '<p class="mini fraco" id="cbEstado">A abrir a câmara…</p>' +
    '<div class="linha" style="gap:8px"><input id="cbManual" inputmode="numeric" placeholder="ou escreve o número" ' +
      'style="flex:1;min-height:44px;border-radius:10px;padding:0 12px;background:var(--sup2);color:inherit;border:1px solid var(--borda)">' +
    '<button class="btn fina" id="cbOk">Procurar</button></div>', function (c) {
    var estado = c.querySelector('#cbEstado');
    function tratar(codigo) {
      parar();
      estado.textContent = 'A procurar ' + codigo + '…';
      procurarCodigo(codigo).then(function (a) {
        if (a) return escolherGramas(a, data, refeicao, habitos);
        estado.innerHTML = 'O código ' + esc(codigo) + ' não está no Open Food Facts (ou não tem kcal). ' +
          '<button class="btn fina" id="cbCriar" style="margin-top:8px">Criar alimento</button>';
        c.querySelector('#cbCriar').onclick = function () { criarAlimento(data, refeicao, habitos, ''); };
      }).catch(function () { estado.textContent = 'Sem rede para procurar o código.'; });
    }
    c.querySelector('#cbOk').onclick = function () {
      var v = c.querySelector('#cbManual').value.replace(/\D/g, '');
      if (v) tratar(v);
    };
    carregarZxing().then(function (Z) {
      var leitor = new Z.BrowserMultiFormatReader();
      return leitor.decodeFromVideoDevice(undefined, c.querySelector('#cbVideo'), function (res, erro, ctl) {
        controlos = ctl;
        if (res) tratar(res.getText());
      }).then(function (ctl) { controlos = ctl; estado.textContent = 'Aponta ao código de barras.'; });
    }).catch(function (e) {
      estado.textContent = 'Câmara indisponível (' + (e && e.message ? e.message : e) + '). Escreve o número.';
    });
    // fechar a folha desliga a camara
    var fechar = $('#folhaFechar').onclick, veu = $('#veu').onclick;
    $('#folhaFechar').onclick = $('#veu').onclick = function () {
      parar();
      $('#folhaFechar').onclick = fechar; $('#veu').onclick = veu;
      fecharFolha();
    };
  });
}

/* ===========================================================================
   Vista: Plano

   O ciclo de 4 semanas, dia a dia, com o que ja foi feito. E daqui que sai o
   ciclo seguinte: gera-se, passa pelas 17 provas, e so entao se grava no
   Treino. Um plano que falhe uma prova nao se grava.

   Os ciclos ficam em definicoes.planoCiclos: [{ dataInicio, cfg, gravado }].
   Quem ainda nao tem nenhum esta no ciclo 1, que entrou pelo para_app.py com
   a configuracao de partida.
   ======================================================================== */

var NOME_DIA_CURTO = { segunda: 'Seg', terca: 'Ter', quinta: 'Qui', sexta: 'Sex' };
var NOME_MODO = { maximos: 'máximos', volume_8: 'médio', volume_5: 'pesado', leve: 'leve' };

function ciclosDoPlano() {
  var c = Estado.definicoes.planoCiclos;
  if (Array.isArray(c) && c.length) return c;
  return [{ dataInicio: PLANO_CONFIG_PADRAO.dataInicio, cfg: PLANO_CONFIG_PADRAO, gravado: null }];
}

/* O ciclo em que se esta: o ultimo cujo primeiro treino (na data real, depois
   de empurroes) ja chegou. */
function cicloAtual(mapa) {
  var hoje = hojeIso(), i = 0;
  mapa.forEach(function (c, k) {
    var primeiro = c.dias.map(function (d) { return d.data; }).sort()[0];
    if (primeiro <= hoje) i = k;
  });
  return { ciclo: mapa[i].rec, mapa: mapa[i], numero: i + 1, total: mapa.length };
}

/* Quantas series da sessao estao feitas e quantas ha. */
function estadoDaSessao(sessao) {
  if (!sessao) return { total: 0, feitas: 0 };
  var ss = Estado.series.filter(function (s) { return s.sessaoId === sessao.id; });
  return { total: ss.length, feitas: ss.filter(serieFeita).length };
}

/* --- Sugestoes: calcula-se tudo de novo a cada ecra; so as decisoes (aceite
   ou ignorada) ficam guardadas, na loja sugestoes, pela chave. --- */
function sugestoesAbertas() {
  var decididas = {};
  Estado.sugestoes.forEach(function (s) { decididas[s.chave] = 1; });
  var regras;
  try {
    regras = calcularSugestoes(ciclosDoPlano(), Estado.sessoes, Estado.series, Estado.exercicios,
      hojeIso(), decididas);
  } catch (e) {
    console.warn('Sugestões:', e.message);
    regras = [];
  }
  return regras.concat(sugestoesIA('treino'));
}

/* --- IA: o pedido, e as sugestoes que voltam (guardadas so no aparelho) --- */
function sugestoesIA(area) {
  var guardadas = (Estado.definicoes.sugestoesIA || {})[area];
  if (!guardadas) return [];
  var decididas = {};
  Estado.sugestoes.forEach(function (s) { decididas[s.chave] = 1; });
  return guardadas.sugestoes.filter(function (s) { return !decididas[s.chave]; });
}

function chamarIA(corpo, limiteMs) {
  var chave = Estado.definicoes.chaveIA;
  if (!chave) return Promise.reject(new Error('Sem chave da IA nas Definições'));
  var ctl = typeof AbortController === 'function' ? new AbortController() : null;
  var relogio = ctl ? setTimeout(function () { ctl.abort(); }, limiteMs || 240000) : null;
  return fetch(IA_URL, { method: 'POST', headers: iaCabecalhos(chave), body: JSON.stringify(corpo),
    signal: ctl ? ctl.signal : undefined })
    .catch(function (e) {
      throw new Error(e && e.name === 'AbortError' ? 'A IA demorou demasiado. Tenta outra vez.' : 'Sem ligação à API.');
    })
    .then(function (r) {
      return r.json().catch(function () { return null; }).then(function (corpoR) {
        if (!r.ok) throw new Error(erroIA(r.status, corpoR));
        return corpoR;
      });
    })
    .then(function (x) { clearTimeout(relogio); return x; },
      function (e) { clearTimeout(relogio); throw e; });
}

function iaLigada() {
  return !!(Estado.definicoes.iaHermes || Estado.definicoes.chaveIA);
}

function chamarHermes(rota, corpo, limiteMs) {
  var url = (Estado.definicoes.iaHermesUrl || HERMES_URL_PADRAO) + rota;
  var ctl = typeof AbortController === 'function' ? new AbortController() : null;
  var relogio = ctl ? setTimeout(function () { ctl.abort(); }, limiteMs) : null;
  var opcoes = corpo
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo) }
    : { method: 'GET' };
  if (ctl) opcoes.signal = ctl.signal;
  return fetch(url, opcoes)
    .catch(function (e) {
      throw new Error(e && e.name === 'AbortError' ? 'O Hermes demorou demasiado. Tenta outra vez.'
        : 'Não chego ao Vostro. Está ligado, e o Tailscale está ativo no telemóvel?');
    })
    .then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.erro) || ('O Vostro respondeu ' + r.status));
        return j;
      });
    })
    .then(function (x) { clearTimeout(relogio); return x; },
      function (e) { clearTimeout(relogio); throw e; });
}

function pedirRevisaoIA(area, botao) {
  var hoje = hojeIso();
  var ca = cicloAtual(mapaDoPlano(ciclosDoPlano(), Estado.sessoes));
  var cfg = ca.ciclo.cfg;
  var pausados = Estado.definicoes.planoPausados || [];
  var resumo = resumoParaIA({ hoje: hoje, ciclos: ciclosDoPlano(), cfg: cfg, pausados: pausados,
    sessoes: Estado.sessoes, series: Estado.series, exercicios: Estado.exercicios,
    pesagens: Estado.pesagens, avaliacoes: Estado.avaliacoes,
    perfil: Estado.definicoes.perfilDieta || null, planoAlimentar: Estado.definicoes.planoAlimentar || null });
  var texto = botao ? botao.textContent : '';
  var ctx = { hoje: hoje, cfg: cfg, pausados: pausados,
    planoAlimentar: Estado.definicoes.planoAlimentar || null, area: area };
  var pelaHermes = !!Estado.definicoes.iaHermes;
  if (botao) { botao.disabled = true; botao.textContent = (pelaHermes ? 'O Hermes' : 'A IA') + ' está a rever… (até 4 min)'; }
  var pedido = pelaHermes
    ? chamarHermes('/rever', { prompt: pedidoHermes(resumo, area) }, 280000)
        .then(function (r) { return lerTextoIA(r.texto, ctx); })
    : chamarIA(pedidoIA(resumo, area)).then(function (resposta) { return lerRespostaIA(resposta, ctx); });
  return pedido
    .then(function (lido) {
      if (lido.erro) throw new Error(lido.erro);
      var todas = _copia(Estado.definicoes.sugestoesIA || {});
      todas[area] = { data: hoje, sugestoes: lido.sugestoes, recusadas: lido.recusadas };
      return guardarDefinicao('sugestoesIA', todas).then(function () {
        avisar(lido.sugestoes.length
          ? plural(lido.sugestoes.length, 'sugestão', 'sugestões') + ' da IA' +
            (lido.recusadas.length ? ' (' + lido.recusadas.length + ' recusadas pela app)' : '')
          : 'A IA não sugere nada' + (lido.recusadas.length ? ' que a app aceite' : ''));
        return true;
      });
    })
    .catch(function (e) { avisar(e.message); return false; })
    .then(function (ok) {
      if (botao) { botao.disabled = false; botao.textContent = texto; }
      return ok;
    });
}

/* Linha com o que a app recusou da ultima revisao, e porque. */
function htmlRecusadasIA(area) {
  var g = (Estado.definicoes.sugestoesIA || {})[area];
  if (!g || !g.recusadas || !g.recusadas.length) return '';
  return '<p class="mini fraco" style="margin:-4px 0 12px">Revisão de ' + esc(dataCurta(g.data)) + ': a app recusou ' +
    g.recusadas.map(function (r) { return esc(r.titulo) + ' (' + esc(r.motivo) + ')'; }).join('; ') + '.</p>';
}

function decidirSugestao(sug, estado) {
  var reg = { chave: sug.chave, tipo: sug.tipo, estado: estado, data: hojeIso(), titulo: sug.titulo };
  return BD.guardar('sugestoes', reg).then(function (id) {
    reg.id = id;
    Estado.sugestoes.push(reg);
  });
}

/* Substitui em Estado os registos com o mesmo id e grava-os. */
function gravarAlterados(loja, alterados) {
  if (!alterados.length) return Promise.resolve();
  var porId = {};
  alterados.forEach(function (r) { porId[r.id] = r; });
  Estado[loja] = Estado[loja].map(function (r) { return porId[r.id] || r; });
  return BD.guardarMuitos(loja, alterados);
}

function aceitarSugestao(sug) {
  var hoje = hojeIso();
  var ciclos = ciclosDoPlano();
  var mapa = mapaDoPlano(ciclos, Estado.sessoes);
  var passo;
  if (sug.tipo === 'empurrar') {
    var r = aplicarEmpurrar(mapa, Estado.sessoes, Estado.series, sug.desde);
    if (r.conflitos.length) {
      avisar('Não empurrei: ' + r.conflitos.map(dataCurta).join(', ') + ' já tem outro treino.');
      return;
    }
    passo = gravarAlterados('sessoes', r.sessoes).then(function () { return gravarAlterados('series', r.series); })
      .then(function () { return r.sessoes.length + ' treinos passaram uma semana para a frente'; });
  } else if (sug.tipo === 'carga') {
    var c = aplicarCarga(mapa, Estado.series, Estado.exercicios, sug.nome, sug.novo, hoje);
    passo = gravarAlterados('series', c.series).then(function () { return guardarDefinicao('planoCiclos', c.ciclos); })
      .then(function () { return sug.nome + ' a ' + num(sug.novo) + ' kg (' + c.series.length + ' séries por fazer mudadas)'; });
  } else if (sug.tipo === 'descarga') {
    var alt = aplicarDescarga(mapa, Estado.series, sug.depoisDe);
    passo = gravarAlterados('series', alt).then(function () { return alt.length + ' séries da semana seguinte a -10%'; });
  } else if (sug.tipo === 'estagnado') {
    var pausados = (Estado.definicoes.planoPausados || []).concat([sug.nome]);
    passo = guardarDefinicao('planoPausados', pausados).then(function () { return sug.nome + ' sai no ciclo seguinte'; });
  } else if (sug.tipo === 'nota') {
    passo = Promise.resolve('Anotado');
  } else {
    return;
  }
  passo.then(function (msg) {
    return decidirSugestao(sug, 'aceite').then(function () {
      reindexar();
      avisar(msg);
      render();
    });
  }).catch(function (e) { avisar('Não gravou: ' + e.message); });
}

function htmlSugestoes(lista) {
  if (!lista.length) return '';
  return '<div class="lista"><div class="cab">' + plural(lista.length, 'sugestão', 'sugestões') + '</div>' +
    lista.map(function (s, i) {
      return '<div class="item" style="display:block">' +
        '<div style="font-weight:600">' + esc(s.titulo) + '</div>' +
        '<div class="mini fraco" style="margin:3px 0 10px">' + esc(s.detalhe) + '</div>' +
        '<div class="linha" style="gap:8px">' +
          '<button class="btn primaria fina crescer" data-sugaceitar="' + i + '">' + (s.informativa ? 'Ok' : 'Aceitar') + '</button>' +
          '<button class="btn fina crescer" data-sugignorar="' + i + '">Ignorar</button>' +
        '</div></div>';
    }).join('') + '</div>';
}

function renderPlano() {
  $('#titulo').textContent = 'Plano';
  $('#btVoltar').hidden = true;
  $('#btAcao').hidden = true;

  var mapa = mapaDoPlano(ciclosDoPlano(), Estado.sessoes);
  var ca = cicloAtual(mapa);
  var plano = ca.mapa.plano;
  var cal = plano.calendario;
  var datasReais = ca.mapa.dias.map(function (d) { return d.data; }).sort();
  var hoje = hojeIso();
  var sugestoes = sugestoesAbertas();

  var html = htmlSugestoes(sugestoes) + htmlRecusadasIA('treino') +
    (iaLigada()
      ? '<button class="btn larga fina" id="plIA" style="margin-bottom:12px;color:var(--azul)">Pedir revisão à IA</button>' : '') +
    '<div class="cartao" style="margin-top:0"><div class="linha entre">' +
    '<div><div style="font-size:20px;font-weight:700">Ciclo ' + ca.numero + '</div>' +
    '<div class="mini fraco">' + esc(dataCurta(datasReais[0])) + ' a ' +
      esc(dataCurta(datasReais[datasReais.length - 1])) + '</div></div>' +
    '<button class="btn primaria fina" id="plSeguinte">Ciclo seguinte</button></div>' +
    '<div class="linha" style="gap:8px;flex-wrap:wrap;margin-top:12px">' +
    ca.ciclo.cfg.lifts.map(function (L) {
      return '<span class="etiqueta">' + esc(ca.ciclo.cfg.nomeLift[L]) + ' ' +
        num(ca.ciclo.cfg.lift[L].max) + '</span>';
    }).join('') + '</div></div>';

  cal.forEach(function (sem) {
    html += '<div class="lista"><div class="cab">Semana ' + sem.semana + ' · máximos: ' +
      esc(ca.ciclo.cfg.nomeLift[sem.maximos].toLowerCase()) + '</div>';
    PLANO_DIAS.forEach(function (d) {
      var real = ca.mapa.dias.filter(function (x) { return x.semana === sem.semana && x.dia === d; })[0];
      var dia = { data: real.data, lift: real.lift, modo: real.modo, exercicios: real.exercicios };
      var est = estadoDaSessao(real.sessao);
      var marca;
      if (est.total && est.feitas === est.total) marca = '<span class="etiqueta" style="color:var(--verde)">feito</span>';
      else if (est.feitas) marca = '<span class="etiqueta">' + est.feitas + '/' + est.total + '</span>';
      else if (dia.data < hoje) marca = '<span class="etiqueta" style="color:var(--ambar)">falhou</span>';
      else if (!est.total) marca = '<span class="etiqueta">sem treino</span>';
      else marca = '<span class="etiqueta">' + est.total + ' séries</span>';
      html += '<button class="item" data-pldia="' + dia.data + '"' +
        (dia.data === hoje ? ' style="background:var(--sup2)"' : '') + '>' +
        '<div style="width:56px;flex:none"><div style="font-weight:700">' + NOME_DIA_CURTO[d] + '</div>' +
        '<div class="mini fraco">' + esc(dataCurta(dia.data)) + '</div></div>' +
        '<div class="crescer"><div style="font-weight:600">' + esc(ca.ciclo.cfg.nomeLift[dia.lift]) + '</div>' +
        '<div class="mini fraco">' + NOME_MODO[dia.modo] + ' · ' +
        plural(dia.exercicios.length, 'exercício', 'exercícios') + '</div></div>' +
        marca + '<span class="seta">&#8250;</span></button>';
    });
    html += '</div>';
  });

  if (ca.numero < ca.total) {
    var primeiroProx = mapa[ca.numero].dias.map(function (d) { return d.data; }).sort()[0];
    html += '<p class="mini fraco">O ciclo ' + (ca.numero + 1) + ' já está gravado e começa a ' +
      esc(dataLonga(primeiroProx)) + '.</p>';
  }

  $('#v-plano').innerHTML = html;
  $('#plSeguinte').onclick = prepararCicloSeguinte;
  if ($('#plIA')) $('#plIA').onclick = function () {
    pedirRevisaoIA('treino', this).then(function (ok) { if (ok) render(); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-sugaceitar]'), function (b) {
    b.onclick = function () { b.disabled = true; aceitarSugestao(sugestoes[+b.dataset.sugaceitar]); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sugignorar]'), function (b) {
    b.onclick = function () {
      decidirSugestao(sugestoes[+b.dataset.sugignorar], 'ignorada').then(render);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-pldia]'), function (b) {
    b.onclick = function () {
      Estado.dataAtual = b.dataset.pldia;
      trocarVista('treino');
    };
  });
}

/* Folha do ciclo seguinte: data, maximos novos, e as 17 provas. Tocar num
   exercicio tira-o daquele dia (fica nos ajustes) e o plano refaz-se. */
function prepararCicloSeguinte() {
  var ciclos = ciclosDoPlano();
  var ultimo = ciclos[ciclos.length - 1];
  var mapa = mapaDoPlano(ciclos, Estado.sessoes);
  // a segunda a seguir ao ultimo treino do ultimo ciclo (conta os empurroes)
  var ultimaData = mapa[mapa.length - 1].dias.map(function (d) { return d.data; }).sort().pop();
  var resultados = resultadosMaximos(mapa, Estado.series, Estado.exercicios, hojeIso());
  var pausados = Estado.definicoes.planoPausados || [];
  var cfg = progredirConfig(ultimo.cfg, _somarDias(segundaDaSemana(ultimaData), 7), hojeIso(),
    resultados, pausados);
  var aberto = null;   // 'semana|dia' expandido na lista
  var PORQUE = {
    sucesso: function (r) { return 'single de ' + num(r.melhor) + ' feito a ' + dataCurta(r.data); },
    falhou: function (r) { return 'falhou: ' + num(r.melhor) + ' de ' + num(r.topo) + ' a ' + dataCurta(r.data) + ', não sobe'; },
    'sem-teste': function (r) { return 'máximos de ' + dataCurta(r.data) + ' não feitos, não sobe'; }
  };

  function desenhar(corpo) {
    var plano, erro = null, falhas = [];
    try { plano = gerarPlano(cfg); falhas = validarPlano(plano); }
    catch (e) { erro = e.message; }

    var html = '<label class="campo"><span>Começa na segunda</span>' +
      '<input id="csData" type="date" value="' + cfg.dataInicio + '"></label>' +
      '<div class="cartao" style="margin-top:0"><h3>Máximos deste ciclo</h3>' +
      cfg.lifts.map(function (L) {
        var r = resultados[L];
        return '<div style="padding:4px 0"><div class="linha entre pequeno"><span>' + esc(cfg.nomeLift[L]) +
          '</span><span class="nums">' + num(ultimo.cfg.lift[L].max) + ' → <b>' + num(cfg.lift[L].max) +
          '</b> kg</span></div>' +
          '<div class="mini fraco">' + esc(r ? PORQUE[r.estado](r) : 'máximos ainda por fazer neste ciclo: se gravares já, sobe o incremento') + '</div></div>';
      }).join('') + '</div>' +
      (pausados.length ? '<p class="mini" style="color:var(--ambar);margin:-4px 0 12px">Fora deste ciclo: ' +
        pausados.map(esc).join(', ') + '</p>' : '');

    if (erro) {
      html += '<p style="color:var(--vermelho)">Não consegui gerar: ' + esc(erro) + '</p>';
    } else {
      html += falhas.length
        ? '<div class="cartao" style="border-color:var(--vermelho)"><h3 style="color:var(--vermelho)">' +
          falhas.length + ' regra(s) falham — não se grava</h3>' +
          falhas.slice(0, 8).map(function (f) { return '<div class="mini">' + esc(f) + '</div>'; }).join('') + '</div>'
        : '<p class="mini" style="color:var(--verde);margin:0 0 10px">As 17 regras passam.</p>';
      html += '<p class="mini fraco" style="margin:0 0 8px">Toca num dia para ver os exercícios. ' +
        'Tocar num exercício tira-o desse dia e o plano refaz-se.</p>';
      plano.calendario.forEach(function (sem) {
        html += '<div class="lista"><div class="cab">Semana ' + sem.semana + '</div>';
        PLANO_DIAS.forEach(function (d) {
          var dia = sem.dias[d], chave = sem.semana + '|' + d;
          html += '<button class="item" data-csdia="' + chave + '"><div class="crescer">' +
            '<b>' + NOME_DIA_CURTO[d] + ' ' + esc(dataCurta(dia.data)) + '</b> · ' +
            esc(cfg.nomeLift[dia.lift]) + ' <span class="mini fraco">' + NOME_MODO[dia.modo] + '</span></div>' +
            '<span class="seta">' + (aberto === chave ? '&#8964;' : '&#8250;') + '</span></button>';
          if (aberto === chave) {
            var fora = (cfg.ajustes[chave] && cfg.ajustes[chave].fora) || [];
            dia.exercicios.forEach(function (e) {
              html += '<button class="item" ' + (e.foco ? 'disabled' : 'data-csex="' + esc(e.nome) + '"') +
                ' style="padding-left:28px"><div class="crescer mini">' + esc(e.nome) +
                ' <span class="fraco">' + e.series.map(function (s) { return num(s[0]) + '×' + s[1]; }).join(' · ') +
                '</span></div>' + (e.foco ? '' : '<span class="fraco">&times;</span>') + '</button>';
            });
            if (fora.length) {
              html += '<div class="item mini" style="padding-left:28px;color:var(--ambar)">Tirados: ' +
                fora.map(esc).join(', ') + ' <button class="btn fina" data-csrepor="' + chave +
                '" style="margin-left:auto">Repor</button></div>';
            }
          }
        });
        html += '</div>';
      });
    }
    html += '<button class="btn primaria larga" id="csGravar"' + (erro || falhas.length ? ' disabled' : '') +
      '>Gravar no Treino</button>' +
      '<p class="mini fraco" style="margin-top:10px">As séries entram por fazer, como no ciclo 1. ' +
      'Dias que já têm treino ficam como estão.</p>';
    corpo.innerHTML = html;

    corpo.querySelector('#csData').onchange = function (e) {
      var v = e.target.value;
      if (!v) return;
      // o plano assume que a semana comeca a segunda
      cfg.dataInicio = segundaDaSemana(v);
      desenhar(corpo);
    };
    Array.prototype.forEach.call(corpo.querySelectorAll('[data-csdia]'), function (b) {
      b.onclick = function () { aberto = aberto === b.dataset.csdia ? null : b.dataset.csdia; desenhar(corpo); };
    });
    Array.prototype.forEach.call(corpo.querySelectorAll('[data-csex]'), function (b) {
      b.onclick = function () {
        var aj = cfg.ajustes[aberto] = cfg.ajustes[aberto] || {};
        aj.fora = (aj.fora || []).concat([b.dataset.csex]);
        desenhar(corpo);
      };
    });
    Array.prototype.forEach.call(corpo.querySelectorAll('[data-csrepor]'), function (b) {
      b.onclick = function (ev) {
        ev.stopPropagation();
        delete cfg.ajustes[b.dataset.csrepor];
        desenhar(corpo);
      };
    });
    var gravar = corpo.querySelector('#csGravar');
    if (!gravar.disabled) gravar.onclick = function () { gravarCiclo(cfg, plano); };
  }

  abrirFolha('Ciclo ' + (ciclos.length + 1), '<div id="csCorpo"></div>', function (c) {
    desenhar(c.querySelector('#csCorpo'));
  });
}

function gravarCiclo(cfg, plano) {
  if (ciclosDoPlano().some(function (c) { return c.dataInicio === cfg.dataInicio; })) {
    avisar('Já há um ciclo a começar a ' + dataCurta(cfg.dataInicio));
    return;
  }
  var r = planoParaSessoes(plano, Estado.exercicios, Estado.sessoes,
    { sessao: proximoId(Estado.sessoes), serie: proximoId(Estado.series) });
  if (r.emFalta.length) {
    avisar('Faltam exercícios na app: ' + r.emFalta.join(', ') + '. Nada foi gravado.');
    return;
  }
  // Identidade na sessao desde o primeiro dia: e o que a deixa ser empurrada
  // sem se confundir com um treino de outro ciclo.
  var identidade = {};
  plano.calendario.forEach(function (sem) {
    PLANO_DIAS.forEach(function (d) {
      identidade[sem.dias[d].data] = { ciclo: cfg.dataInicio, semana: sem.semana, dia: d };
    });
  });
  r.sessoes.forEach(function (s) { s.plano = identidade[s.data]; });
  var ciclos = ciclosDoPlano().concat([{ dataInicio: cfg.dataInicio, cfg: cfg, gravado: hojeIso() }]);
  avisar('A gravar…');
  BD.guardarMuitos('sessoes', r.sessoes)
    .then(function () { return BD.guardarMuitos('series', r.series); })
    .then(function () { return guardarDefinicao('planoCiclos', ciclos); })
    .then(function () { return guardarDefinicao('planoPausados', []); })
    .then(function () {
      Estado.sessoes = Estado.sessoes.concat(r.sessoes);
      Estado.series = Estado.series.concat(r.series);
      reindexar();
      fecharFolha();
      avisar('Ciclo gravado: ' + r.sessoes.length + ' treinos, ' + r.series.length + ' séries' +
        (r.choques.length ? ' (' + r.choques.length + ' dias já tinham treino)' : ''));
      render();
    })
    .catch(function (e) { avisar('Não gravou: ' + e.message); });
}

/* ===========================================================================
   Arranque e navegacao
   ======================================================================== */

function trocarVista(nome) {
  // Sair de um separador desfaz o nivel em que se estava dentro dele: voltar
  // aos Exercicios deve dar a lista dos grupos, nao o grupo de ha uma hora.
  if (nome !== Estado.vista) Estado.grupoAberto = null;
  Estado.vista = nome;
  if (nome !== 'treino') Estado.exercicioAtivo = null;
  var separador = SEPARADOR_DA_VISTA[nome] || nome;
  Array.prototype.forEach.call(document.querySelectorAll('#separadores button'), function (b) {
    b.classList.toggle('ativa', b.dataset.vista === separador);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.vista'), function (v) {
    v.classList.toggle('ativa', v.id === 'v-' + nome);
  });
  $('#conteudo').scrollTop = 0;
  render();
}

function render() {
  // A barra de datas so aparece na lista de um dia; quem a quiser volta a
  // mostra-la. Assim nenhum ecra tem de se lembrar de a esconder.
  esconderNavDia();
  if (Estado.vista === 'treino') renderTreino();
  else if (Estado.vista === 'historico') renderHistorico();
  else if (Estado.vista === 'analises') renderAnalises();
  else if (Estado.vista === 'peso') renderPeso();
  else if (Estado.vista === 'definicoes') renderDefinicoes();
  else if (Estado.vista === 'plano') renderPlano();
  else if (Estado.vista === 'comida') renderComida();
  else if (Estado.vista === 'mais') renderMais();
  else renderExercicios();

  // Os ecras que vivem dentro do Mais tem um Voltar para o Mais. Os Exercicios
  // com um grupo aberto ja tem o seu (volta aos grupos), e esse ganha.
  if (SEPARADOR_DA_VISTA[Estado.vista] &&
      !(Estado.vista === 'exercicios' && Estado.grupoAberto)) {
    $('#btVoltar').hidden = false;
  }
}

/* A barra tem 5 separadores; os ecras que sairam dela vivem dentro de um. */
var SEPARADOR_DA_VISTA = {
  historico: 'mais', exercicios: 'mais', definicoes: 'mais', peso: 'comida'
};

function carregarTudo() {
  return Promise.all(LOJAS_BACKUP.map(function (l) { return BD.todos(l); })
    .concat([BD.todos('definicoes')])
  ).then(function (r) {
    LOJAS_BACKUP.forEach(function (l, i) { Estado[l] = r[i] || []; });
    (r[LOJAS_BACKUP.length] || []).forEach(function (d) { Estado.definicoes[d.chave] = d.valor; });
    reindexar();
  });
}

/* Exercicios de partida, para quem abre a app sem nada. Sao os mesmos grupos
   que o FitNotes usa, com os nomes em portugues. */
var EXERCICIOS_INICIAIS = [
  ['Supino com barra', 'Peito'], ['Supino inclinado com barra', 'Peito'],
  ['Supino com halteres', 'Peito'], ['Crucifixo na máquina', 'Peito'],
  ['Fundos', 'Peito'], ['Cross-over na polia', 'Peito'],
  ['Peso morto', 'Costas'], ['Remada com barra', 'Costas'],
  ['Puxada na polia alta', 'Costas'], ['Remada na máquina', 'Costas'],
  ['Elevações', 'Costas'], ['Remada unilateral com haltere', 'Costas'],
  ['Agachamento', 'Pernas'], ['Prensa de pernas', 'Pernas'],
  ['Extensão de pernas', 'Pernas'], ['Flexão de pernas deitado', 'Pernas'],
  ['Afundo com halteres', 'Pernas'], ['Gémeos em pé', 'Pernas'],
  ['Peso morto romeno', 'Pernas'],
  ['Press militar com barra', 'Ombros'], ['Press de ombros com halteres', 'Ombros'],
  ['Elevação lateral', 'Ombros'], ['Elevação frontal', 'Ombros'],
  ['Crucifixo invertido', 'Ombros'], ['Encolhimento de ombros', 'Ombros'],
  ['Rosca com barra', 'Bíceps'], ['Rosca com halteres', 'Bíceps'],
  ['Rosca martelo', 'Bíceps'], ['Rosca concentrada', 'Bíceps'],
  ['Rosca na polia', 'Bíceps'],
  ['Tríceps na polia com corda', 'Tríceps'], ['Tríceps na polia com barra', 'Tríceps'],
  ['Tríceps testa', 'Tríceps'], ['Fundos em banco', 'Tríceps'],
  ['Tríceps francês', 'Tríceps'],
  ['Abdominais', 'Abdominais'], ['Prancha', 'Abdominais'],
  ['Elevação de pernas suspenso', 'Abdominais'], ['Roda abdominal', 'Abdominais'],
  ['Passadeira', 'Cardio'], ['Bicicleta estática', 'Cardio'], ['Elíptica', 'Cardio']
];

function semearExercicios() {
  var exercicios = EXERCICIOS_INICIAIS.map(function (par, i) {
    return {
      id: i + 1, nome: par[0], grupo: par[1],
      tipo: par[1] === 'Cardio' ? 'distancia_tempo' : 'peso_reps',
      descansoSeg: null, notas: null, arquivado: false
    };
  });
  Estado.exercicios = exercicios;
  reindexar();
  return BD.guardarMuitos('exercicios', exercicios);
}

function arrancar() {
  Estado.dataAtual = hojeIso();
  Estado.mesCalendario = Estado.dataAtual.slice(0, 7);

  // Separadores
  Array.prototype.forEach.call(document.querySelectorAll('#separadores button'), function (b) {
    b.onclick = function () { trocarVista(b.dataset.vista); };
  });

  // Cabecalho
  $('#btVoltar').onclick = function () {
    // O mesmo botao serve os dois sitios onde se entra um nivel: o registo de
    // um exercicio no treino, e um grupo muscular nos Exercicios.
    if (Estado.vista === 'exercicios' && Estado.grupoAberto) { Estado.grupoAberto = null; render(); return; }
    if (SEPARADOR_DA_VISTA[Estado.vista]) { trocarVista(SEPARADOR_DA_VISTA[Estado.vista]); return; }
    Estado.exercicioAtivo = null;
    render();
  };

  // Folha
  $('#veu').onclick = fecharFolha;
  $('#folhaFechar').onclick = fecharFolha;

  // Cronometro
  $('#cronoMais').onclick = function () { Crono.juntar(30); };
  $('#cronoParar').onclick = function () { Crono.parar(); };

  // Versao nova
  $('#versaoAtualizar').onclick = function () { location.reload(); };
  $('#versaoDepois').onclick = function () { $('#versaoNova').classList.remove('on'); };

  return Armazenamento.verificar()
    .then(function () { return BD.abrir(); })
    .then(carregarTudo)
    .then(function () {
      if (!Estado.exercicios.length) return semearExercicios();
    })
    .then(function () { render(); return Ecra.aplicar(); })
    .catch(function (erro) {
      // Sem base de dados a app nao serve para nada — mais vale dize-lo.
      $('#v-treino').innerHTML = '<div class="vazio">' +
        '<div>Não consegui abrir a base de dados local.</div>' +
        '<p class="mini">' + esc(erro && erro.message ? erro.message : String(erro)) + '</p>' +
        '<p class="mini">Se estás numa janela privada do Safari, a IndexedDB fica bloqueada. ' +
        'Abre a app numa janela normal.</p></div>';
      throw erro;
    });
}

/* ===========================================================================
   Service worker: e ele que faz a app abrir sem rede
   ======================================================================== */
if ('serviceWorker' in navigator) {
  /* O service worker vai buscar a versao nova por tras enquanto a app abre
     com a que ja tinha. Quando encontra uma diferente, avisa por aqui — sem
     isso a versao nova so aparecia na abertura SEGUINTE, e quem estava a usar
     a app nem sabia que havia uma. Nunca se recarrega sozinho: fazer isso a
     meio de uma serie seria pior do que estar desactualizado. */
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (!e.data || e.data.tipo !== 'nova-versao') return;
    var barra = $('#versaoNova');
    if (barra) barra.classList.add('on');
  });

  window.addEventListener('load', function () {
    // updateViaCache 'none': sem isto, o proprio sw.js era servido pela cache
    // do browser (o GitHub Pages manda max-age=600) e uma versao nova podia
    // demorar a ser vista. Assim o ficheiro do service worker vem sempre da
    // rede quando o browser vai verificar se ha versao nova.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function (erro) {
      // Falha o registo em file:// e em http sem ser localhost. A app continua
      // a funcionar, so nao fica disponivel offline.
      console.warn('Service worker não registado:', erro && erro.message);
    });
  });
}

arrancar();

</script>
