<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover deixa o fundo chegar ao notch e ao home indicator.
     maximum-scale=1 evita o zoom automatico do Safari ao focar um input. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Treinos</title>

<!-- Correr em ecra inteiro quando esta no ecra principal do iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treinos">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<style>
/* ---------------------------------------------------------------------------
   1. Fichas de cor e medidas
   ------------------------------------------------------------------------ */
:root{
  --fundo:#0b0d10; --sup:#151a21; --sup2:#1e242d; --sup3:#28303b;
  --borda:#2a323d; --texto:#e8edf4; --suave:#8b98a9; --fraco:#5d6879;
  --azul:#3b82f6; --verde:#22c55e; --ambar:#f59e0b; --vermelho:#ef4444;
  --raio:14px; --raio-s:10px;
  --topo:env(safe-area-inset-top,0px);
  --fundo-seg:env(safe-area-inset-bottom,0px);
  /* O iPhone reserva 34px por baixo, para o traço do home indicator. Reservar
     tudo isso deixava os ícones a boiar com uma faixa vazia por baixo. Metade
     chega: o traço ocupa uns 8px e continua a ter folga. */
  --fundo-barra:max(6px, calc(var(--fundo-seg) * 0.5));
  --barra:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
/* A app e uma coluna de altura fixa: cabecalho, conteudo que rola por dentro,
   e barra de separadores. NADA disto e position:fixed de proposito.

   Porque: no iPhone, um elemento fixo salta de sitio quando o teclado abre e
   quando a pagina faz o efeito de borracha no fim do scroll. Numa coluna
   flex com o conteudo a rolar por dentro, a barra nao tem por onde fugir —
   nao esta a flutuar sobre nada, esta encostada ao fundo da coluna.

   dvh e a altura visivel de verdade no iOS; o 100% e a rede para browsers
   antigos que nao o conhecem. */
body{
  margin:0; padding:0;
  height:100%; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
  background:var(--fundo); color:var(--texto);
  font:400 17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none; -webkit-font-smoothing:antialiased;
}
/* O iOS so nao da zoom nos inputs se a letra tiver 16px ou mais. */
input,select,textarea,button{font:inherit;font-size:17px;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--azul)}

/* ---------------------------------------------------------------------------
   2. Estrutura: cabecalho fixo, conteudo, barra de separadores em baixo
   ------------------------------------------------------------------------ */
#cabecalho{
  flex:none; z-index:40;
  padding:calc(var(--topo) + 10px) 16px 10px;
  background:rgba(11,13,16,.82); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--borda);
  display:flex; align-items:center; gap:12px; min-height:52px;
}
#cabecalho h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Cabecalho de um dia de treino: uma seta de cada lado da data para andar
   dia a dia, e a data ao meio que abre o calendario. */
#cabecalho .dia{flex:1;min-width:0;display:flex;align-items:center;gap:2px}
/* Sem isto o display:flex ganha ao [hidden] e a barra de datas ficava sempre
   à vista. Foi assim que a tira das cargas máximas se recusou a esconder. */
#cabecalho .dia[hidden]{display:none}
#cabecalho .dia .andar{flex:none;width:36px;height:38px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:var(--azul);font-size:22px;line-height:1}
#cabecalho .dia .andar:active{background:var(--sup2)}
#cabecalho .dia .andar[disabled]{color:var(--fraco);opacity:.4}
#cabecalho .dia .data{flex:1;min-width:0;text-align:center;font-size:17px;
  font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding:8px 2px;border-radius:9px}
#cabecalho .dia .data:active{background:var(--sup2)}
#cabecalho .dia .data small{display:block;font-size:11px;font-weight:500;
  color:var(--fraco);letter-spacing:0}
#cabecalho .acao{color:var(--azul);font-size:16px;font-weight:500;padding:8px;margin:-8px;white-space:nowrap}
#cabecalho .voltar{color:var(--azul);font-size:17px;padding:8px 8px 8px 0;margin-left:-8px}

#conteudo{
  flex:1; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:14px 0 24px;
}
.vista{display:none;padding:0 16px}
.vista.ativa{display:block}

#separadores{
  flex:none; z-index:40;
  height:calc(var(--barra) + var(--fundo-barra));
  padding-bottom:var(--fundo-barra);
  background:rgba(11,13,16,.9); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--borda);
  display:flex;
}
#separadores button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  /* Letra e icone mais pequenos desde que passaram a ser cinco separadores:
     com 10,5px, "Definições" nao cabia numa linha num telemovel estreito. */
  gap:3px; color:var(--fraco); font-size:9.5px; font-weight:500; letter-spacing:0;
  padding:0 2px; text-align:center; line-height:1.15;
}
#separadores button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
#separadores button.ativa{color:var(--azul)}

/* ---------------------------------------------------------------------------
   3. Pecas reutilizaveis
   ------------------------------------------------------------------------ */
.cartao{background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio);
  padding:14px;margin-bottom:12px}
.cartao h3{font-size:15px;color:var(--suave);font-weight:600;margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.04em}
.linha{display:flex;align-items:center;gap:12px}
.entre{justify-content:space-between}
.crescer{flex:1;min-width:0}
.suave{color:var(--suave)}
.fraco{color:var(--fraco)}
.pequeno{font-size:14px}
.mini{font-size:12.5px}
.centro{text-align:center}
.nums{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 18px;border-radius:var(--raio-s);
  background:var(--sup2);font-weight:600;font-size:17px;transition:opacity .12s}
.btn:active{opacity:.55}
.btn.primaria{background:var(--azul);color:#fff}
.btn.verde{background:var(--verde);color:#04240f}
.btn.perigo{background:rgba(239,68,68,.14);color:var(--vermelho)}
.btn.larga{width:100%}
.btn.fina{min-height:40px;font-size:15px;padding:0 14px}
.btn[disabled]{opacity:.35;pointer-events:none}

.etiqueta{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:12px;font-weight:600;background:var(--sup3);color:var(--suave)}
.etiqueta.pr{background:rgba(245,158,11,.16);color:var(--ambar)}
.etiqueta.rir{background:rgba(59,130,246,.14);color:#7cb0ff}

.vazio{text-align:center;color:var(--fraco);padding:48px 20px;font-size:15px}
.vazio svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.4;
  opacity:.5;margin-bottom:12px}

/* Lista tipo iOS: linhas separadas dentro de um cartao */
.lista{background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio);
  overflow:hidden;margin-bottom:12px}
.lista .item{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;
  text-align:left;border-bottom:1px solid var(--borda)}
.lista .item:last-child{border-bottom:0}
.lista .item:active{background:var(--sup2)}
.lista .cab{padding:9px 14px;background:var(--sup2);font-size:12.5px;font-weight:700;
  color:var(--suave);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--borda)}
.seta{color:var(--fraco);font-size:19px;line-height:1}

/* Cabecalho de um exercicio dentro do treino: o nome abre o registo, e ao
   lado ficam o tirar e o pôr uma serie. */
.cab-ex{display:flex;align-items:center;gap:6px;padding:9px 12px 9px 14px;
  border-bottom:1px solid var(--borda)}
/* O nome encolhe ate ao que precisa, para a seta ficar logo a seguir a ele.
   O empurrao para a direita e dado ao primeiro dos botoes redondos. */
.cab-ex > button.nome{flex:0 1 auto;min-width:0;text-align:left;display:flex;
  align-items:center;gap:10px}
.cab-ex > button.nome:active{opacity:.55}
.cab-ex .abrir{flex:none;width:30px;align-self:stretch;min-height:38px;
  display:flex;align-items:center;justify-content:center;
  color:var(--fraco);font-size:20px;line-height:1;margin-right:auto}
.cab-ex .abrir:active{color:var(--azul)}
.mini-b{width:36px;height:36px;flex:none;border-radius:9px;background:var(--sup3);
  color:var(--suave);font-size:19px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center}
.mini-b:active{background:var(--azul);color:#fff}
.mini-b.tirar:active{background:var(--vermelho);color:#fff}

/* ---------------------------------------------------------------------------
   4. Registo de serie: os tres campos grandes e os passos +/-
   ------------------------------------------------------------------------ */
#registo{position:sticky;top:calc(var(--topo) + 62px);z-index:20;
  background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio);
  padding:12px;margin-bottom:14px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.passo{background:var(--sup2);border:1px solid var(--borda);border-radius:var(--raio-s);
  padding:8px 4px 6px;text-align:center}
.passo > span{display:block;font-size:11.5px;color:var(--suave);font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.passo input{width:100%;background:none;border:0;text-align:center;
  font-size:27px;font-weight:650;padding:2px 0;outline:none;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.passo input::-webkit-outer-spin-button,.passo input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.passo .mm{display:flex;gap:4px;margin-top:4px}
.passo .mm button{flex:1;min-height:34px;background:var(--sup3);border-radius:8px;
  font-size:19px;font-weight:600;color:var(--suave);line-height:1}
.passo .mm button:active{background:var(--azul);color:#fff}

/* O RIR e um seletor de um toque: 0 a 5, mais "sem RIR". */
.rir-escolha{display:flex;gap:5px;margin-bottom:10px}
.rir-escolha button{flex:1;min-height:44px;border-radius:9px;background:var(--sup2);
  border:1px solid var(--borda);font-weight:650;font-size:16px;color:var(--suave)}
.rir-escolha button.on{background:var(--azul);border-color:var(--azul);color:#fff}

/* Serie ja registada, so de leitura */
.serie{display:flex;align-items:center;gap:10px;padding:11px 12px;
  border-bottom:1px solid var(--borda)}
.serie:last-child{border-bottom:0}
.serie .n{width:26px;height:26px;border-radius:50%;background:var(--sup3);color:var(--suave);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.serie .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.serie.recorde .n{background:rgba(245,158,11,.2);color:var(--ambar)}

/* Serie editavel: peso, reps, o visto de feito e o RIR, cada um com um menos
   e um mais de cada lado. Em grelha e nao em flex para as colunas ficarem
   alinhadas de linha para linha — e o que faz a lista poder ser lida de
   relance. A marca a bater vai para uma linha propria por baixo: assim os
   botoes tem espaco e o numero fica explicado em vez de solto. */
.linhas-cab,.serie-ed{display:grid;
  grid-template-columns:13px 1fr .8fr 38px .72fr;
  gap:4px;align-items:center}
.linhas-cab{padding:7px 10px 3px;font-size:10px;font-weight:700;color:var(--fraco);
  text-transform:uppercase;letter-spacing:.03em}
.linhas-cab span{text-align:center}
.serie-ed{padding:6px 10px 8px;border-bottom:1px solid var(--borda)}
.serie-ed:last-child{border-bottom:0}
.serie-ed .n{font-size:12px;font-weight:700;color:var(--fraco);text-align:center}

/* Cada campo e uma caixa so, com o menos e o mais la dentro: e uma peca
   unica em vez de tres botoes soltos lado a lado. */
.serie-ed .caixa{display:grid;grid-template-columns:26px 1fr 26px;align-items:stretch;
  background:var(--sup2);border:1px solid var(--borda);border-radius:9px;
  overflow:hidden;min-height:44px}
.serie-ed .caixa:focus-within{border-color:var(--azul)}
.serie-ed .caixa input{width:100%;background:none;border:0;border-radius:0;padding:0 1px;
  text-align:center;outline:none;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;color:inherit}
.serie-ed .caixa input::-webkit-outer-spin-button,
.serie-ed .caixa input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.serie-ed .caixa input.rir{color:var(--suave)}
.serie-ed .caixa input.rir::placeholder{color:var(--fraco);font-weight:400}

/* Os menos e os mais ocupam a altura toda da caixa: estreitos de largura,
   mas com area que chegue para o dedo. */
.serie-ed .passo-b{background:none;color:var(--fraco);font-size:18px;font-weight:600;
  line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.serie-ed .passo-b:active{background:var(--azul);color:#fff}

.serie-ed .feito{min-height:42px;border-radius:8px;border:1.5px solid var(--borda);
  background:var(--sup2);color:var(--fraco);font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.serie-ed .feito.on{background:var(--verde);border-color:var(--verde);color:#04240f}

.serie-ed .marca{grid-column:1/-1;text-align:right;font-size:11.5px;
  color:var(--ambar);font-variant-numeric:tabular-nums;padding-top:5px}
.serie-ed .marca.nada{color:var(--fraco)}
.serie-ed.porfazer input,.serie-ed.porfazer .n{opacity:.62}
.serie-ed.recorde .n{color:var(--ambar)}

/* ---------------------------------------------------------------------------
   5. Cronometro de descanso (barra que sobe acima dos separadores)
   ------------------------------------------------------------------------ */
#cronometro{
  position:fixed;left:8px;right:8px;z-index:45;
  bottom:calc(var(--barra) + var(--fundo-barra) + 8px);
  background:var(--sup2);border:1px solid var(--borda);border-radius:var(--raio);
  padding:10px 14px;display:none;align-items:center;gap:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.5)}
#cronometro.on{display:flex}
#cronometro .t{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px}
#cronometro.acabou .t{color:var(--verde)}
#cronometro .barra{flex:1;height:5px;background:var(--sup3);border-radius:99px;overflow:hidden}
#cronometro .barra i{display:block;height:100%;background:var(--azul);border-radius:99px;
  transition:width .3s linear}
#cronometro.acabou .barra i{background:var(--verde)}

/* ---------------------------------------------------------------------------
   6. Folha que sobe de baixo (escolher exercicio, editar, opcoes)
   ------------------------------------------------------------------------ */
#veu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;
  backdrop-filter:blur(3px)}
#veu.on{display:block}
#folha{position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--fundo);border-radius:18px 18px 0 0;border-top:1px solid var(--borda);
  max-height:88vh;display:none;flex-direction:column;
  padding-bottom:var(--fundo-seg);transform:translateY(100%);transition:transform .24s ease}
#folha.on{display:flex;transform:translateY(0)}
#folha .puxador{width:38px;height:4.5px;background:var(--sup3);border-radius:99px;
  margin:9px auto 4px;flex:none}
#folha .topo{display:flex;align-items:center;gap:12px;padding:6px 16px 12px;
  border-bottom:1px solid var(--borda);flex:none}
#folha .topo h2{font-size:18px;flex:1;min-width:0}
#folha .corpo{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px}

/* ---------------------------------------------------------------------------
   7. Graficos em SVG e calendario
   ------------------------------------------------------------------------ */
.grafico{width:100%;height:auto;display:block;overflow:visible}
.grafico .eixo{stroke:var(--borda);stroke-width:1}
.grafico .grelha{stroke:var(--borda);stroke-width:1;stroke-dasharray:2 4;opacity:.55}
.grafico text{fill:var(--fraco);font-size:10px;font-family:inherit}
.grafico .rotulo-y{fill:var(--suave)}
.legenda{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.legenda span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--suave)}
.legenda i{width:11px;height:11px;border-radius:3px;flex:none}

.calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendario .dn{text-align:center;font-size:11px;color:var(--fraco);font-weight:700;padding:4px 0}
.calendario button{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:15px;color:var(--suave);background:var(--sup2);
  font-variant-numeric:tabular-nums}
.calendario button.fora{background:none;color:var(--fraco);opacity:.4}
.calendario button.treino{background:var(--azul);color:#fff;font-weight:650}
.calendario button.hoje{outline:2px solid var(--ambar);outline-offset:-2px}
/* O dia escolhido para copiar: verde, e a ganhar ao contorno de hoje. */
.calendario button.sel{background:var(--verde);color:#04240f;font-weight:700;
  outline:2px solid var(--verde);outline-offset:2px}
.calendario button[disabled]{opacity:.35}

/* Tabela da estimativa por repeticoes: reps, estimado, feito, folga. */
.linhas-est{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:6px;
  padding:7px 2px;border-bottom:1px solid var(--borda);font-size:14px;
  align-items:center}
.linhas-est:last-of-type{border-bottom:0}
.linhas-est span{text-align:right}
.linhas-est span:first-child{text-align:left}
.linhas-est.fraca{opacity:.45}
.cab-est{font-size:10px;font-weight:700;color:var(--fraco);text-transform:uppercase;
  letter-spacing:.03em;border-bottom:1px solid var(--borda);padding-bottom:5px}

/* Interruptor tipo iOS. */
.interruptor{flex:none;width:52px;height:31px;border-radius:99px;background:var(--sup3);
  padding:2px;display:flex;align-items:center;transition:background .18s}
.interruptor.on{background:var(--verde)}
.interruptor span{width:27px;height:27px;border-radius:50%;background:#fff;
  transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.interruptor.on span{transform:translateX(21px)}

.selseg{display:flex;background:var(--sup2);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
.selseg button{flex:1;min-height:36px;border-radius:8px;font-size:14px;font-weight:600;
  color:var(--suave)}
.selseg button.on{background:var(--sup3);color:var(--texto)}
.selseg button[disabled]{opacity:.5}
/* Quando ha opcoes de mais para a largura do ecra, rola de lado em vez de as
   espremer ate nao se lerem. */
.selseg.rolavel{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.selseg.rolavel::-webkit-scrollbar{display:none}
.selseg.rolavel button{flex:0 0 auto;padding:0 13px;white-space:nowrap}

/* Barra de "ha versao nova". Fica por cima dos separadores, ao lado de onde
   o cronometro aparece, e nunca tapa o que se esta a fazer. */
#versaoNova{position:fixed;left:8px;right:8px;z-index:44;
  bottom:calc(var(--barra) + var(--fundo-barra) + 8px);
  background:var(--azul);color:#fff;border-radius:var(--raio);
  padding:12px 14px;display:none;align-items:center;gap:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.5)}
#versaoNova.on{display:flex}
#versaoNova .t{flex:1;font-size:14.5px;font-weight:600;line-height:1.3}
#versaoNova button{background:rgba(255,255,255,.22);border-radius:8px;
  padding:9px 14px;font-size:14px;font-weight:700;color:#fff;flex:none}
#versaoNova .fechar{background:none;padding:9px 4px;font-size:18px;opacity:.8}

#aviso{position:fixed;left:16px;right:16px;bottom:calc(var(--barra) + var(--fundo-barra) + 74px);
  z-index:60;background:var(--sup3);border:1px solid var(--borda);border-radius:12px;
  padding:12px 16px;text-align:center;font-size:15px;font-weight:500;

<script>
"use strict";

/* ===========================================================================
   NÚCLEO:INÍCIO
   ---------------------------------------------------------------------------
   Tudo o que esta entre estes dois marcadores e logica pura: nao toca no ecra
   nem na base de dados. Os testes em testes/ extraem exactamente este bloco e
   correm-no em Node. Se mexeres aqui, corre `node --test testes/`.
   ======================================================================== */

/* --------------------------------------------------------------------------
   Series feitas e series por fazer

   Um treino copiado de outro dia entra como PLANO: as series ficam com
   feita = false ate levarem o visto verde. Enquanto estao por fazer nao podem
   contar para nada — nem recordes, nem volume, nem medias de RIR. Seria a
   forma mais facil de estragar seis anos de historico: bastava copiar um
   treino e nunca o fazer.

   Sem o campo (as 28.747 series do FitNotes) conta como feita: nao ha razao
   nenhuma para pôr em duvida o que ja esta registado.
   ----------------------------------------------------------------------- */

function serieFeita(s) { return !s || s.feita !== false; }

/* --------------------------------------------------------------------------
   1RM teorico
   Duas formulas, porque discordam de proposito: a Epley e mais generosa em
   repeticoes altas, a Brzycki e mais conservadora. Mostrar as duas evita
   confiar demais numa so.
   ----------------------------------------------------------------------- */

// Acima de 15 repeticoes qualquer estimativa de 1RM e um palpite.
var LIMITE_FIAVEL = 15;

function epley(peso, reps) {
  if (!Number.isFinite(peso) || !Number.isFinite(reps)) return null;
  if (peso <= 0 || reps < 1) return null;
  // Com 1 repeticao o 1RM e o proprio peso. A formula crua daria 1,033x,
  // o que faria uma serie de 1 rep parecer um recorde que nao aconteceu.
  if (reps === 1) return peso;
  return peso * (1 + reps / 30);
}

function brzycki(peso, reps) {
  if (!Number.isFinite(peso) || !Number.isFinite(reps)) return null;
  if (peso <= 0 || reps < 1) return null;
  if (reps === 1) return peso;
  // O denominador (37 - reps) zera as 37 repeticoes e inverte o sinal acima
  // disso. Acima das 36 a formula nao tem significado nenhum.
  if (reps >= 37) return null;
  return peso * 36 / (37 - reps);
}

function estimar1RM(peso, reps) {
  var e = epley(peso, reps);
  var b = brzycki(peso, reps);
  if (e === null && b === null) return null;
  var valores = [e, b].filter(function (v) { return v !== null; });
  return {
    epley: e,
    brzycki: b,
    media: valores.reduce(function (a, v) { return a + v; }, 0) / valores.length,
    fiavel: reps <= LIMITE_FIAVEL
  };
}

/* --------------------------------------------------------------------------
   Datas e semanas ISO
   A semana comeca a segunda-feira e a semana 1 do ano e a que contem a
   primeira quinta-feira. Contas todas em UTC para o fuso nao deslocar dias.
   ----------------------------------------------------------------------- */

function _dataUtc(dataIso) {
  var p = String(dataIso).slice(0, 10).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
}

function segundaDaSemana(dataIso) {
  var d = _dataUtc(dataIso);
  var dia = (d.getUTCDay() + 6) % 7;           // 0 = segunda
  d.setUTCDate(d.getUTCDate() - dia);
  return d.toISOString().slice(0, 10);
}

function chaveSemanaIso(dataIso) {
  var d = _dataUtc(dataIso);
  var dia = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dia + 3);      // quinta-feira desta semana
  var ano = d.getUTCFullYear();
  var jan4 = new Date(Date.UTC(ano, 0, 4));
  var diaJan4 = (jan4.getUTCDay() + 6) % 7;
  var primeiraQuinta = new Date(jan4);
  primeiraQuinta.setUTCDate(jan4.getUTCDate() - diaJan4 + 3);
  var semana = 1 + Math.round((d - primeiraQuinta) / 604800000);
  return ano + '-W' + String(semana).padStart(2, '0');
}

function chaveMes(dataIso) { return String(dataIso).slice(0, 7); }

function diasEntre(deIso, ateIso) {
  return Math.round((_dataUtc(ateIso) - _dataUtc(deIso)) / 86400000);
}

/* --------------------------------------------------------------------------
   Leitor de CSV
   Feito a mao e nao com split(','), porque o export do FitNotes tem notas com
   virgulas E com mudanca de linha la dentro, entre aspas. Um split parte essas
   linhas ao meio e inventa registos.
   ----------------------------------------------------------------------- */

function detetarSeparador(texto) {
  var primeira = texto.split(/\r?\n/, 1)[0] || '';
  var contas = [[',', 0], [';', 0], ['\t', 0]];
  var dentro = false;
  for (var i = 0; i < primeira.length; i++) {
    var c = primeira[i];
    if (c === '"') { dentro = !dentro; continue; }
    if (dentro) continue;
    for (var j = 0; j < contas.length; j++) if (c === contas[j][0]) contas[j][1]++;
  }
  contas.sort(function (a, b) { return b[1] - a[1]; });
  return contas[0][1] > 0 ? contas[0][0] : ',';
}

function analisarCsv(texto, separador) {
  if (typeof texto !== 'string') return { separador: ',', linhas: [] };
  if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);   // BOM do Excel
  var sep = separador || detetarSeparador(texto);
  var linhas = [], linha = [], campo = '', aspas = false, viuAspas = false;

  for (var i = 0; i < texto.length; i++) {
    var c = texto[i];
    if (aspas) {
      if (c === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; }   // "" e uma aspa a serio
        else aspas = false;
      } else campo += c;                                   // inclui \n e o separador
      continue;
    }
    if (c === '"' && campo === '') { aspas = true; viuAspas = true; }
    else if (c === sep) { linha.push(campo); campo = ''; }
    else if (c === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else if (c !== '\r') campo += c;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }

  // Fora linhas totalmente vazias (o ficheiro costuma acabar com uma).
  linhas = linhas.filter(function (l) {
    return l.some(function (v) { return String(v).trim() !== ''; });
  });
  return { separador: sep, linhas: linhas, tinhaAspas: viuAspas };
}

/* --------------------------------------------------------------------------
   Reconhecer as colunas pelo cabecalho
   O export real do FitNotes de iPhone traz:
     Date,Exercise,Category,Weight (kg),Weight (lbs),Reps,Distance,
     Distance Unit,Time,Notes,Kind
   O do Android traz Weight + Weight Unit + Comment. Aceitamos os dois, e
   ainda cabecalhos em portugues.
   ----------------------------------------------------------------------- */

function normalizarCabecalho(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // tira acentos
    .toLowerCase().replace(/\s+/g, ' ').trim();
}

var ALTERNATIVAS = {
  data:        ['date', 'data', 'fecha', 'dia'],
  exercicio:   ['exercise', 'exercicio', 'ejercicio', 'nome', 'name'],
  categoria:   ['category', 'categoria', 'grupo', 'muscle group', 'grupo muscular'],
  pesoKg:      ['weight (kg)', 'weight kg', 'peso (kg)', 'peso kg', 'kg'],
  pesoLbs:     ['weight (lbs)', 'weight lbs', 'weight (lb)', 'peso (lbs)', 'lbs'],
  peso:        ['weight', 'peso', 'carga'],
  unidadePeso: ['weight unit', 'unit', 'unidade', 'unidade de peso'],
  reps:        ['reps', 'repetitions', 'repeticoes', 'repeticao', 'rep'],
  rir:         ['rir', 'reps in reserve', 'reservas'],
  distancia:   ['distance', 'distancia'],
  unidadeDist: ['distance unit', 'unidade de distancia'],
  tempo:       ['time', 'tempo', 'duration', 'duracao'],
  nota:        ['notes', 'note', 'comment', 'comments', 'comentario', 'nota', 'observacoes'],
  tipo:        ['kind', 'tipo', 'type']
};

function detetarColunas(cabecalho) {
  var norm = cabecalho.map(normalizarCabecalho);
  var col = {};
  Object.keys(ALTERNATIVAS).forEach(function (chave) {
    col[chave] = -1;
    var nomes = ALTERNATIVAS[chave];
    for (var n = 0; n < nomes.length; n++) {
      var i = norm.indexOf(nomes[n]);
      if (i !== -1) { col[chave] = i; return; }
    }
  });
  // "Weight" generico nao deve roubar a coluna de "Weight (kg)".
  if (col.peso !== -1 && (col.peso === col.pesoKg || col.peso === col.pesoLbs)) col.peso = -1;
  return col;
}

// Um cabecalho a serio tem de trazer pelo menos data e exercicio.
function pareceCabecalho(linha) {
  var col = detetarColunas(linha);
  return col.data !== -1 && col.exercicio !== -1;
}

// Ordem das colunas do FitNotes quando o ficheiro vem sem cabecalho nenhum.
var COLUNAS_POR_DEFEITO = ['data', 'exercicio', 'categoria', 'peso', 'unidadePeso',
  'reps', 'distancia', 'unidadeDist', 'tempo', 'nota'];

/* --------------------------------------------------------------------------
   Datas e tempos vindos do CSV
   ----------------------------------------------------------------------- */

function _validarData(ano, mes, dia) {
  if (!(mes >= 1 && mes <= 12 && dia >= 1 && dia <= 31)) return null;
  var d = new Date(Date.UTC(ano, mes - 1, dia));
  // Apanha o 31 de Fevereiro e companhia.
  if (d.getUTCFullYear() !== ano || d.getUTCMonth() !== mes - 1 || d.getUTCDate() !== dia) return null;
  return ano + '-' + String(mes).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
}

function analisarData(texto, ordem) {
  var t = String(texto == null ? '' : texto).trim();
  if (!t) return null;
  t = t.split(/[ T]/)[0];                       // deita fora a hora, se vier
  var m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return _validarData(+m[1], +m[2], +m[3]);
  m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
  if (m) {
    var ano = +m[3];
    if (ano < 100) ano += ano < 70 ? 2000 : 1900;
    if (ordem === 'mdy') return _validarData(ano, +m[1], +m[2]);
    return _validarData(ano, +m[2], +m[1]);     // dd/mm por defeito (formato PT)
  }
  return null;
}

/* Descobre se o ficheiro usa dd/mm ou mm/dd olhando para TODAS as datas:
   basta um dia acima de 12 numa das posicoes para desfazer a duvida. */
function detetarOrdemDatas(valores) {
  var iso = 0, total = 0, primeiroAlto = false, segundoAlto = false;
  for (var i = 0; i < valores.length; i++) {
    var t = String(valores[i] == null ? '' : valores[i]).trim().split(/[ T]/)[0];
    if (!t) continue;
    total++;
    if (/^\d{4}[-/.]/.test(t)) { iso++; continue; }
    var m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.]/);
    if (!m) continue;
    if (+m[1] > 12) primeiroAlto = true;
    if (+m[2] > 12) segundoAlto = true;
  }
  if (total === 0) return { ordem: 'iso', ambigua: false, conflito: false };
  if (iso >= total * 0.9) return { ordem: 'iso', ambigua: false, conflito: false };
  if (primeiroAlto && segundoAlto) return { ordem: 'dmy', ambigua: true, conflito: true };
  if (primeiroAlto) return { ordem: 'dmy', ambigua: false, conflito: false };
  if (segundoAlto) return { ordem: 'mdy', ambigua: false, conflito: false };
  return { ordem: 'dmy', ambigua: true, conflito: false };   // 03/04/2026: indecidivel
}

/* O FitNotes escreve o tempo em mm:ss (10:00 sao 600 segundos, conferido
   contra a coluna ZTIME da base, que guarda segundos). */
function analisarTempo(texto) {
  var t = String(texto == null ? '' : texto).trim();
  if (!t) return null;
  if (/^\d+$/.test(t)) return +t;
  if (/^[\d:]+$/.test(t)) {
    var p = t.split(':').map(Number);
    if (p.some(function (v) { return !Number.isFinite(v); })) return null;
    if (p.length === 2) return p[0] * 60 + p[1];
    if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
    return null;
  }
  var m = t.match(/^(?:(\d+)\s*h)?\s*(?:(\d+)\s*m(?:in)?)?\s*(?:(\d+)\s*s)?$/i);
  if (m && (m[1] || m[2] || m[3])) return (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0));
  return null;
}

function analisarNumero(texto) {
  var t = String(texto == null ? '' : texto).trim();
  if (!t) return null;
  t = t.replace(/\s/g, '').replace(',', '.');   // 12,5 e 12.5 sao a mesma coisa
  if (!/^-?\d*\.?\d+$/.test(t)) return null;
  var v = parseFloat(t);
  return Number.isFinite(v) ? v : null;
}

var LBS_PARA_KG = 0.45359237;

/* Nomes de grupo muscular vindos de fora, traduzidos para os da app. */
var GRUPOS_CONHECIDOS = {
  'chest': 'Peito', 'pecho': 'Peito', 'peito': 'Peito',
  'back': 'Costas', 'espalda': 'Costas', 'costas': 'Costas',
  'legs': 'Pernas', 'piernas': 'Pernas', 'pernas': 'Pernas',
  'shoulders': 'Ombros', 'hombros': 'Ombros', 'ombros': 'Ombros',
  'biceps': 'Bíceps', 'triceps': 'Tríceps',
  'abs': 'Abdominais', 'abdominales': 'Abdominais', 'core': 'Abdominais',
  'abdominais': 'Abdominais', 'abdomen': 'Abdominais',
  'cardio': 'Cardio'
};

function traduzirGrupo(nome) {
  var n = normalizarCabecalho(nome);
  if (!n) return 'Outros';
  if (GRUPOS_CONHECIDOS[n]) return GRUPOS_CONHECIDOS[n];
  return String(nome).trim();
}

var GRUPOS_APP = ['Peito', 'Costas', 'Pernas', 'Ombros', 'Bíceps', 'Tríceps',
  'Abdominais', 'Cardio', 'Outros'];

/* --------------------------------------------------------------------------
   Importar o CSV do FitNotes
   Devolve exactamente a mesma forma que o ficheiro de backup da app, para o
   caminho de importacao ser um so.
   ----------------------------------------------------------------------- */

function _pesoDaLinha(linha, col) {
  // 1.o a coluna ja em kg: e a que o FitNotes de iPhone exporta, e nao precisa
  // de conversao nenhuma.
  if (col.pesoKg !== -1) {
    var v = analisarNumero(linha[col.pesoKg]);
    if (v !== null) return v;
  }
  // 2.o a coluna generica "Weight", que so faz sentido com a unidade ao lado.
  if (col.peso !== -1) {
    var g = analisarNumero(linha[col.peso]);
    if (g !== null) {
      var u = col.unidadePeso !== -1 ? normalizarCabecalho(linha[col.unidadePeso]) : '';
      if (u === 'lbs' || u === 'lb' || u === 'pounds' || u === 'libras') return g * LBS_PARA_KG;
      return g;
    }
  }
  // 3.o so ha libras: converte.
  if (col.pesoLbs !== -1) {
    var l = analisarNumero(linha[col.pesoLbs]);
    if (l !== null) return l * LBS_PARA_KG;
  }
  return null;
}

function _tipoDaLinha(linha, col, peso, reps, distancia, tempo) {
  if (col.tipo !== -1) {
    var k = normalizarCabecalho(linha[col.tipo]);
    if (k === 'wr') return 'peso_reps';
    if (k === 'dt') return 'distancia_tempo';
    if (k === 'wt') return 'peso_tempo';
  }
  // Sem coluna Kind, decide-se pelo que veio preenchido.
  if (reps !== null) return 'peso_reps';
  if (distancia !== null) return 'distancia_tempo';
  if (tempo !== null) return 'peso_tempo';
  return 'peso_reps';
}

function importarFitNotes(texto, opcoes) {
  opcoes = opcoes || {};
  var res = {
    exercicios: [], sessoes: [], series: [], avisos: [],
    resumo: { series: 0, sessoes: 0, exercicios: 0, de: null, ate: null, porGrupo: {}, ignoradas: 0 }
  };

  var lido = analisarCsv(texto, opcoes.separador);
  if (!lido.linhas.length) {
    res.avisos.push({ tipo: 'vazio', msg: 'O ficheiro não tem nenhuma linha com conteúdo.' });
    return res;
  }

  var col, corpo;
  if (pareceCabecalho(lido.linhas[0])) {
    col = detetarColunas(lido.linhas[0]);
    corpo = lido.linhas.slice(1);
  } else {
    // Sem cabecalho reconhecivel so vale a pena assumir a ordem classica do
    // FitNotes se a primeira coluna for mesmo uma data. Senao o ficheiro nao
    // e um export de treinos, e mais vale dize-lo do que deitar fora tudo
    // linha a linha e dar a entender que os dados e que estavam maus.
    var primeira = lido.linhas[0];
    if (analisarData(primeira[0], 'iso') === null && analisarData(primeira[0], 'dmy') === null) {
      res.avisos.push({
        tipo: 'colunas',
        msg: 'Não reconheci este ficheiro: não tem cabeçalho com data e exercício, ' +
             'e a primeira coluna também não é uma data.'
      });
      return res;
    }
    col = {};
    Object.keys(ALTERNATIVAS).forEach(function (k) { col[k] = -1; });
    COLUNAS_POR_DEFEITO.forEach(function (k, i) { col[k] = i; });
    corpo = lido.linhas;
    res.avisos.push({
      tipo: 'sem-cabecalho',
      msg: 'Não reconheci o cabeçalho. Assumi a ordem normal do FitNotes: ' +
           'Data, Exercício, Categoria, Peso, Unidade, Reps, Distância, Unidade, Tempo, Nota.'
    });
  }

  if (col.data === -1 || col.exercicio === -1) {
    res.avisos.push({
      tipo: 'colunas',
      msg: 'Faltam colunas obrigatórias: é preciso uma de data e uma de exercício.'
    });
    return res;
  }

  // Decidir de uma vez o formato das datas, olhando para o ficheiro todo.
  var ordemDatas = opcoes.ordemDatas
    ? { ordem: opcoes.ordemDatas, ambigua: false, conflito: false }
    : detetarOrdemDatas(corpo.map(function (l) { return l[col.data]; }));
  res.ordemDatas = ordemDatas;
  if (ordemDatas.conflito) {
    res.avisos.push({
      tipo: 'datas-conflito',
      msg: 'As datas do ficheiro não são coerentes: umas parecem dd/mm e outras mm/dd. ' +
           'Li tudo como dd/mm — confirma o intervalo antes de importar.'
    });
  } else if (ordemDatas.ambigua) {
    res.avisos.push({
      tipo: 'datas-ambiguas',
      msg: 'Nenhuma data do ficheiro passa do dia 12, por isso dd/mm e mm/dd são ' +
           'indistinguíveis. Li como dd/mm (formato português).'
    });
  }

  var porExercicio = {}, porSessao = {}, ignoradas = [];

  for (var i = 0; i < corpo.length; i++) {
    var linha = corpo[i];
    var nLinha = i + (corpo === lido.linhas ? 1 : 2);   // numero para a mensagem

    var data = analisarData(linha[col.data], ordemDatas.ordem);
    var nome = String(linha[col.exercicio] == null ? '' : linha[col.exercicio]).trim();
    if (!data || !nome) {
      ignoradas.push({ linha: nLinha, motivo: !data ? 'data ilegível' : 'exercício sem nome' });
      continue;
    }

    var grupo = traduzirGrupo(col.categoria !== -1 ? linha[col.categoria] : '');
    var peso = _pesoDaLinha(linha, col);
    var reps = col.reps !== -1 ? analisarNumero(linha[col.reps]) : null;
    var rir = col.rir !== -1 ? analisarNumero(linha[col.rir]) : null;
    var distancia = col.distancia !== -1 ? analisarNumero(linha[col.distancia]) : null;
    var tempo = col.tempo !== -1 ? analisarTempo(linha[col.tempo]) : null;
    var nota = col.nota !== -1 ? String(linha[col.nota] || '').trim() : '';
    var tipo = _tipoDaLinha(linha, col, peso, reps, distancia, tempo);

    // Uma serie tem de trazer alguma coisa: reps, tempo ou distancia.
    if (reps === null && tempo === null && distancia === null) {
      ignoradas.push({ linha: nLinha, motivo: 'sem repetições, tempo nem distância' });
      continue;
    }

    var chaveEx = normalizarCabecalho(nome) + '|' + normalizarCabecalho(grupo);
    if (!porExercicio[chaveEx]) {
      porExercicio[chaveEx] = {
        id: Object.keys(porExercicio).length + 1,
        nome: nome, grupo: grupo, tipo: tipo,
        descansoSeg: null, notas: null, arquivado: false
      };
    }
    var ex = porExercicio[chaveEx];

    if (!porSessao[data]) {
      porSessao[data] = { id: Object.keys(porSessao).length + 1, data: data, inicio: null, fim: null, notas: null };
    }
    var sessao = porSessao[data];

    res.series.push({
      id: res.series.length + 1,
      sessaoId: sessao.id,
      exercicioId: ex.id,
      data: data,
      ordemExercicio: 0,
      ordem: 0,
      peso: peso,
      reps: reps === null ? null : Math.round(reps),
      rir: rir,
      tempoSeg: tempo,
      distancia: distancia,
      supersetId: null,
      nota: nota || null
    });
    res.resumo.porGrupo[grupo] = (res.resumo.porGrupo[grupo] || 0) + 1;
  }

  // A ordem dentro de cada sessao perde-se no CSV; reconstroi-se pela ordem
  // em que as linhas aparecem, que e a ordem em que o FitNotes as escreveu.
  var contaPorSessao = {};
  res.series.forEach(function (s) {
    var c = contaPorSessao[s.sessaoId] || (contaPorSessao[s.sessaoId] = { ex: {}, n: 0 });
    if (c.ex[s.exercicioId] === undefined) c.ex[s.exercicioId] = Object.keys(c.ex).length;
    s.ordemExercicio = c.ex[s.exercicioId];
    s.ordem = c.n++;
  });

  res.exercicios = Object.keys(porExercicio).map(function (k) { return porExercicio[k]; })
    .sort(function (a, b) { return a.grupo.localeCompare(b.grupo) || a.nome.localeCompare(b.nome); });
  res.sessoes = Object.keys(porSessao).map(function (k) { return porSessao[k]; })
    .sort(function (a, b) { return a.data < b.data ? -1 : 1; });

  var datas = res.sessoes.map(function (s) { return s.data; });
  res.resumo.series = res.series.length;
  res.resumo.sessoes = res.sessoes.length;
  res.resumo.exercicios = res.exercicios.length;
  res.resumo.de = datas[0] || null;
  res.resumo.ate = datas[datas.length - 1] || null;
  res.resumo.ignoradas = ignoradas.length;
  res.ignoradas = ignoradas;

  if (ignoradas.length) {
    res.avisos.push({
      tipo: 'linhas-ignoradas',
      msg: ignoradas.length + ' linha(s) foram postas de lado por não dar para as ler.',
      detalhe: ignoradas.slice(0, 20)
    });
  }
  return res;
}

/* --------------------------------------------------------------------------
   Recordes pessoais

   A regra nao foi inventada: foi medida contra as 1187 series que o proprio
   FitNotes ja tinha marcado como recorde de sempre nesta base. Bate certo nas
   1187, sem nenhuma a mais nem a menos.

   Uma serie e recorde quando nenhuma serie anterior do mesmo exercicio a
   domina, ou seja quando nao houve antes nenhuma serie que fosse ao mesmo
   tempo mais pesada (ou igual) E com mais repeticoes (ou iguais).
   Dito de outra forma: o peso tem de bater o melhor peso de todas as series
   anteriores que tenham feito tantas repeticoes ou mais.
   ----------------------------------------------------------------------- */

function _ordemCronologica(a, b) {
  if (a.data !== b.data) return a.data < b.data ? -1 : 1;
  if ((a.ordemExercicio || 0) !== (b.ordemExercicio || 0)) return (a.ordemExercicio || 0) - (b.ordemExercicio || 0);
  return (a.ordem || 0) - (b.ordem || 0);
}

function detetarRecordes(series) {
  var uteis = series.filter(function (s) {
    return serieFeita(s) && Number.isFinite(s.peso) && Number.isFinite(s.reps) && s.reps >= 1;
  }).sort(_ordemCronologica);

  var melhorDesde = {};    // exercicio -> por n.o de reps, melhor peso com reps >= esse
  var melhorPeso = {};     // exercicio -> peso maximo de sempre
  var melhor1RM = {};      // exercicio -> melhor 1RM estimado de sempre
  var recordes = [];

  uteis.forEach(function (s) {
    var ex = s.exercicioId;
    if (!melhorDesde[ex]) melhorDesde[ex] = [];
    var curva = melhorDesde[ex];
    var r = s.reps;
    var referencia = curva[r] === undefined ? -1 : curva[r];

    var tipos = [];
    if (s.peso > referencia) tipos.push('reps');           // recorde para este n.o de reps
    if (s.peso > (melhorPeso[ex] === undefined ? -1 : melhorPeso[ex])) tipos.push('peso');
    var est = epley(s.peso, s.reps);
    if (est !== null && est > (melhor1RM[ex] === undefined ? -1 : melhor1RM[ex])) tipos.push('1rm');

    if (tipos.length) recordes.push({ serieId: s.id, exercicioId: ex, data: s.data, tipos: tipos });

    // Actualizar so depois de comparar: uma serie nao pode bater-se a si propria.
    for (var k = 1; k <= r; k++) {
      if (curva[k] === undefined || s.peso > curva[k]) curva[k] = s.peso;
    }
    if (melhorPeso[ex] === undefined || s.peso > melhorPeso[ex]) melhorPeso[ex] = s.peso;
    if (est !== null && (melhor1RM[ex] === undefined || est > melhor1RM[ex])) melhor1RM[ex] = est;
  });

  return recordes;
}

/* Melhor marca de sempre por exercicio, para a ficha de cada um. */
function melhoresPorExercicio(series) {
  var por = {};
  series.forEach(function (s) {
    if (!serieFeita(s)) return;
    if (!Number.isFinite(s.peso) || !Number.isFinite(s.reps) || s.reps < 1) return;
    var m = por[s.exercicioId] || (por[s.exercicioId] = {
      exercicioId: s.exercicioId, pesoMax: null, serieDoPesoMax: null,
      melhor1RM: null, serieDo1RM: null, melhorVolumeSerie: null, totalSeries: 0, ultima: null
    });
    m.totalSeries++;
    if (m.ultima === null || s.data > m.ultima) m.ultima = s.data;
    if (m.pesoMax === null || s.peso > m.pesoMax) { m.pesoMax = s.peso; m.serieDoPesoMax = s; }
    var est = estimar1RM(s.peso, s.reps);
    if (est && (m.melhor1RM === null || est.media > m.melhor1RM)) { m.melhor1RM = est.media; m.serieDo1RM = s; }
    var vol = s.peso * s.reps;
    if (m.melhorVolumeSerie === null || vol > m.melhorVolumeSerie) m.melhorVolumeSerie = vol;
  });
  return por;
}

/* --------------------------------------------------------------------------
   Cargas maximas por numero de repeticoes

   A carga maxima para N repeticoes NAO e o melhor peso feito com exactamente
   N repeticoes. E o melhor peso feito com N repeticoes OU MAIS.

   O porque, com um caso real do historico: no Leg Extension houve 111,5 kg a
   10 repeticoes e 109 kg a 8. Dizer que a marca das 8 e 109 kg esta errado —
   quem fez 10 com 111,5 fez 8 com 111,5 pelo caminho. A marca das 8 e 111,5.

   Ja as 12 ficam mesmo em 109, porque nunca la houve 111,5 com 12 ou mais.
   Por isso a curva desce sempre (ou fica igual) a medida que as repeticoes
   sobem, que e como o corpo funciona.
   ----------------------------------------------------------------------- */

/* A curva completa: pesos[n] e o melhor peso levantado com n repeticoes ou
   mais. Fica com um buraco (undefined) nas repeticoes acima da serie mais
   longa que ja se fez. */
function curvaRepMax(series, exercicioId) {
  var uteis = series.filter(function (s) {
    return s.exercicioId === exercicioId && serieFeita(s) &&
      Number.isFinite(s.peso) && s.peso > 0 &&
      Number.isFinite(s.reps) && s.reps >= 1;
  });
  if (!uteis.length) return { pesos: [], origem: [], maxReps: 0, repsFeitas: [] };

  var maxReps = uteis.reduce(function (m, s) { return Math.max(m, s.reps); }, 0);
  var pesos = new Array(maxReps + 1);
  var origem = new Array(maxReps + 1);

  uteis.forEach(function (s) {
    // Uma serie de N repeticoes conta para N e para todas as abaixo.
    for (var n = 1; n <= s.reps; n++) {
      var atual = pesos[n];
      if (atual === undefined || s.peso > atual) {
        pesos[n] = s.peso;
        origem[n] = s;
      } else if (s.peso === atual && origem[n]) {
        // Empate no peso: fica a serie mais longa, e entre iguais a mais
        // antiga — foi essa que a marca custou primeiro.
        if (s.reps > origem[n].reps ||
            (s.reps === origem[n].reps && s.data < origem[n].data)) {
          origem[n] = s;
        }
      }
    }
  });

  var repsFeitas = [];
  uteis.forEach(function (s) {
    if (repsFeitas.indexOf(s.reps) === -1) repsFeitas.push(s.reps);
  });
  repsFeitas.sort(function (a, b) { return a - b; });

  return { pesos: pesos, origem: origem, maxReps: maxReps, repsFeitas: repsFeitas };
}

/* O peso a bater para um dado numero de repeticoes. */
function melhorPesoParaReps(curva, reps) {
  if (!curva || !Number.isFinite(reps) || reps < 1) return null;
  var p = curva.pesos[reps];
  return p === undefined ? null : p;
}

/* Uma linha por numero de repeticoes que ja foi feito, com o valor da curva.
   Nao se inventam linhas para repeticoes que nunca se fizeram. */
function recordesPorReps(series, exercicioId) {
  var curva = curvaRepMax(series, exercicioId);
  return curva.repsFeitas.map(function (n) {
    var s = curva.origem[n];
    var est = estimar1RM(curva.pesos[n], n);
    return {
      reps: n,
      peso: curva.pesos[n],
      data: s ? s.data : null,
      serieId: s ? s.id : null,
      // Quando o valor veio de uma serie mais longa, diz-se de qual: senao a
      // data ao lado do numero parecia de uma serie que nao existiu.
      repsOrigem: s ? s.reps : n,
      herdado: !!(s && s.reps > n),
      rm1: est ? est.media : null
    };
  });
}

/* --------------------------------------------------------------------------
   Volume e numero de series por periodo e por grupo muscular

   Volume = soma de reps x peso. As series de peso corporal (peso 0) contam
   para o numero de series mas nao somam volume nenhum: nao sabemos quanto
   pesava o Bruno em cada dia, e inventar um valor estragaria o grafico.
   ----------------------------------------------------------------------- */

function agregarPorPeriodo(series, exercicios, opcoes) {
  opcoes = opcoes || {};
  var periodo = opcoes.periodo || 'semana';
  var grupoDe = {};
  (exercicios || []).forEach(function (e) { grupoDe[e.id] = e.grupo || 'Outros'; });

  var baldes = {};
  series.forEach(function (s) {
    if (!s.data || !serieFeita(s)) return;
    if (opcoes.de && s.data < opcoes.de) return;
    if (opcoes.ate && s.data > opcoes.ate) return;
    var chave = periodo === 'mes' ? chaveMes(s.data) : chaveSemanaIso(s.data);
    var b = baldes[chave] || (baldes[chave] = {
      chave: chave,
      inicio: periodo === 'mes' ? s.data.slice(0, 7) + '-01' : segundaDaSemana(s.data),
      grupos: {}, total: { volume: 0, series: 0, reps: 0 }
    });
    var g = grupoDe[s.exercicioId] || 'Outros';
    var d = b.grupos[g] || (b.grupos[g] = { volume: 0, series: 0, reps: 0 });
    var reps = Number.isFinite(s.reps) ? s.reps : 0;
    var vol = (Number.isFinite(s.peso) ? s.peso : 0) * reps;
    d.series++; d.reps += reps; d.volume += vol;
    b.total.series++; b.total.reps += reps; b.total.volume += vol;
  });

  return Object.keys(baldes).map(function (k) { return baldes[k]; })
    .sort(function (a, b) { return a.inicio < b.inicio ? -1 : 1; });
}

/* --------------------------------------------------------------------------
   RIR: media por sessao, por exercicio e no conjunto
   Series sem RIR nao entram na conta, para nao puxarem a media para baixo.
   ----------------------------------------------------------------------- */

function mediaRir(series) {
  var porData = {}, porExercicio = {}, soma = 0, n = 0;
  series.forEach(function (s) {
    if (!serieFeita(s) || !Number.isFinite(s.rir)) return;
    soma += s.rir; n++;
    var d = porData[s.data] || (porData[s.data] = { data: s.data, soma: 0, n: 0 });
    d.soma += s.rir; d.n++;
    var e = porExercicio[s.exercicioId] || (porExercicio[s.exercicioId] = { soma: 0, n: 0 });
    e.soma += s.rir; e.n++;
  });
  var sessoes = Object.keys(porData).map(function (k) {
    return { data: porData[k].data, media: porData[k].soma / porData[k].n, series: porData[k].n };
  }).sort(function (a, b) { return a.data < b.data ? -1 : 1; });
  var exercicios = {};
  Object.keys(porExercicio).forEach(function (k) {
    exercicios[k] = { media: porExercicio[k].soma / porExercicio[k].n, series: porExercicio[k].n };
  });
  return { porSessao: sessoes, porExercicio: exercicios, global: n ? soma / n : null, comRir: n };
}

/* --------------------------------------------------------------------------
   Progressao de um exercicio, um ponto por dia de treino
   ----------------------------------------------------------------------- */

function progressaoExercicio(series, exercicioId) {
  var porDia = {};
  series.forEach(function (s) {
    if (s.exercicioId !== exercicioId || !s.data || !serieFeita(s)) return;
    var d = porDia[s.data] || (porDia[s.data] = {
      data: s.data, pesoMax: null, melhor1RM: null, volume: 0, series: 0, reps: 0,
      somaRir: 0, comRir: 0
    });
    d.series++;
    var reps = Number.isFinite(s.reps) ? s.reps : 0;
    d.reps += reps;
    if (Number.isFinite(s.peso)) {
      d.volume += s.peso * reps;
      if (d.pesoMax === null || s.peso > d.pesoMax) d.pesoMax = s.peso;
      var est = estimar1RM(s.peso, reps);
      if (est && (d.melhor1RM === null || est.media > d.melhor1RM)) d.melhor1RM = est.media;
    }
    if (Number.isFinite(s.rir)) { d.somaRir += s.rir; d.comRir++; }
  });
  return Object.keys(porDia).map(function (k) {
    var d = porDia[k];
    d.rirMedio = d.comRir ? d.somaRir / d.comRir : null;
    return d;
  }).sort(function (a, b) { return a.data < b.data ? -1 : 1; });
}

/* --------------------------------------------------------------------------
   Evolucao da carga maxima para um dado numero de repeticoes

   Para cada dia de treino, o melhor peso levantado nesse dia com N repeticoes
   ou mais. Responde a "como e que o meu maximo a 5 evoluiu", que e diferente
   de "qual e o meu maximo a 5" — uma e a historia, a outra e o numero.

   Dias em que o exercicio foi feito mas sempre com menos de N repeticoes nao
   dao ponto nenhum: nao ha valor para mostrar, e inventar um a zero fazia o
   grafico mergulhar sem razao.
   ----------------------------------------------------------------------- */

function pesoPorDiaParaReps(series, exercicioId, reps) {
  if (!Number.isFinite(reps) || reps < 1) return [];
  var porDia = {};
  series.forEach(function (s) {
    if (s.exercicioId !== exercicioId || !s.data || !serieFeita(s)) return;
    if (!Number.isFinite(s.peso) || s.peso <= 0) return;
    if (!Number.isFinite(s.reps) || s.reps < reps) return;
    if (porDia[s.data] === undefined || s.peso > porDia[s.data]) porDia[s.data] = s.peso;
  });
  return Object.keys(porDia).sort().map(function (d) {
    return { data: d, peso: porDia[d] };
  });
}

/* --------------------------------------------------------------------------
   Intervalos de datas
   ----------------------------------------------------------------------- */

/* Recua uma quantidade de dias a partir de uma data. */
function recuarDias(dataIso, dias) {
  var d = _dataUtc(dataIso);
  d.setUTCDate(d.getUTCDate() - dias);
  return d.toISOString().slice(0, 10);
}

/* Os periodos que a app oferece. 'tudo' nao tem inicio de proposito. */
var PERIODOS = [
  { chave: '4s', nome: '4 semanas', dias: 28 },
  { chave: '3m', nome: '3 meses', dias: 91 },
  { chave: '6m', nome: '6 meses', dias: 182 },
  { chave: '1a', nome: '1 ano', dias: 365 },
  { chave: 'tudo', nome: 'Tudo', dias: null }
];

/* Devolve {de, ate} a partir da escolha do utilizador. */
function intervaloDoPeriodo(escolha, hoje) {
  escolha = escolha || {};
  if (escolha.tipo === 'datas') {
    return { de: escolha.de || null, ate: escolha.ate || null };
  }
  var p = PERIODOS.filter(function (x) { return x.chave === escolha.tipo; })[0];
  if (!p || p.dias === null) return { de: null, ate: null };
  return { de: recuarDias(hoje, p.dias), ate: hoje };
}

/* Filtra series por intervalo. Um intervalo sem limites deixa passar tudo. */
function filtrarPorIntervalo(series, intervalo) {
  if (!intervalo || (!intervalo.de && !intervalo.ate)) return series;
  return series.filter(function (s) {
    if (!s.data) return false;
    if (intervalo.de && s.data < intervalo.de) return false;
    if (intervalo.ate && s.data > intervalo.ate) return false;
    return true;
  });
}

/* --------------------------------------------------------------------------
   Estimativa de carga por numero de repeticoes

   O contrario do 1RM: partindo do 1RM estimado, quanto se deveria conseguir
   levantar a 1, 2, 3... repeticoes. Serve para ver onde ha folga — se a
   estimativa diz 105 kg a 8 e a marca feita e 100, ha 5 kg por explorar.

   E uma estimativa e nao uma promessa: sai das mesmas formulas do 1RM, e
   essas ja sao aproximacoes. Acima de 15 repeticoes vale pouco.
   ----------------------------------------------------------------------- */

function estimarPesoParaReps(rm1, reps) {
  if (!Number.isFinite(rm1) || rm1 <= 0) return null;
  if (!Number.isFinite(reps) || reps < 1) return null;
  // Com 1 repeticao a estimativa e o proprio 1RM, para ficar coerente com a
  // epley() e a brzycki(), que devolvem o peso quando reps e 1.
  if (reps === 1) return { epley: rm1, brzycki: rm1, media: rm1 };
  var e = rm1 / (1 + reps / 30);
  var b = reps >= 37 ? null : rm1 * (37 - reps) / 36;
  var valores = [e, b].filter(function (v) { return v !== null; });
  return {
    epley: e,
    brzycki: b,
    media: valores.reduce(function (a, v) { return a + v; }, 0) / valores.length
  };
}

/* Uma linha por numero de repeticoes, com a estimativa e, quando existe, a
   marca que foi mesmo feita. */
function estimativasPorReps(rm1, curva, ateReps) {
  var limite = ateReps || 12;
  var linhas = [];
  for (var r = 1; r <= limite; r++) {
    var est = estimarPesoParaReps(rm1, r);
    if (!est) continue;
    var feito = curva ? melhorPesoParaReps(curva, r) : null;
    linhas.push({
      reps: r,
      estimativa: est.media,
      epley: est.epley,
      brzycki: est.brzycki,
      feito: feito,
      // Positivo = ha folga entre o que se estima e o que ja se fez.
      folga: feito === null ? null : est.media - feito,
      fiavel: r <= LIMITE_FIAVEL
    });
  }
  return linhas;
}

/* --------------------------------------------------------------------------
   Objetivos

   Um objetivo sao quatro coisas: onde se estava quando se decidiu (inicial,
   na data 'desde'), onde se quer chegar (alvo) e ate quando (ate). A partir
   disso da-se para desenhar a linha do que era preciso e comparar com o que
   esta a acontecer.

   Serve para subir e para descer: as contas sao as mesmas, so muda o sinal.
   Por isso nunca se compara "maior que" — compara-se o quanto do caminho ja
   foi feito.
   ----------------------------------------------------------------------- */

function progressoDeObjetivo(valorAtual, objetivo, hoje) {
  if (!objetivo || !Number.isFinite(objetivo.alvo) || !objetivo.ate || !objetivo.desde) return null;
  if (!Number.isFinite(objetivo.inicial)) return null;

  // Sem valor conhecido ainda, conta-se como se estivesse no ponto de partida.
  var atual = Number.isFinite(valorAtual) ? valorAtual : objetivo.inicial;

  var caminhoTotal = objetivo.alvo - objetivo.inicial;
  var jaFeito = atual - objetivo.inicial;
  var fracao = caminhoTotal === 0 ? 1 : jaFeito / caminhoTotal;

  var diasTotais = diasEntre(objetivo.desde, objetivo.ate);
  var diasPassados = diasEntre(objetivo.desde, hoje);
  var diasRestantes = diasEntre(hoje, objetivo.ate);

  // Onde se devia estar hoje, se o caminho fosse feito a ritmo constante.
  var fracaoEsperada = diasTotais <= 0 ? 1 : Math.max(0, Math.min(1, diasPassados / diasTotais));
  var esperadoHoje = objetivo.inicial + caminhoTotal * fracaoEsperada;

  return {
    atual: atual,
    inicial: objetivo.inicial,
    alvo: objetivo.alvo,
    falta: objetivo.alvo - atual,
    fracao: fracao,
    percentagem: Math.max(0, Math.min(100, fracao * 100)),
    atingido: caminhoTotal === 0 || fracao >= 1,
    diasTotais: diasTotais,
    diasRestantes: diasRestantes,
    esperadoHoje: esperadoHoje,
    adiantado: fracao >= fracaoEsperada,
    // Quanto e preciso mudar por semana daqui para a frente.
    ritmoSemanal: diasRestantes > 0 ? (objetivo.alvo - atual) / diasRestantes * 7 : null,
    // Dois pontos, para desenhar a linha do objetivo por cima do que aconteceu.
    linha: [
      { x: objetivo.desde, y: objetivo.inicial },
      { x: objetivo.ate, y: objetivo.alvo }
    ]
  };
}

/* ===========================================================================
   NÚCLEO:FIM
   ======================================================================== */

/* ===========================================================================
   Base de dados local (IndexedDB)

   Porque IndexedDB e nao localStorage: 28.747 series ocupam uns 6 MB, e o
   localStorage costuma parar nos 5 MB — e guarda tudo como texto, o que
   obrigaria a reescrever o ficheiro inteiro a cada serie gravada.

   Como as 28.747 series cabem folgadamente na memoria de um iPhone, sao lidas
   todas de uma vez ao arrancar e ficam em Estado. A IndexedDB e o sitio onde
   se escreve; a memoria e o sitio de onde se le. Assim os graficos sao
   instantaneos e nao ha uma unica leitura assincrona no meio do ecra.
   ======================================================================== */

var BD = (function () {
  var NOME = 'treinos', VERSAO = 2, ligacao = null;

  function abrir() {
    if (ligacao) return Promise.resolve(ligacao);
    return new Promise(function (resolve, reject) {
      var pedido = indexedDB.open(NOME, VERSAO);
      pedido.onupgradeneeded = function (e) {
        var bd = e.target.result;
        if (!bd.objectStoreNames.contains('exercicios')) {
          var ex = bd.createObjectStore('exercicios', { keyPath: 'id', autoIncrement: true });
          ex.createIndex('grupo', 'grupo', { unique: false });
          ex.createIndex('nome', 'nome', { unique: false });
        }
        if (!bd.objectStoreNames.contains('sessoes')) {
          var se = bd.createObjectStore('sessoes', { keyPath: 'id', autoIncrement: true });
          se.createIndex('data', 'data', { unique: false });
        }
        if (!bd.objectStoreNames.contains('series')) {
          var sr = bd.createObjectStore('series', { keyPath: 'id', autoIncrement: true });
          sr.createIndex('data', 'data', { unique: false });
          sr.createIndex('sessaoId', 'sessaoId', { unique: false });
          // Indice composto: e o que faz a ficha de um exercicio abrir de
          // imediato mesmo com 6 anos de historico atras.
          sr.createIndex('exercicioData', ['exercicioId', 'data'], { unique: false });
        }
        if (!bd.objectStoreNames.contains('definicoes')) {
          bd.createObjectStore('definicoes', { keyPath: 'chave' });
        }
        // A chave e um id proprio e nao a data: ha dias com duas pesagens
        // (27/06 e 12/07 de 2020, no historico do Bruno) e com a data por
        // chave a segunda apagava a primeira sem dizer nada.
        if (bd.objectStoreNames.contains('pesagens') && e.oldVersion < 2) {
          bd.deleteObjectStore('pesagens');
        }
        if (!bd.objectStoreNames.contains('pesagens')) {
          var pe = bd.createObjectStore('pesagens', { keyPath: 'id', autoIncrement: true });
          pe.createIndex('data', 'data', { unique: false });
        }
      };
      pedido.onsuccess = function () {
        ligacao = pedido.result;
        // Se outro separador pedir uma versao mais nova, esta ligacao tem de
        // sair da frente, senao e ela que fica a bloquear a app do lado de la.
        ligacao.onversionchange = function () { ligacao.close(); ligacao = null; };
        resolve(ligacao);
      };
      pedido.onerror = function () { reject(pedido.error); };

      // A IndexedDB nao falha quando esta bloqueada: fica calada para sempre.
      // Sem isto, uma app aberta noutro separador deixava este ecra em branco
      // sem uma unica mensagem.
      pedido.onblocked = function () {
        reject(new Error('A base está a ser usada noutro separador. ' +
          'Fecha os outros separadores da app e volta a abrir.'));
      };
      setTimeout(function () {
        if (!ligacao) {
          reject(new Error('A base de dados demorou de mais a abrir. ' +
            'Fecha os outros separadores da app e tenta outra vez.'));
        }
      }, 10000);
    });
  }

  function transacao(lojas, modo) {
    return abrir().then(function (bd) { return bd.transaction(lojas, modo); });
  }

  function pedir(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  return {
    abrir: abrir,

    todos: function (loja) {
      return transacao([loja], 'readonly').then(function (t) {
        return pedir(t.objectStore(loja).getAll());
      });
    },

    guardar: function (loja, objeto) {
      return transacao([loja], 'readwrite').then(function (t) {
        return pedir(t.objectStore(loja).put(objeto));
      });
    },

    apagar: function (loja, chave) {
      return transacao([loja], 'readwrite').then(function (t) {
        return pedir(t.objectStore(loja).delete(chave));
      });
    },

    /* Escreve muitos registos numa transacao so. Importar 28.747 series uma a
       uma levaria minutos; assim demora segundos. */
    guardarMuitos: function (loja, objetos) {
      if (!objetos || !objetos.length) return Promise.resolve(0);
      return transacao([loja], 'readwrite').then(function (t) {
        var armazem = t.objectStore(loja);
        return new Promise(function (resolve, reject) {
          t.oncomplete = function () { resolve(objetos.length); };
          t.onerror = function () { reject(t.error); };
          t.onabort = function () { reject(t.error); };
          // Todos os pedidos de seguida, sem esperar pela resposta de cada um:
          // a IndexedDB poe-nos em fila e despacha-os em bloco. Esperar por
          // cada put antes de mandar o seguinte faz cada um dar uma volta ao
          // ciclo de eventos, e com 28.747 series isso pesa muito.
          for (var i = 0; i < objetos.length; i++) armazem.put(objetos[i]);
        });
      });
    },

    /* Apaga muitos registos numa transacao so, pela mesma razao que
       guardarMuitos: mil transacoes separadas sao mil idas ao ciclo de
       eventos, e apagar um exercicio pode levar mil e duzentas series. */
    apagarMuitos: function (loja, chaves) {
      if (!chaves || !chaves.length) return Promise.resolve(0);
      return transacao([loja], 'readwrite').then(function (t) {
        var armazem = t.objectStore(loja);
        return new Promise(function (resolve, reject) {
          t.oncomplete = function () { resolve(chaves.length); };
          t.onerror = function () { reject(t.error); };
          t.onabort = function () { reject(t.error); };
          for (var i = 0; i < chaves.length; i++) armazem.delete(chaves[i]);
        });
      });
    },

    limpar: function (lojas) {
      return transacao(lojas, 'readwrite').then(function (t) {
        lojas.forEach(function (l) { t.objectStore(l).clear(); });
        return new Promise(function (resolve, reject) {
          t.oncomplete = resolve;
          t.onerror = function () { reject(t.error); };
        });
      });
    }
  };
})();

/* ===========================================================================
   Estado em memoria
   ======================================================================== */

var Estado = {
  exercicios: [],
  sessoes: [],
  series: [],
  pesagens: [],
  definicoes: {
    descansoPadraoSeg: 120,
    ultimoExercicio: null
  },

  // Ecra
  vista: 'treino',
  dataAtual: null,
  exercicioAtivo: null,
  sessaoAberta: null,       // no historico, a sessao que se esta a ver
  abaAnalises: 'volume',
  exercicioAnalise: null,
  mesCalendario: null,
  grupoAberto: null,          // nos Exercicios, o grupo em que se entrou
  metricaAnalise: 'peso',     // que numero o grafico do exercicio mostra
  repsDaMetrica: 5,           // para a metrica "maximo a N reps"
  periodo: { tipo: '6m' },    // janela de tempo das Analises

  // Indices calculados, refeitos quando os dados mudam
  _porId: {},
  _recordes: null,
  _melhores: null
};

/* ===========================================================================
   Proteger os dados de serem apagados pelo iOS

   O Safari apaga a IndexedDB de um site ao fim de 7 dias sem lá se voltar.
   Uma app adicionada ao ecra principal esta isenta disso — por isso e que
   isso nao e uma sugestao, e a diferenca entre ter e nao ter o historico.

   Alem disso pede-se armazenamento persistente, que noutros browsers tira o
   site da lista dos que podem ser limpos quando o disco aperta.
   ======================================================================== */

var Armazenamento = {
  noEcraPrincipal: false,
  persistente: null,      // true, false, ou null quando o browser nao diz
  noIOS: false,

  verificar: function () {
    // O iOS usa navigator.standalone; os outros usam a media query.
    this.noEcraPrincipal = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

    var ua = navigator.userAgent || '';
    // O iPad recente diz que e um Mac; distingue-se por ter ecra tactil.
    this.noIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // Nota para quem mexer nisto: no iPhone cada separador e cada icone do
    // ecra principal tem o seu armazenamento proprio. O que se regista num
    // sitio pode nao estar no outro — dai o aviso falar disso.

    var eu = this;
    if (!navigator.storage || !navigator.storage.persist) return Promise.resolve();
    return navigator.storage.persisted()
      .then(function (ja) { return ja ? true : navigator.storage.persist(); })
      .then(function (ok) { eu.persistente = ok; })
      .catch(function () { eu.persistente = null; });
  },

  /* O aviso que aparece enquanto a app nao estiver no ecra principal. */
  aviso: function () {
    if (this.noEcraPrincipal) return '';

    var html = '<div class="cartao" style="border-color:var(--ambar)">' +
      '<h3 style="color:var(--ambar)">Estás num separador, não no ícone</h3>' +
      '<p class="pequeno suave" style="margin:0">No iPhone, os dados de um separador ' +
      'são apagados ao fim de 7 dias sem lá voltares. Uma app aberta pelo ícone do ecrã ' +
      'principal está isenta disso.</p>' +
      '<p class="pequeno suave">Partilhar &rsaquo; Adicionar ao ecrã principal — e depois ' +
      '<b>abre sempre pelo ícone</b>. Se já a adicionaste, abre-a por lá: este aviso não ' +
      'aparece na versão do ícone.</p>';

    // Cada separador e cada icone tem o seu armazenamento proprio no iOS. Se
    // ele registar treinos aqui, podem nao estar do outro lado.
    if (this.noIOS && Estado.series.length) {
      html += '<p class="mini fraco">O que registares aqui pode não aparecer no ícone: ' +
        'no iPhone cada um tem o seu armazenamento. Se este separador tem treinos que o ' +
        'ícone não tem, guarda um backup em Exercícios &rsaquo; Dados e importa-o lá.</p>';
    }

    return html + '<p class="mini fraco" style="margin-bottom:0">Guarda um backup de vez ' +
      'em quando, de qualquer forma.</p></div>';
  }
};

/* ===========================================================================
   Manter o ecra ligado

   Entre series passam-se dois minutos sem se tocar no telemovel, e o ecra
   apaga-se. Voltar a acender e desbloquear a meio de um treino e chato.

   O bloqueio e largado pelo sistema sempre que a app deixa de estar a vista
   (mudar de app, bloquear o telemovel), por isso tem de ser pedido outra vez
   quando ela volta — nao basta pedir uma vez ao arrancar.

   Existe no iPhone a partir do iOS 16.4. Quando nao existe, diz-se; nao se
   finge que ficou ligado.
   ======================================================================== */

var Ecra = {
  suportado: typeof navigator !== 'undefined' && 'wakeLock' in navigator,
  bloqueio: null,

  querAtivo: function () {
    // Ligado por defeito: foi para isso que foi pedido.
    return Estado.definicoes.ecraSempreLigado !== false;
  },

  pedir: function () {
    if (!this.suportado || !this.querAtivo() || this.bloqueio) return Promise.resolve(false);
    var eu = this;
    return navigator.wakeLock.request('screen').then(function (b) {
      eu.bloqueio = b;
      b.addEventListener('release', function () { eu.bloqueio = null; });
      return true;
    }).catch(function () {
      // O sistema pode recusar (bateria fraca, por exemplo). Nao ha nada a
      // fazer e nao vale a pena chatear com um aviso.
      eu.bloqueio = null;
      return false;
    });
  },

  largar: function () {
    if (!this.bloqueio) return Promise.resolve();
    var b = this.bloqueio;
    this.bloqueio = null;
    return b.release().catch(function () { /* ja estava largado */ });
  },

  aplicar: function () {
    return this.querAtivo() ? this.pedir() : this.largar();
  }
};

/* Quando a app volta a estar a vista, o bloqueio tem de ser pedido de novo. */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) Ecra.pedir();
});

function hojeIso() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}

/* Refaz os indices depois de qualquer alteracao aos dados. Com 28.747 series
   demora uns 60 ms, o que e imperceptivel entre series mas seria de mais a
   cada tecla — por isso so se chama quando os dados mudam mesmo. */
function reindexar() {
  Estado._porId = {};
  Estado.exercicios.forEach(function (e) { Estado._porId[e.id] = e; });
  Estado._recordes = null;
  Estado._melhores = null;
  Estado._curvas = null;
  Estado._marcas = null;
}

function exercicioPorId(id) { return Estado._porId[id] || null; }

function recordes() {
  if (!Estado._recordes) {
    Estado._recordes = {};
    detetarRecordes(Estado.series).forEach(function (r) { Estado._recordes[r.serieId] = r; });
  }
  return Estado._recordes;
}

function melhores() {
  if (!Estado._melhores) Estado._melhores = melhoresPorExercicio(Estado.series);
  return Estado._melhores;
}

function seriesDoDia(data) {
  return Estado.series.filter(function (s) { return s.data === data; })
    .sort(function (a, b) {
      return (a.ordemExercicio - b.ordemExercicio) || (a.ordem - b.ordem);
    });
}

function seriesDoExercicio(id) {
  return Estado.series.filter(function (s) { return s.exercicioId === id; });
}

function proximoId(lista) {
  var maximo = 0;
  lista.forEach(function (o) { if (o.id > maximo) maximo = o.id; });
  return maximo + 1;
}

/* ===========================================================================
   Ajudas de ecra
   ======================================================================== */

var $ = function (sel) { return document.querySelector(sel); };

function esc(texto) {
  return String(texto == null ? '' : texto)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function num(valor, casas) {
  if (valor === null || valor === undefined || !Number.isFinite(valor)) return '—';
  var n = casas === undefined ? (Math.abs(valor % 1) < 0.001 ? 0 : 1) : casas;
  return valor.toLocaleString('pt-PT', { minimumFractionDigits: n, maximumFractionDigits: n });
}

/* "1 série" e nao "1 séries". Aparece em sitios de mais para se andar a
   escrever o if a mao de cada vez. */
function plural(n, singular, plural) {
  return num(n, 0) + ' ' + (n === 1 ? singular : plural);
}

function kg(valor) {
  if (valor === null || valor === undefined || !Number.isFinite(valor)) return '—';
  return num(valor) + ' kg';
}

/* Volumes chegam depressa aos milhoes de quilos; em toneladas leem-se melhor. */
function volumeCurto(valor) {
  if (!Number.isFinite(valor) || valor === 0) return '0 kg';
  if (valor >= 1000000) return num(valor / 1000000, 1) + ' kt';
  if (valor >= 1000) return num(valor / 1000, 1) + ' t';
  return num(valor, 0) + ' kg';
}

var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
  'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
var MESES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun',
  'jul', 'ago', 'set', 'out', 'nov', 'dez'];
var DIAS_SEMANA = ['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];

function dataCurta(iso) {
  var p = iso.split('-');
  return +p[2] + ' ' + MESES_CURTO[+p[1] - 1];
}

function dataLonga(iso) {
  var p = iso.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  var diaSemana = DIAS_SEMANA[(d.getUTCDay() + 6) % 7];
  // O ano so aparece quando nao e o corrente. Num historico de seis anos,
  // "13 de janeiro" sozinho nao diz nada.
  var ano = p[0] === hojeIso().slice(0, 4) ? '' : ' de ' + p[0];
  return diaSemana + ', ' + (+p[2]) + ' de ' + MESES[+p[1] - 1] + ano;
}

function dataRelativa(iso) {
  var d = diasEntre(iso, hojeIso());
  if (d === 0) return 'Hoje';
  if (d === 1) return 'Ontem';
  if (d === -1) return 'Amanhã';
  if (d > 1 && d < 7) return 'Há ' + d + ' dias';
  return dataLonga(iso);
}

function duracaoCurta(segundos) {
  if (!Number.isFinite(segundos)) return '—';
  var m = Math.floor(segundos / 60), s = segundos % 60;
  return m + ':' + String(s).padStart(2, '0');
}

var tempoAviso = null;
function avisar(texto) {
  var el = $('#aviso');
  el.textContent = texto;
  el.classList.add('on');
  clearTimeout(tempoAviso);
  tempoAviso = setTimeout(function () { el.classList.remove('on'); }, 2200);
}

function vibrar(padrao) {
  if (navigator.vibrate) { try { navigator.vibrate(padrao); } catch (e) { /* nao faz mal */ } }
}

/* --- Folha que sobe de baixo --- */
function abrirFolha(titulo, html, aoAbrir) {
  $('#folhaTitulo').textContent = titulo;
  $('#folhaCorpo').innerHTML = html;
  $('#veu').classList.add('on');
  $('#folha').classList.add('on');
  if (aoAbrir) aoAbrir($('#folhaCorpo'));
}

function fecharFolha() {
  $('#veu').classList.remove('on');
  $('#folha').classList.remove('on');
}

/* --- Confirmacao sem usar confirm(), que bloqueia o WebView --- */
function confirmar(titulo, texto, textoBotao, aoConfirmar) {
  abrirFolha(titulo,
    '<p class="suave" style="margin-top:0">' + esc(texto) + '</p>' +
    '<button class="btn perigo larga" id="fConfirmar">' + esc(textoBotao) + '</button>' +
    '<button class="btn larga" id="fCancelar" style="margin-top:8px">Cancelar</button>',
    function (corpo) {
      corpo.querySelector('#fConfirmar').onclick = function () { fecharFolha(); aoConfirmar(); };
      corpo.querySelector('#fCancelar').onclick = fecharFolha;
    });
}

/* ===========================================================================
   Graficos em SVG, feitos a mao

   Nao ha nenhuma biblioteca aqui de proposito. Uma app que tem de funcionar
   com o telemovel em modo de aviao nao pode depender de nada que venha da
   rede, e cachear 200 KB de biblioteca para desenhar linhas e barras nao se
   justifica. Sao umas 200 linhas e o estilo fica colado ao resto da app.

   Todos os graficos usam viewBox, por isso encolhem e esticam com o ecra sem
   precisarem de saber quantos pixeis tem.
   ======================================================================== */

var CORES_GRUPO = {
  'Peito': '#3b82f6',
  'Costas': '#22c55e',
  'Pernas': '#f59e0b',
  'Ombros': '#06b6d4',
  'Bíceps': '#ef4444',
  // Lima e nao teal: o teal ficava a 17 graus do ciano dos Ombros e as duas
  // barras eram indistinguiveis num grafico empilhado.
  'Tríceps': '#84cc16',
  'Abdominais': '#eab308',
  'Cardio': '#ec4899',
  'Outros': '#64748b'
};

function corDoGrupo(grupo) {
  if (CORES_GRUPO[grupo]) return CORES_GRUPO[grupo];
  // Grupos criados pelo utilizador ficam com uma cor estavel tirada do nome,
  // para nao mudarem de cor de cada vez que a app abre.
  var h = 0;
  for (var i = 0; i < grupo.length; i++) h = (h * 31 + grupo.charCodeAt(i)) % 360;
  return 'hsl(' + h + ' 55% 55%)';
}

/* Escolhe uma escala legivel para o eixo: 1, 2, 5, 10, 20, 50... */
function passoBonito(intervalo, alvoDeMarcas) {
  var cru = intervalo / (alvoDeMarcas || 4);
  if (cru <= 0) return 1;
  var magnitude = Math.pow(10, Math.floor(Math.log10(cru)));
  var norm = cru / magnitude;
  var passo = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return passo * magnitude;
}

function formatarEixo(valor, unidade) {
  // O zero fica so "0": num eixo em toneladas, "0 kg" destoa.
  if (valor === 0) return '0';
  if (unidade === 'volume') return volumeCurto(valor);
  if (Math.abs(valor) >= 1000) return num(valor / 1000, 1) + 'k';
  return num(valor, Math.abs(valor % 1) < 0.01 ? 0 : 1);
}

/* --------------------------------------------------------------------------
