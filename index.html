/* ===========================================================================
   Proteger os dados de serem apagados pelo iOS

   O Safari apaga a IndexedDB de um site ao fim de 7 dias sem lá se voltar.
   Uma app adicionada ao ecra principal esta isenta disso — por isso e que
   isso nao e uma sugestao, e a diferenca entre ter e nao ter o historico.

   Alem disso pede-se armazenamento persistente, que noutros browsers tira o
   site da lista dos que podem ser limpos quando o disco aperta.
   ======================================================================== */

var Armazenamento = {
  noEcraPrincipal: false,
  persistente: null,      // true, false, ou null quando o browser nao diz
  noIOS: false,

  verificar: function () {
    // O iOS usa navigator.standalone; os outros usam a media query.
    this.noEcraPrincipal = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

    var ua = navigator.userAgent || '';
    // O iPad recente diz que e um Mac; distingue-se por ter ecra tactil.
    this.noIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // Nota para quem mexer nisto: no iPhone cada separador e cada icone do
    // ecra principal tem o seu armazenamento proprio. O que se regista num
    // sitio pode nao estar no outro — dai o aviso falar disso.

    var eu = this;
    if (!navigator.storage || !navigator.storage.persist) return Promise.resolve();
    return navigator.storage.persisted()
      .then(function (ja) { return ja ? true : navigator.storage.persist(); })
      .then(function (ok) { eu.persistente = ok; })
      .catch(function () { eu.persistente = null; });
  },

  /* O aviso que aparece enquanto a app nao estiver no ecra principal. */
  aviso: function () {
    if (this.noEcraPrincipal) return '';

    var html = '<div class="cartao" style="border-color:var(--ambar)">' +
      '<h3 style="color:var(--ambar)">Estás num separador, não no ícone</h3>' +
      '<p class="pequeno suave" style="margin:0">No iPhone, os dados de um separador ' +
      'são apagados ao fim de 7 dias sem lá voltares. Uma app aberta pelo ícone do ecrã ' +
      'principal está isenta disso.</p>' +
      '<p class="pequeno suave">Partilhar &rsaquo; Adicionar ao ecrã principal — e depois ' +
      '<b>abre sempre pelo ícone</b>. Se já a adicionaste, abre-a por lá: este aviso não ' +
      'aparece na versão do ícone.</p>';

    // Cada separador e cada icone tem o seu armazenamento proprio no iOS. Se
    // ele registar treinos aqui, podem nao estar do outro lado.
    if (this.noIOS && Estado.series.length) {
      html += '<p class="mini fraco">O que registares aqui pode não aparecer no ícone: ' +
        'no iPhone cada um tem o seu armazenamento. Se este separador tem treinos que o ' +
        'ícone não tem, guarda um backup em Exercícios &rsaquo; Dados e importa-o lá.</p>';
    }

    return html + '<p class="mini fraco" style="margin-bottom:0">Guarda um backup de vez ' +
      'em quando, de qualquer forma.</p></div>';
  }
};

/* ===========================================================================
   Manter o ecra ligado

   Entre series passam-se dois minutos sem se tocar no telemovel, e o ecra
   apaga-se. Voltar a acender e desbloquear a meio de um treino e chato.

   O bloqueio e largado pelo sistema sempre que a app deixa de estar a vista
   (mudar de app, bloquear o telemovel), por isso tem de ser pedido outra vez
   quando ela volta — nao basta pedir uma vez ao arrancar.

   Existe no iPhone a partir do iOS 16.4. Quando nao existe, diz-se; nao se
   finge que ficou ligado.
   ======================================================================== */

  },

  /* Um bloqueio ja largado conta como nao ter nenhum: o objeto continua ca
     mas nao segura o ecra. Sem esta distincao, bastava o aviso de largado
     nao chegar a tempo para nunca mais se pedir outro. */
  ativo: function () {
    return !!this.bloqueio && this.bloqueio.released !== true;
  },

  pedir: function () {
    if (!this.suportado || !this.querAtivo() || this.ativo()) return Promise.resolve(false);
    this.bloqueio = null;
    var eu = this;
    try {
      return Promise.resolve(navigator.wakeLock.request('screen')).then(function (b) {
        eu.bloqueio = b;
        b.addEventListener('release', function () { eu.bloqueio = null; });
        return true;
      }).catch(function () {
        // O sistema pode recusar (bateria fraca, por exemplo). Nao ha nada a
        // fazer e nao vale a pena chatear com um aviso.
        eu.bloqueio = null;
        return false;
      });
    } catch (e) {
      // Browsers antigos podem rebentar em vez de recusar. A app segue.
      eu.bloqueio = null;
      return Promise.resolve(false);
    }
  },

  largar: function () {
    if (!this.bloqueio) return Promise.resolve();
    var b = this.bloqueio;
    this.bloqueio = null;
    return b.release().catch(function () { /* ja estava largado */ });
  },

  aplicar: function () {

/* O sistema larga o bloqueio sempre que a app sai de vista, e o aviso de que
   o largou nem sempre chega. Por isso esquece-se o que la estava, e ao voltar
   pede-se outro de raiz. */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { Ecra.bloqueio = null; return; }
  Ecra.pedir();
});

function hojeIso() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}

/* Refaz os indices depois de qualquer alteracao aos dados. Com 28.747 series
   demora uns 60 ms, o que e imperceptivel entre series mas seria de mais a
   cada tecla — por isso so se chama quando os dados mudam mesmo. */
function reindexar() {
  Estado._porId = {};
  Estado.exercicios.forEach(function (e) { Estado._porId[e.id] = e; });
  Estado._recordes = null;
  Estado._melhores = null;
  Estado._curvas = null;
  Estado._curvasPeso = null;
  Estado._marcas = null;
}

function exercicioPorId(id) { return Estado._porId[id] || null; }

function recordes() {
  if (!Estado._recordes) {
    Estado._recordes = {};
    detetarRecordes(Estado.series).forEach(function (r) { Estado._recordes[r.serieId] = r; });
  }
  return Estado._recordes;
}

function melhores() {
  if (!Estado._melhores) Estado._melhores = melhoresPorExercicio(Estado.series);
  return Estado._melhores;
}

function seriesDoDia(data) {
  return Estado.series.filter(function (s) { return s.data === data; })
    .sort(function (a, b) {
      return (a.ordemExercicio - b.ordemExercicio) || (a.ordem - b.ordem);
    });
}

function seriesDoExercicio(id) {
  return Estado.series.filter(function (s) { return s.exercicioId === id; });
}

function proximoId(lista) {
  var maximo = 0;
  lista.forEach(function (o) { if (o.id > maximo) maximo = o.id; });
  return maximo + 1;
}

var $ = function (sel) { return document.querySelector(sel); };

function esc(texto) {
  return String(texto == null ? '' : texto)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

function num(valor, casas) {
  if (valor === null || valor === undefined || !Number.isFinite(valor)) return '—';
  var n = casas === undefined ? (Math.abs(valor % 1) < 0.001 ? 0 : 1) : casas;
  return valor.toLocaleString('pt-PT', { minimumFractionDigits: n, maximumFractionDigits: n });
}

/* "1 série" e nao "1 séries". Aparece em sitios de mais para se andar a
   escrever o if a mao de cada vez. */
function plural(n, singular, plural) {
  return num(n, 0) + ' ' + (n === 1 ? singular : plural);
}

function kg(valor) {
  if (valor === null || valor === undefined || !Number.isFinite(valor)) return '—';
  return num(valor) + ' kg';
}

/* Volumes chegam depressa aos milhoes de quilos; em toneladas leem-se melhor. */
function volumeCurto(valor) {
  if (!Number.isFinite(valor) || valor === 0) return '0 kg';
  if (valor >= 1000000) return num(valor / 1000000, 1) + ' kt';
  if (valor >= 1000) return num(valor / 1000, 1) + ' t';
  return num(valor, 0) + ' kg';
}

var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
  'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
var MESES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun',
  'jul', 'ago', 'set', 'out', 'nov', 'dez'];
var DIAS_SEMANA = ['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];

function dataCurta(iso) {
  var p = iso.split('-');
  return +p[2] + ' ' + MESES_CURTO[+p[1] - 1];
}

function dataLonga(iso) {
  var p = iso.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  var diaSemana = DIAS_SEMANA[(d.getUTCDay() + 6) % 7];
  // O ano so aparece quando nao e o corrente. Num historico de seis anos,
  // "13 de janeiro" sozinho nao diz nada.
  var ano = p[0] === hojeIso().slice(0, 4) ? '' : ' de ' + p[0];
  return diaSemana + ', ' + (+p[2]) + ' de ' + MESES[+p[1] - 1] + ano;
}

function dataRelativa(iso) {
  var d = diasEntre(iso, hojeIso());
  if (d === 0) return 'Hoje';
  if (d === 1) return 'Ontem';
  if (d === -1) return 'Amanhã';
  if (d > 1 && d < 7) return 'Há ' + d + ' dias';
  return dataLonga(iso);
}

function duracaoCurta(segundos) {
  if (!Number.isFinite(segundos)) return '—';
  var m = Math.floor(segundos / 60), s = segundos % 60;
  return m + ':' + String(s).padStart(2, '0');

/* --- Folha que sobe de baixo --- */
/* --------------------------------------------------------------------------
   O teclado do telemovel

   Um teclado a abrir NAO encolhe o ecra: a folha continua colada ao fundo, e
   o teclado sobe por cima dela. Quem estava a escrever no campo de procura
   via-o desaparecer por baixo.

   O visualViewport diz quanto do ecra e que esta mesmo visivel. A diferenca
   para a janela toda e a altura do teclado, e e isso que o CSS recebe.

   Ha telemoveis (e browsers antigos) sem visualViewport -- ai --teclado fica
   a 0 e a folha comporta-se como antes, que era o que ja acontecia.
   ----------------------------------------------------------------------- */
(function acompanharTeclado() {
  var vv = window.visualViewport;
  if (!vv) return;
  var pendente = false;
  function medir() {
    pendente = false;
    // Arredonda: o iOS devolve fracoes de pixel e isso fazia a folha tremer.
    var alturaTeclado = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    // Abaixo de 100px nao e teclado -- e a barra do browser a esconder-se.
    document.documentElement.style.setProperty(
      '--teclado', (alturaTeclado > 100 ? alturaTeclado : 0) + 'px');
  }
  function agendar() {
    if (pendente) return;
    pendente = true;
    requestAnimationFrame(medir);
  }
  vv.addEventListener('resize', agendar);
  vv.addEventListener('scroll', agendar);
  medir();
})();

/* --- Confirmacao sem usar confirm(), que bloqueia o WebView --- */
function confirmar(titulo, texto, textoBotao, aoConfirmar) {

/* ===========================================================================
   Graficos em SVG, feitos a mao

   Nao ha nenhuma biblioteca aqui de proposito. Uma app que tem de funcionar
   com o telemovel em modo de aviao nao pode depender de nada que venha da
   rede, e cachear 200 KB de biblioteca para desenhar linhas e barras nao se
   justifica. Sao umas 200 linhas e o estilo fica colado ao resto da app.

   Todos os graficos usam viewBox, por isso encolhem e esticam com o ecra sem
   precisarem de saber quantos pixeis tem.
   ======================================================================== */

var CORES_GRUPO = {
  'Peito': '#3b82f6',
  'Costas': '#22c55e',
  'Pernas': '#f59e0b',
  'Ombros': '#06b6d4',
  'Bíceps': '#ef4444',
  // Lima e nao teal: o teal ficava a 17 graus do ciano dos Ombros e as duas
  // barras eram indistinguiveis num grafico empilhado.
  'Tríceps': '#84cc16',
  'Abdominais': '#eab308',
  'Cardio': '#ec4899',
  'Outros': '#64748b'
};

function corDoGrupo(grupo) {
  if (CORES_GRUPO[grupo]) return CORES_GRUPO[grupo];
  // Grupos criados pelo utilizador ficam com uma cor estavel tirada do nome,
  // para nao mudarem de cor de cada vez que a app abre.
  var h = 0;
  for (var i = 0; i < grupo.length; i++) h = (h * 31 + grupo.charCodeAt(i)) % 360;
  return 'hsl(' + h + ' 55% 55%)';
}

/* Escolhe uma escala legivel para o eixo: 1, 2, 5, 10, 20, 50... */
function passoBonito(intervalo, alvoDeMarcas) {
  var cru = intervalo / (alvoDeMarcas || 4);
  if (cru <= 0) return 1;
  var magnitude = Math.pow(10, Math.floor(Math.log10(cru)));
  var norm = cru / magnitude;
  var passo = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return passo * magnitude;
}

function formatarEixo(valor, unidade) {
  // O zero fica so "0": num eixo em toneladas, "0 kg" destoa.
  if (valor === 0) return '0';
  if (unidade === 'volume') return volumeCurto(valor);
  if (Math.abs(valor) >= 1000) return num(valor / 1000, 1) + 'k';
  return num(valor, Math.abs(valor % 1) < 0.01 ? 0 : 1);
}

/* --------------------------------------------------------------------------
   Grafico de linhas: um ou mais tracos sobre o mesmo eixo de datas
   dados: [{nome, cor, pontos:[{x:'2026-08-24', y:100}]}]
   ----------------------------------------------------------------------- */
function grafLinhas(series, opcoes) {
  opcoes = opcoes || {};
  // O viewBox tem quase a largura real de um telemovel de proposito: assim o
  // SVG e desenhado a escala 1 e um texto de 10px sai mesmo com 10px. Com um
  // viewBox de 900 os rotulos dos eixos ficavam com 4px e nao se liam.
  var L = 380, A = opcoes.altura || 210;
  var mE = 40, mD = 8, mT = 12, mB = 24;
  var comDados = series.filter(function (s) { return s.pontos.length > 0; });
  if (!comDados.length) return '<p class="vazio pequeno">Ainda não há dados para desenhar.</p>';

  var todos = comDados.reduce(function (a, s) { return a.concat(s.pontos); }, []);
  var datas = todos.map(function (p) { return p.x; }).sort();
  var d0 = datas[0], d1 = datas[datas.length - 1];
  var span = Math.max(1, diasEntre(d0, d1));

  var ys = todos.map(function (p) { return p.y; });
  var yMax = Math.max.apply(null, ys), yMin = Math.min.apply(null, ys);
  if (opcoes.desdeZero !== false) yMin = Math.min(0, yMin);
  if (yMax === yMin) { yMax = yMin + 1; }
  var passo = passoBonito(yMax - yMin, 4);
  yMin = Math.floor(yMin / passo) * passo;
  yMax = Math.ceil(yMax / passo) * passo;

  var px = function (data) { return mE + diasEntre(d0, data) / span * (L - mE - mD); };
  var py = function (v) { return mT + (1 - (v - yMin) / (yMax - yMin)) * (A - mT - mB); };

  var svg = '<svg class="grafico" viewBox="0 0 ' + L + ' ' + A + '" ' +
            'role="img" aria-label="' + esc(opcoes.titulo || 'Gráfico') + '">';

  // Grelha e rotulos do eixo vertical
  for (var v = yMin; v <= yMax + 1e-9; v += passo) {
    var y = py(v);
    svg += '<line class="grelha" x1="' + mE + '" y1="' + y.toFixed(1) + '" x2="' + (L - mD) +
           '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text class="rotulo-y" x="' + (mE - 6) + '" y="' + (y + 3.5).toFixed(1) +
           '" text-anchor="end">' + esc(formatarEixo(v, opcoes.unidade)) + '</text>';
  }

  // Datas em baixo: so tres, senao ficam por cima umas das outras
  [0, 0.5, 1].forEach(function (f) {
    var x = mE + f * (L - mE - mD);
    var dias = Math.round(f * span);
    var d = new Date(Date.UTC(+d0.slice(0, 4), +d0.slice(5, 7) - 1, +d0.slice(8, 10)));
    d.setUTCDate(d.getUTCDate() + dias);
    var iso = d.toISOString().slice(0, 10);
    svg += '<text x="' + x.toFixed(1) + '" y="' + (A - 8) + '" text-anchor="' +
           (f === 0 ? 'start' : f === 1 ? 'end' : 'middle') + '">' +
           esc(dataCurta(iso) + ' ' + iso.slice(2, 4)) + '</text>';
  });

  comDados.forEach(function (s) {
    var pts = s.pontos.slice().sort(function (a, b) { return a.x < b.x ? -1 : 1; });
    var d = pts.map(function (p, i) {
      return (i ? 'L' : 'M') + px(p.x).toFixed(1) + ' ' + py(p.y).toFixed(1);
    }).join(' ');
    svg += '<path d="' + d + '" fill="none" stroke="' + s.cor +
           '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ' +
           'vector-effect="non-scaling-stroke"/>';
    // Com poucos pontos marca-se cada um; com muitos so o ultimo, senao vira
    // uma mancha de circulos.
    if (pts.length <= 40) {
      pts.forEach(function (p) {
        svg += '<circle cx="' + px(p.x).toFixed(1) + '" cy="' + py(p.y).toFixed(1) +
               '" r="2.6" fill="' + s.cor + '"/>';
      });
    } else {
      var u = pts[pts.length - 1];
      svg += '<circle cx="' + px(u.x).toFixed(1) + '" cy="' + py(u.y).toFixed(1) +
             '" r="3.4" fill="' + s.cor + '"/>';
    }
  });

  svg += '<line class="eixo" x1="' + mE + '" y1="' + (A - mB) + '" x2="' + (L - mD) +
         '" y2="' + (A - mB) + '"/></svg>';

  if (comDados.length > 1 || opcoes.legenda) {
    svg += '<div class="legenda">' + comDados.map(function (s) {
      return '<span><i style="background:' + s.cor + '"></i>' + esc(s.nome) + '</span>';
    }).join('') + '</div>';
  }
  return svg;
}

/* --------------------------------------------------------------------------
   Grafico de barras empilhadas: volume ou series por periodo, por grupo
   baldes: resultado de agregarPorPeriodo
   ----------------------------------------------------------------------- */
function grafBarras(baldes, opcoes) {
  opcoes = opcoes || {};
  var campo = opcoes.campo || 'volume';
  if (!baldes.length) return '<p class="vazio pequeno">Ainda não há dados para desenhar.</p>';

  var L = 380, A = opcoes.altura || 190;
  var mE = 40, mD = 8, mT = 12, mB = 22;

  var grupos = {};
  baldes.forEach(function (b) { Object.keys(b.grupos).forEach(function (g) { grupos[g] = true; }); });
  var nomes = Object.keys(grupos).sort(function (a, b) {
    var ia = GRUPOS_APP.indexOf(a), ib = GRUPOS_APP.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  var totais = baldes.map(function (b) { return b.total[campo]; });
  var yMax = Math.max.apply(null, totais);
  if (yMax <= 0) yMax = 1;
  var passo = passoBonito(yMax, 4);
  yMax = Math.ceil(yMax / passo) * passo;

  var larguraUtil = L - mE - mD;
  var largBarra = Math.max(1.5, Math.min(14, larguraUtil / baldes.length * 0.72));
  var espaco = larguraUtil / baldes.length;

  var svg = '<svg class="grafico" viewBox="0 0 ' + L + ' ' + A + '" ' +
            'role="img" aria-label="' + esc(opcoes.titulo || 'Gráfico') + '">';

  for (var v = 0; v <= yMax + 1e-9; v += passo) {
    var y = mT + (1 - v / yMax) * (A - mT - mB);
    svg += '<line class="grelha" x1="' + mE + '" y1="' + y.toFixed(1) + '" x2="' + (L - mD) +
           '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text class="rotulo-y" x="' + (mE - 6) + '" y="' + (y + 3.5).toFixed(1) +
           '" text-anchor="end">' +
           esc(formatarEixo(v, campo === 'volume' ? 'volume' : '')) + '</text>';
  }

  baldes.forEach(function (b, i) {
    var x = mE + i * espaco + (espaco - largBarra) / 2;
    var base = A - mB;
    nomes.forEach(function (g) {
      var d = b.grupos[g];
      if (!d || !d[campo]) return;
      var h = d[campo] / yMax * (A - mT - mB);
      base -= h;
      svg += '<rect x="' + x.toFixed(1) + '" y="' + base.toFixed(1) + '" width="' +
             largBarra.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + corDoGrupo(g) + '"/>';
    });
  });

  // Datas em baixo: primeira, meio e ultima
  [0, Math.floor(baldes.length / 2), baldes.length - 1].forEach(function (i, k) {
    if (i < 0 || i >= baldes.length) return;
    if (k === 1 && baldes.length < 4) return;
    var x = mE + i * espaco + espaco / 2;
    svg += '<text x="' + x.toFixed(1) + '" y="' + (A - 8) + '" text-anchor="middle">' +
           esc(dataCurta(baldes[i].inicio)) + '</text>';
  });

  svg += '<line class="eixo" x1="' + mE + '" y1="' + (A - mB) + '" x2="' + (L - mD) +
         '" y2="' + (A - mB) + '"/></svg>';

  svg += '<div class="legenda">' + nomes.map(function (g) {
    return '<span><i style="background:' + corDoGrupo(g) + '"></i>' + esc(g) + '</span>';
  }).join('') + '</div>';
  return svg;
}

/* --------------------------------------------------------------------------
   Barras horizontais: series por grupo muscular numa janela de tempo
   ----------------------------------------------------------------------- */
function grafBarrasH(linhas, opcoes) {
  opcoes = opcoes || {};
  if (!linhas.length) return '<p class="vazio pequeno">Ainda não há dados para desenhar.</p>';
  var maximo = Math.max.apply(null, linhas.map(function (l) { return l.valor; })) || 1;
  return '<div>' + linhas.map(function (l) {
    var pct = Math.max(1.5, l.valor / maximo * 100);
    return '<div style="margin-bottom:9px">' +
      '<div class="linha entre mini" style="margin-bottom:4px">' +
        '<span>' + esc(l.nome) + '</span>' +
        '<span class="nums suave">' + esc(l.texto || num(l.valor, 0)) + '</span>' +
      '</div>' +
      '<div style="height:8px;background:var(--sup3);border-radius:99px;overflow:hidden">' +
        '<div style="height:100%;width:' + pct.toFixed(1) + '%;background:' +
        (l.cor || corDoGrupo(l.nome)) + ';border-radius:99px"></div>' +
      '</div></div>';
  }).join('') + '</div>';
}

/* ===========================================================================
   Cronometro de descanso

   O iOS congela os temporizadores quando o ecra bloqueia. Por isso NAO se
   conta de segundo a segundo: guarda-se o instante em que a serie foi gravada
   e o tempo que falta e sempre recalculado a partir do relogio. Assim, se o
   telemovel ficar dois minutos no bolso, o cronometro volta com a conta certa
   em vez de estar parado onde ficou.
   ======================================================================== */

var Crono = {
  fim: null,          // instante em que acaba (ms desde 1970)
  total: 0,           // duracao pedida, para desenhar a barra
  intervalo: null,
  jaAvisou: false,

  arrancar: function (segundos) {
    if (!segundos || segundos <= 0) return;
    // E entre series que o ecra se apagava: e o momento em que mais faz
    // falta ter a certeza de que o bloqueio esta de pe.
    Ecra.pedir();
    this.total = segundos;
    this.fim = Date.now() + segundos * 1000;
    this.jaAvisou = false;
    $('#cronometro').classList.add('on');
    $('#cronometro').classList.remove('acabou');
    this.desenhar();
    clearInterval(this.intervalo);
    this.intervalo = setInterval(this.desenhar.bind(this), 250);
  },

  juntar: function (segundos) {
    if (this.fim === null) return;
    this.fim += segundos * 1000;
    this.total += segundos;
    $('#cronometro').classList.remove('acabou');
    this.jaAvisou = false;
    this.desenhar();
  },

  parar: function () {
    clearInterval(this.intervalo);
    this.intervalo = null;
    this.fim = null;
    $('#cronometro').classList.remove('on', 'acabou');
  },

  desenhar: function () {
    if (this.fim === null) return;
    var faltam = Math.round((this.fim - Date.now()) / 1000);
    var el = $('#cronometro');

    if (faltam <= 0) {
      // Continua a contar para cima, para se ver ha quanto tempo acabou.
      $('#cronoTexto').textContent = '+' + duracaoCurta(Math.abs(faltam));
      $('#cronoBarra').style.width = '100%';
      el.classList.add('acabou');
      if (!this.jaAvisou) {
        this.jaAvisou = true;
        vibrar([120, 80, 120]);
      }
      // Ao fim de 5 minutos parados nao vale a pena continuar a ocupar o ecra.
      if (faltam < -300) this.parar();
      return;
    }
    $('#cronoTexto').textContent = duracaoCurta(faltam);
    $('#cronoBarra').style.width = ((1 - faltam / this.total) * 100).toFixed(1) + '%';
  }
};

/* Quando a app volta do bolso, o cronometro reacerta-se sozinho. */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && Crono.fim !== null) Crono.desenhar();
});

   Vista: Treino

function descansoDoExercicio(ex) {

}

function renderTreino() {

/* --- O dia: lista dos exercicios feitos e o que falta --- */
function renderDia() {
  var data = Estado.dataAtual;
  var series = seriesDoDia(data);
  var ex = exercicioPorId;

  $('#btVoltar').hidden = true;
  $('#btAcao').hidden = true;
  mostrarNavDia(data);

  var html = Armazenamento.aviso();
  var nSug = sugestoesAbertas().length;
  if (nSug) {
    html += '<button class="btn larga fina" id="btSugestoes" style="margin-bottom:12px;color:var(--azul)">' +
      plural(nSug, 'sugestão', 'sugestões') + ' para o plano &#8250;</button>';
  }

  if (!series.length) {
    html += '<div class="vazio">' +
      '<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>' +
      '<div>Nada registado ' + (data === hojeIso() ? 'hoje' : 'neste dia') + '.</div></div>';
  } else {
    // Resumo do dia
    var volume = series.reduce(function (t, s) {
      return t + (Number.isFinite(s.peso) ? s.peso : 0) * (Number.isFinite(s.reps) ? s.reps : 0);
    }, 0);
    var comRir = series.filter(function (s) { return Number.isFinite(s.rir); });
    var rirMedio = comRir.length
      ? comRir.reduce(function (t, s) { return t + s.rir; }, 0) / comRir.length : null;

    html += '<div class="cartao"><div class="linha entre">' +
      '<div class="centro crescer"><div style="font-size:22px;font-weight:700" class="nums">' +
        series.length + '</div><div class="mini fraco">séries</div></div>' +
      '<div class="centro crescer"><div style="font-size:22px;font-weight:700" class="nums">' +
        volumeCurto(volume) + '</div><div class="mini fraco">volume</div></div>' +
      '<div class="centro crescer"><div style="font-size:22px;font-weight:700" class="nums">' +
        (rirMedio === null ? '—' : num(rirMedio, 1)) + '</div><div class="mini fraco">RIR médio</div></div>' +
      '</div></div>';

    // Um bloco por exercicio, pela ordem em que foram feitos
    var porEx = [];
    series.forEach(function (s) {
      var b = porEx.find(function (x) { return x.id === s.exercicioId; });
      if (!b) { b = { id: s.exercicioId, series: [] }; porEx.push(b); }
      b.series.push(s);
    });

    var prs = recordes();
    porEx.forEach(function (bloco, indice) {
      var e = ex(bloco.id);
      var nome = e ? e.nome : 'Exercício apagado';
      html += '<div class="lista">' +
        '<div class="cab-ex">' +
          // O nome abre e fecha as cargas maximas; a seta e que leva ao ecra
          // do exercicio.
          // Só o nome: o grupo e o número de séries já se veem nas linhas
          // logo por baixo, e a linha ficava carregada de repetido.
          '<button class="nome" data-abrir-ex="' + bloco.id + '">' +
            '<span style="font-weight:600">' + esc(nome) + '</span>' +
          '</button>' +
          '<button class="abrir" data-abrir-ex="' + bloco.id + '" ' +
            'aria-label="abrir o exercício">&#8250;</button>' +
          '<button class="mini-b mover" data-mover-ex="' + bloco.id + '" ' +
            'data-dir="-1"' + (indice === 0 ? ' disabled' : '') +
            ' aria-label="subir o exercício">&#9650;</button>' +
          '<button class="mini-b mover" data-mover-ex="' + bloco.id + '" ' +
            'data-dir="1"' + (indice === porEx.length - 1 ? ' disabled' : '') +
            ' aria-label="descer o exercício">&#9660;</button>' +
          '<button class="mini-b tirar" data-tirar-serie="' + bloco.id + '" ' +
            'aria-label="tirar uma série">&minus;</button>' +
          '<button class="mini-b" data-por-serie="' + bloco.id + '" ' +
            'aria-label="acrescentar uma série">+</button>' +
        '</div>';
      var tipoBloco = tipoDoExercicio(e);
      html += cabecalhoDasLinhas(tipoBloco);
      bloco.series.forEach(function (s, i) {
        html += linhaEditavel(s, i + 1, prs[s.id], tipoBloco);
      });
      html += '</div>';
    });
  }

  html += '<button class="btn primaria larga" id="btAddEx" style="margin-top:4px">' +
          '+ Adicionar exercício</button>';

  // Copiar um treino que ja se fez. O dia e escolhido a mao: repetir o treino
  // de ha duas semanas e tao normal como repetir o de ontem.
  if (diasComTreino().some(function (d) { return d !== data; })) {
    html += '<button class="btn larga" id="btCopiar" style="margin-top:8px">' +
      'Copiar treino de outro dia</button>';
  }

  if (series.length) {
    html += '<button class="btn perigo larga" id="btApagarDia" style="margin-top:8px">' +
      'Apagar o treino deste dia</button>';
  }

  $('#v-treino').innerHTML = html;

  if ($('#btSugestoes')) $('#btSugestoes').onclick = function () { trocarVista('plano'); };
  $('#btAddEx').onclick = function () { escolherExercicio(); };
  var copiar = $('#btCopiar');
  if (copiar) copiar.onclick = escolherTreinoParaCopiar;
  var apagarDia = $('#btApagarDia');
  if (apagarDia) apagarDia.onclick = function () { apagarTreinoDoDia(data); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-abrir-ex]'), function (b) {
    b.onclick = function () {
      Estado.exercicioAtivo = +b.dataset.abrirEx;
      // Abrir um exercicio e comecar a treinar: pede-se aqui o bloqueio do
      // ecra outra vez, caso o pedido da abertura da app tenha sido recusado.
      Ecra.pedir();
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-por-serie]'), function (b) {
    b.onclick = function () { acrescentarSerie(+b.dataset.porSerie); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-tirar-serie]'), function (b) {
    b.onclick = function () { tirarUltimaSerie(+b.dataset.tirarSerie); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-mover-ex]'), function (b) {
    b.onclick = function () { moverExercicio(+b.dataset.moverEx, +b.dataset.dir); };
  });
  ligarLinhasDeSerie();
  ligarLinhasEditaveis();
}

function linhaDeSerie(s, n, pr) {
  // O tipo vem do exercicio e nao dos valores da serie: no historico do
  // FitNotes as series de cardio trazem reps 0 e peso 0, e adivinhar pelos
  // valores fazia uma ida de bicicleta aparecer como "corpo x 0".
  var texto = descreverSerie(s, tipoDoExercicio(exercicioPorId(s.exercicioId)));
  return '<div class="serie' + (pr ? ' recorde' : '') + '" data-serie="' + s.id + '">' +
    '<span class="n">' + n + '</span>' +
    '<span class="v crescer">' + esc(texto) + '</span>' +
    (Number.isFinite(s.rir) ? '<span class="etiqueta rir">RIR ' + s.rir + '</span>' : '') +
    (pr ? '<span class="etiqueta pr">' + esc(nomeDoRecorde(pr)) + '</span>' : '') +
    '</div>';
}


/* --------------------------------------------------------------------------
   Linhas de serie editaveis

   Uma serie pode estar planeada mas ainda por fazer — e o que acontece quando
   se copia um treino de outro dia. O visto verde e o que diz "foi mesmo isto
   que fiz". Series antigas e series gravadas a serio entram ja com o visto.

   Sem o campo 'feita' (as series do historico) conta como feita: nao ha
   nenhuma razao para pôr em duvida seis anos de registos.
   ----------------------------------------------------------------------- */

var estaFeita = serieFeita;   // o nucleo e que manda na regra

/* Curva de carga maxima por exercicio, guardada enquanto os dados nao mudam.
   Sem isto, desenhar um dia com 20 series varria as 28.747 series 20 vezes. */
function curvaDe(exercicioId) {
  if (!Estado._curvas) Estado._curvas = {};
  if (!Estado._curvas[exercicioId]) {
    Estado._curvas[exercicioId] = curvaRepMax(Estado.series, exercicioId);
  }
  return Estado._curvas[exercicioId];
}

/* Curva inversa (reps maximas por peso), tambem guardada — mesma razao. */
function curvaPesoDe(exercicioId) {
  if (!Estado._curvasPeso) Estado._curvasPeso = {};
  if (!Estado._curvasPeso[exercicioId]) {
    Estado._curvasPeso[exercicioId] = curvaRepsPorPeso(Estado.series, exercicioId);
  }
  return Estado._curvasPeso[exercicioId];
}

/* As linhas de carga maxima de um exercicio, tambem guardadas. */
function marcasDe(exercicioId) {
  if (!Estado._marcas) Estado._marcas = {};
  if (!Estado._marcas[exercicioId]) {
    Estado._marcas[exercicioId] = recordesPorReps(Estado.series, exercicioId);
  }
  return Estado._marcas[exercicioId];
}

function cabecalhoDasLinhas(tipo) {
  if (tipo !== 'peso_reps') return '';
  // Cinco colunas, as mesmas da linha: n, kg, reps, feito, RIR
  return '<div class="linhas-cab">' +
    '<span></span><span>kg</span><span>reps</span><span>feito</span><span>RIR</span></div>';
}

/* Um campo com o menos e o mais dentro da mesma caixa. */
function caixaComPassos(campo, passo, atributos, valor) {
  var b = function (delta, sinal) {
    return '<button class="passo-b" data-ajuste="' + campo + ':' + delta + '" ' +
      'aria-label="' + (delta < 0 ? 'diminuir ' : 'aumentar ') + campo + '">' + sinal + '</button>';
  };
  return '<div class="caixa">' +
    b(-passo, '&minus;') +
    '<input type="number" data-campo="' + campo + '" ' + atributos +
      ' value="' + (valor === null || valor === undefined ? '' : valor) + '">' +
    b(passo, '+') +
    '</div>';
}

function linhaEditavel(s, n, pr, tipo) {
  if (tipo !== 'peso_reps') {
    // Cardio e isometricos nao tem peso nem repeticoes para editar aqui;
    // continuam a abrir a folha de edicao ao toque.
    return linhaDeSerie(s, n, pr);
  }

  var marca = melhorRepsParaPeso(curvaPesoDe(s.exercicioId), s.peso);
  var feita = estaFeita(s);

  return '<div class="serie-ed' + (feita ? '' : ' porfazer') + (pr ? ' recorde' : '') +
      '" data-linha="' + s.id + '">' +
    '<div class="n">' + n + '</div>' +

    caixaComPassos('peso', 2.5, 'inputmode="decimal" step="any" aria-label="peso"',
      Number.isFinite(s.peso) ? s.peso : null) +

    caixaComPassos('reps', 1, 'inputmode="numeric" aria-label="repetições"',
      Number.isFinite(s.reps) ? s.reps : null) +

    '<button class="feito' + (feita ? ' on' : '') + '" data-campo="feita" ' +
      'aria-label="marcar como feita">✓</button>' +

    caixaComPassos('rir', 1,
      'inputmode="numeric" class="rir" min="0" max="10" placeholder="—" aria-label="RIR"',
      Number.isFinite(s.rir) ? s.rir : null) +

    '<div class="marca' + (marca === null ? ' nada' : '') + '" data-campo="marca">' +
      textoDaMarca(s.peso, marca) + '</div>' +
    '</div>';
}

/* O texto da marca a bater, por baixo da linha. */
/* O texto da marca a bater, por baixo da linha. Ao contrario: para o peso
   que esta na caixa, quantas repeticoes ja se fizeram com esse peso ou mais. */
function textoDaMarca(peso, marca) {
  if (!Number.isFinite(peso) || peso <= 0) return 'máx —';
  if (marca === null) return 'máx a ' + kg(peso) + ': ainda nenhuma';
  return 'máx a ' + kg(peso) + ': ' + plural(marca, 'rep', 'reps');
}

/* Liga os campos das linhas editaveis. Grava a cada alteracao: nao ha botao
   de guardar de proposito, para nao haver forma de perder uma serie por se
   ter saido do ecra sem carregar em nada. */
function ligarLinhasEditaveis() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-linha]'), function (linha) {
    var id = +linha.dataset.linha;
    var s = Estado.series.find(function (x) { return x.id === id; });
    if (!s) return;

    function guardar(redesenhar) {
      reindexar();
      BD.guardar('series', s).then(function () { if (redesenhar) render(); });
    }

    function actualizarMarca() {
      var alvo = linha.querySelector('[data-campo="marca"]');
      var marca = melhorRepsParaPeso(curvaPesoDe(s.exercicioId), s.peso);
      alvo.textContent = textoDaMarca(s.peso, marca);
      alvo.classList.toggle('nada', marca === null);
    }

    /* Os menos e os mais. Cada campo tem o seu passo e os seus limites. */
    Array.prototype.forEach.call(linha.querySelectorAll('[data-ajuste]'), function (b) {
      b.onclick = function () {
        var p = b.dataset.ajuste.split(':');
        var campo = p[0], delta = parseFloat(p[1]);
        var el = linha.querySelector('[data-campo="' + campo + '"]');

        if (campo === 'peso') {
          var novo = (Number.isFinite(s.peso) ? s.peso : 0) + delta;
          s.peso = Math.max(0, Math.round(novo * 100) / 100);
          el.value = s.peso;
          actualizarMarca();

        } else if (campo === 'reps') {
          // Para em 1 e nao desce a vazio: carregar uma vez a mais no menos
          // nao pode apagar as repeticoes da serie sem querer. Para as tirar
          // mesmo, escreve-se por cima.
          if (!Number.isFinite(s.reps)) {
            s.reps = delta > 0 ? 1 : null;
          } else {
            s.reps = Math.max(1, s.reps + delta);
          }
          el.value = s.reps === null ? '' : s.reps;

        } else {
          // RIR: de vazio, o mais poe 0. O menos a partir do 0 volta a vazio,
          // que e como se diz "nao registei".
          if (!Number.isFinite(s.rir)) {
            s.rir = delta > 0 ? 0 : null;
          } else {
            var v = s.rir + delta;
            s.rir = v < 0 ? null : Math.min(10, v);
          }
          el.value = s.rir === null ? '' : s.rir;
        }

        vibrar(8);
        guardar(false);
      };
    });

    // Ao tocar num campo, selecciona tudo para escrever por cima sem apagar.
    // O setTimeout e por causa do iOS: ele poe o cursor depois do focus e
    // desfazia a seleccao se ela fosse feita ali mesmo.
    function seleccionarAoTocar(el) {
      el.onfocus = function () {
        var alvo = this;
        setTimeout(function () { alvo.select(); }, 0);
      };
    }

    var campoPeso = linha.querySelector('[data-campo="peso"]');
    var campoReps = linha.querySelector('[data-campo="reps"]');
    var campoRir = linha.querySelector('[data-campo="rir"]');
    [campoPeso, campoReps, campoRir].forEach(seleccionarAoTocar);

    campoPeso.onchange = function () {
      var v = parseFloat(this.value);
      s.peso = Number.isFinite(v) ? v : 0;
      this.value = s.peso;
      guardar(false);
      actualizarMarca();
    };

    campoReps.onchange = function () {
      var v = parseInt(this.value, 10);
      s.reps = Number.isFinite(v) && v > 0 ? v : null;
      this.value = s.reps === null ? '' : s.reps;
      guardar(false);
    };

    campoRir.onchange = function () {
      var t = this.value.trim();
      var v = parseFloat(t);
      s.rir = t === '' || !Number.isFinite(v) ? null : Math.max(0, Math.min(10, v));
      this.value = s.rir === null ? '' : s.rir;
      guardar(false);
    };

    linha.querySelector('[data-campo="feita"]').onclick = function () {
      s.feita = !estaFeita(s);
      this.classList.toggle('on', s.feita);
      linha.classList.toggle('porfazer', !s.feita);
      vibrar(s.feita ? 15 : 8);

      // Dar o visto e o momento em que o descanso comeca. So no dia de hoje:
      // rever o historico e ir dando vistos a series antigas nao pode pôr um
      // cronometro a andar. Tirar o visto tambem nao mexe no cronometro — e
      // uma correcao, nao o fim de uma serie.
      if (s.feita && s.data === hojeIso()) {
        Crono.arrancar(descansoDoExercicio(exercicioPorId(s.exercicioId)));
      }
      // Ao dar por feita uma serie ela passa a contar para os recordes e para
      // o volume, por isso o ecra tem de ser refeito. Mas a posicao da lista
      // e guardada: confirmar quinze series a uma e a saltar para o topo de
      // cada vez seria insuportavel.
      var posicao = $('#conteudo').scrollTop;
      reindexar();
      BD.guardar('series', s).then(function () {
        render();
        $('#conteudo').scrollTop = posicao;
      });
      if (s.feita) {
        var pr = recordes()[s.id];
        if (pr) { avisar('Recorde! ' + nomeDoRecorde(pr)); vibrar([60, 40, 60, 40, 120]); }
      }
    };
  });
}

function nomeDoRecorde(pr) {
  if (pr.tipos.indexOf('peso') !== -1) return 'PR peso';
  if (pr.tipos.indexOf('1rm') !== -1) return 'PR 1RM';
  return 'PR';
}

function ligarLinhasDeSerie() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-serie]'), function (el) {
    el.onclick = function () { editarSerie(+el.dataset.serie); };
  });
}

/* --------------------------------------------------------------------------
   Acrescentar e tirar series a um exercicio, sem sair da lista do dia
   ----------------------------------------------------------------------- */

/* Acrescenta uma serie igual a ultima daquele exercicio, por fazer.
   Por fazer de proposito: e uma serie que se vai fazer a seguir, e so conta
   para as marcas depois do visto. */
function acrescentarSerie(exercicioId) {
  var doDia = seriesDoDia(Estado.dataAtual);
  var deste = doDia.filter(function (s) { return s.exercicioId === exercicioId; });
  var modelo = deste[deste.length - 1] || sugestaoAnterior(exercicioId);

  var nova = {
    id: proximoId(Estado.series),
    sessaoId: garantirSessao(Estado.dataAtual).id,
    exercicioId: exercicioId,
    data: Estado.dataAtual,
    ordemExercicio: deste.length ? deste[0].ordemExercicio
      : ordemDoNovoExercicio(doDia),
    ordem: ordemDaNovaSerie(doDia),
    peso: modelo && Number.isFinite(modelo.peso) ? modelo.peso : 0,
    reps: modelo && Number.isFinite(modelo.reps) ? modelo.reps : null,
    rir: null,
    tempoSeg: modelo ? modelo.tempoSeg : null,
    distancia: null,
    supersetId: null,
    nota: null,
    feita: false
  };

  Estado.series.push(nova);
  reindexar();
  var posicao = $('#conteudo').scrollTop;
  BD.guardar('series', nova).then(function () {
    vibrar(12);
    render();
    $('#conteudo').scrollTop = posicao;
  });
}

/* Tira a ultima serie daquele exercicio no dia. So pergunta se a serie ja
   estava dada como feita: tirar uma serie planeada e um gesto sem custo,
   tirar uma feita e perder um registo. */
/* Sobe ou desce um exercicio no treino do dia. A posicao da lista e guardada:
   mover o quarto exercicio e ver o ecra saltar para o topo era irritante. */
function moverExercicio(exercicioId, direcao) {
  var alteradas = reordenarExercicios(seriesDoDia(Estado.dataAtual),
                                      exercicioId, direcao);
  if (!alteradas.length) return;
  vibrar(10);
  var posicao = $('#conteudo').scrollTop;
  BD.guardarMuitos('series', alteradas).then(function () {
    // a ordem entra na deteccao de recordes -- os indices tem de ser refeitos
    reindexar();
    render();
    $('#conteudo').scrollTop = posicao;
  });
}

function tirarUltimaSerie(exercicioId) {
  var deste = seriesDoDia(Estado.dataAtual)
    .filter(function (s) { return s.exercicioId === exercicioId; });
  if (!deste.length) return;

  var ultima = deste[deste.length - 1];
  var e = exercicioPorId(exercicioId);

  function tirar() {
    Estado.series = Estado.series.filter(function (s) { return s.id !== ultima.id; });
    reindexar();
    var posicao = $('#conteudo').scrollTop;
    BD.apagar('series', ultima.id).then(function () {
      avisar('Série tirada');
      vibrar(12);
      render();
      $('#conteudo').scrollTop = posicao;
    });
  }

  if (!estaFeita(ultima)) { tirar(); return; }

  confirmar('Tirar uma série',
    'A última série de ' + (e ? e.nome : 'este exercício') + ' está dada como feita: ' +
    descreverSerie(ultima, tipoDoExercicio(e)) + '. Tirá-la apaga o registo.',
    'Tirar', tirar);
}

/* Apaga o treino todo de um dia: as series e a propria sessao. */
function apagarTreinoDoDia(data) {
  var series = seriesDoDia(data);
  if (!series.length) { avisar('Não há nada para apagar neste dia'); return; }

  var exercicios = new Set(series.map(function (s) { return s.exercicioId; })).size;

  confirmar('Apagar o treino de ' + dataLonga(data),
    'Vai apagar ' + plural(series.length, 'série', 'séries') + ' de ' +
    plural(exercicios, 'exercício', 'exercícios') + '. Isto não se desfaz — ' +
    'se tiveres dúvidas, guarda antes um backup em Exercícios › Dados.',
    'Apagar o dia', function () {
      var ids = series.map(function (s) { return s.id; });
      var sessoes = Estado.sessoes.filter(function (x) { return x.data === data; });

      Estado.series = Estado.series.filter(function (s) { return s.data !== data; });
      Estado.sessoes = Estado.sessoes.filter(function (x) { return x.data !== data; });
      reindexar();

      Promise.all([
        BD.apagarMuitos('series', ids),
        BD.apagarMuitos('sessoes', sessoes.map(function (x) { return x.id; }))
      ]).then(function () {
        avisar(plural(ids.length, 'série apagada', 'séries apagadas'));
        Estado.exercicioAtivo = null;
        render();
      });
    });
}

/* Todos os dias em que houve treino, do mais recente para tras. */
function diasComTreino() {
  return [...new Set(Estado.series.map(function (s) { return s.data; }))]
    .sort().reverse();
}

/* O treino de um dia por inteiro, em HTML: os números em cima e os exercícios
   com os pesos por baixo. Serve a pre-visualizacao do historico e o painel do
   escolhedor de copiar — e o mesmo desenho nos dois sitios. */
function htmlDoTreino(data) {
  var series = seriesDoDia(data);
  if (!series.length) return '<p class="vazio pequeno">Este dia não tem séries.</p>';

  var volume = series.reduce(function (t, s) {
    return t + (Number.isFinite(s.peso) ? s.peso : 0) * (Number.isFinite(s.reps) ? s.reps : 0);
  }, 0);
  var comRir = series.filter(function (s) { return Number.isFinite(s.rir); });
  var rirMedio = comRir.length
    ? comRir.reduce(function (t, s) { return t + s.rir; }, 0) / comRir.length : null;

  var porEx = [];
  series.forEach(function (s) {
    var b = porEx.find(function (x) { return x.id === s.exercicioId; });
    if (!b) { b = { id: s.exercicioId, series: [] }; porEx.push(b); }
    b.series.push(s);
  });

  var celula = function (valor, rotulo) {
    return '<div class="centro crescer"><div style="font-size:19px;font-weight:700" class="nums">' +
      valor + '</div><div class="mini fraco">' + rotulo + '</div></div>';
  };

  var prs = recordes();

  return '<div class="cartao" style="margin-top:0"><div class="linha entre">' +
      celula(series.length, 'séries') +
      celula(porEx.length, 'exercícios') +
      celula(volumeCurto(volume), 'volume') +
      (rirMedio === null ? '' : celula(num(rirMedio, 1), 'RIR médio')) +
    '</div></div>' +
    '<div class="lista">' + porEx.map(function (bloco) {
      var e = exercicioPorId(bloco.id);
      var tipo = tipoDoExercicio(e);
      var recordesAqui = bloco.series.filter(function (s) { return prs[s.id]; }).length;
      var pesos = bloco.series.map(function (s) {
        return descreverSerie(s, tipo).replace(/ kg/g, '').replace(' × ', '×');
      }).join('   ');
      return '<div class="item" style="display:block">' +
        '<div class="linha entre"><span style="font-weight:600">' +
          esc(e ? e.nome : 'Exercício apagado') + '</span>' +
          (recordesAqui ? '<span class="etiqueta pr">' +
            plural(recordesAqui, 'PR', 'PR') + '</span>' : '') + '</div>' +
        '<div class="mini fraco nums" style="margin-top:2px">' + esc(pesos) + '</div></div>';
    }).join('') + '</div>';
}

/* Pre-visualizacao de um treino, a partir do historico. */
function verTreinoDoDia(data) {
  abrirFolha(dataLonga(data),
    htmlDoTreino(data) +
    '<button class="btn primaria larga" id="vAbrir">Abrir este treino</button>' +
    '<button class="btn larga" id="vCopiar" style="margin-top:8px">Copiar para hoje</button>',
    function (corpo) {
      corpo.querySelector('#vAbrir').onclick = function () {
        fecharFolha();
        Estado.dataAtual = data;
        Estado.exercicioAtivo = null;
        trocarVista('treino');
      };
      corpo.querySelector('#vCopiar').onclick = function () {
        fecharFolha();
        Estado.dataAtual = hojeIso();
        Estado.exercicioAtivo = null;
        copiarTreino(data);
      };
    });
}

/* Resumo de um dia, para se reconhecer o treino sem ter de o abrir. */
function resumoDoDia(data) {
  var series = seriesDoDia(data);
  var grupos = [];
  series.forEach(function (s) {
    var e = exercicioPorId(s.exercicioId);
    var g = e ? e.grupo : 'Outros';
    if (grupos.indexOf(g) === -1) grupos.push(g);
  });
  return { series: series.length, grupos: grupos };
}

/* Escolher de que dia copiar, num calendario.

   O dia e sempre escolhido a mao: repetir o treino de ha duas semanas e tao
   normal como repetir o de ontem. As setas do mes saltam directamente para o
   mes seguinte ou anterior QUE TENHA TREINO — com seis anos de historico,
   andar mes a mes por meses vazios seria um castigo. */
function escolherTreinoParaCopiar() {
  var dias = diasComTreino().filter(function (d) { return d !== Estado.dataAtual; });
  if (!dias.length) { avisar('Ainda não há nenhum treino para copiar'); return; }

  var comTreino = {};
  dias.forEach(function (d) { comTreino[d] = true; });

  var mes = dias[0].slice(0, 7);      // comeca no mes do treino mais recente
  var escolhido = null;

  abrirFolha('Copiar treino de',
    '<div id="copCal"></div><div id="copInfo"></div>',
    function (corpo) {
      var cal = corpo.querySelector('#copCal');
      var info = corpo.querySelector('#copInfo');

      function mesComTreino(paraTras) {
        // dias vem do mais recente para tras
        var candidatos = dias.filter(function (d) {
          return paraTras ? d.slice(0, 7) < mes : d.slice(0, 7) > mes;
        });
        if (!candidatos.length) return null;
        return (paraTras ? candidatos[0] : candidatos[candidatos.length - 1]).slice(0, 7);
      }

      function desenharCalendario() {
        var ano = +mes.slice(0, 4), m = +mes.slice(5, 7);
        var recuo = (new Date(Date.UTC(ano, m - 1, 1)).getUTCDay() + 6) % 7;
        var diasNoMes = new Date(Date.UTC(ano, m, 0)).getUTCDate();
        var atras = mesComTreino(true), frente = mesComTreino(false);

        var html = '<div class="cartao" style="margin-top:0">' +
          '<div class="linha entre" style="margin-bottom:12px">' +
            '<button class="btn fina" id="copAtras"' + (atras ? '' : ' disabled') + '>&#8249;</button>' +
            '<h3 style="margin:0;text-transform:none;font-size:17px;color:var(--texto)">' +
              esc(MESES[m - 1] + ' ' + ano) + '</h3>' +
            '<button class="btn fina" id="copFrente"' + (frente ? '' : ' disabled') + '>&#8250;</button>' +
          '</div><div class="calendario">' +
          ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(function (d) {
            return '<div class="dn">' + d + '</div>';
          }).join('');

        for (var i = 0; i < recuo; i++) html += '<button class="fora"></button>';
        for (var dia = 1; dia <= diasNoMes; dia++) {
          var iso = ano + '-' + String(m).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
          var classes = [];
          if (comTreino[iso]) classes.push('treino');
          if (iso === hojeIso()) classes.push('hoje');
          if (iso === escolhido) classes.push('sel');
          html += '<button class="' + classes.join(' ') + '"' +
            (comTreino[iso] ? ' data-dia="' + iso + '"' : ' disabled') + '>' + dia + '</button>';
        }
        html += '</div><p class="mini fraco centro" style="margin:12px 0 0">' +
          'Os dias a azul têm treino. As setas saltam para o mês com treino mais próximo.' +
          '</p></div>';

        cal.innerHTML = html;

        var btAtras = cal.querySelector('#copAtras');
        var btFrente = cal.querySelector('#copFrente');
        if (atras) btAtras.onclick = function () { mes = atras; desenharCalendario(); };
        if (frente) btFrente.onclick = function () { mes = frente; desenharCalendario(); };

        Array.prototype.forEach.call(cal.querySelectorAll('[data-dia]'), function (b) {
          b.onclick = function () {
            escolhido = b.dataset.dia;
            desenharCalendario();
            desenharInfo();
            info.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          };
        });
      }

      /* O mesmo desenho da pre-visualizacao do historico, para nao haver
         duas maneiras de mostrar o mesmo treino. */
      function desenharInfo() {
        if (!escolhido) {
          info.innerHTML = '<p class="vazio pequeno">Escolhe um dia a azul.</p>';
          return;
        }
        info.innerHTML =
          '<div class="cartao"><h3 style="margin-bottom:0;text-transform:none;font-size:16px;' +
            'color:var(--texto)">' + esc(dataLonga(escolhido)) + '</h3></div>' +
          htmlDoTreino(escolhido) +
          '<button class="btn primaria larga" id="copConfirmar">Copiar este treino</button>';

        info.querySelector('#copConfirmar').onclick = function () {
          fecharFolha();
          copiarTreino(escolhido);
        };
      }

      desenharCalendario();
      desenharInfo();
    });
}

function copiarTreino(deData) {
  if (!deData) return;
  var origem = seriesDoDia(deData);
  if (!origem.length) { avisar('Esse dia não tem séries'); return; }

  var jaLa = seriesDoDia(Estado.dataAtual);
  var aviso = jaLa.length
    ? ' O dia de destino já tem ' + plural(jaLa.length, 'série', 'séries') + '; estas vão a seguir.'
    : '';

  confirmar('Copiar treino',
    'Vai copiar ' + plural(origem.length, 'série', 'séries') + ' de ' + dataLonga(deData) +
    ' para ' + dataLonga(Estado.dataAtual) + '. Os pesos e as reps vêm iguais; podes acertar ' +
    'depois. O RIR não vem — esse é de cada dia.' + aviso,
    'Copiar', function () {
      var sessao = garantirSessao(Estado.dataAtual);
      // As series copiadas entram DEPOIS das que ja la estao, senao os numeros
      // de ordem chocavam e a lista do dia saia baralhada.
      var desvioEx = ordemDoNovoExercicio(jaLa);
      var desvioOrdem = ordemDaNovaSerie(jaLa);
      var proximo = proximoId(Estado.series);

      var novas = origem.map(function (s, i) {
        return {
          id: proximo + i,
          sessaoId: sessao.id, exercicioId: s.exercicioId, data: Estado.dataAtual,
          ordemExercicio: s.ordemExercicio + desvioEx,
          ordem: s.ordem + desvioOrdem,
          peso: s.peso, reps: s.reps, rir: null,
          tempoSeg: s.tempoSeg, distancia: s.distancia, supersetId: null, nota: null,
          // Um treino copiado e um plano, nao um registo. As series entram
          // por fazer e so contam para as marcas depois do visto verde.
          feita: false
        };
      });
      Estado.series = Estado.series.concat(novas);
      reindexar();
      BD.guardarMuitos('series', novas).then(function () {
        avisar(plural(novas.length, 'série copiada', 'séries copiadas'));
        render();
      });
    });
}

var CAMPOS_POR_TIPO = {
  peso_reps: ['peso', 'reps'],
  peso_tempo: ['peso', 'tempoSeg'],
  distancia_tempo: ['tempoMin', 'distancia']
};

function tipoDoExercicio(e) {
  return CAMPOS_POR_TIPO[e && e.tipo] ? e.tipo : 'peso_reps';
}

/* Descreve uma serie em texto curto, conforme o tipo. Serve para o botao de
   repetir e para as listas. */
function descreverSerie(s, tipo) {
  if (tipo === 'distancia_tempo') {
    var partes = [];
    if (Number.isFinite(s.tempoSeg)) partes.push(duracaoCurta(s.tempoSeg));
    if (Number.isFinite(s.distancia) && s.distancia > 0) partes.push(num(s.distancia, 0) + ' m');
    return partes.join(' · ') || '—';
  }
  if (tipo === 'peso_tempo') {
    return (Number.isFinite(s.tempoSeg) ? duracaoCurta(s.tempoSeg) : '—') +
           (s.peso > 0 ? ' com ' + num(s.peso) + ' kg' : '');
  }
  if (Number.isFinite(s.reps) && Number.isFinite(s.peso)) {
    return (s.peso > 0 ? num(s.peso) + ' kg' : 'corpo') + ' × ' + s.reps;
  }
  return '—';
}

/* --------------------------------------------------------------------------
   Ecra de um exercicio

   Aberto ao carregar no nome (ou na seta) dentro do treino. Nao se registam
   series aqui: isso faz-se nas linhas do proprio treino, com o + do topo do
   exercicio e o visto de cada serie. Este ecra e so para ver:

     1. o que se fez da ultima vez
     2. a carga maxima por numero de repeticoes
     3. a estimativa do que se deveria conseguir em cada numero de repeticoes
   ----------------------------------------------------------------------- */

function renderRegisto() {
  var e = exercicioPorId(Estado.exercicioAtivo);
  if (!e) { Estado.exercicioAtivo = null; return render(); }

  var tipo = tipoDoExercicio(e);
  var data = Estado.dataAtual;
  var todas = seriesDoExercicio(e.id);
  var prs = recordes();

  $('#titulo').textContent = e.nome;
  $('#titulo').hidden = false;
  $('#btVoltar').hidden = false;
  var acao = $('#btAcao');
  acao.hidden = false;
  acao.textContent = 'Ficha';
  acao.onclick = function () { fichaExercicio(e.id); };

  var html = '';

  /* --- 1. O ultimo treino deste exercicio --- */
  var anteriores = todas.filter(function (s) { return s.data < data; });
  if (anteriores.length) {
    var ultimaData = anteriores.map(function (s) { return s.data; }).sort().pop();
    var doDia = anteriores.filter(function (s) { return s.data === ultimaData; })
      .sort(function (a, b) { return a.ordem - b.ordem; });
    html += '<div class="lista"><div class="cab">Último treino · ' +
      esc(dataRelativa(ultimaData)) + '</div>';
    doDia.forEach(function (s, i) { html += linhaDeSerie(s, i + 1, prs[s.id]); });
    html += '</div>';
  } else {
    html += '<p class="vazio pequeno">Ainda não fizeste este exercício.</p>';
  }

  if (tipo === 'peso_reps') {
    /* --- 2. A carga maxima por repeticoes --- */
    html += htmlTabelaRepMax(e.id);

    /* --- 3. A estimativa por repeticoes --- */
    html += htmlEstimativas(e.id);
  }

  $('#v-treino').innerHTML = html;
  ligarLinhasDeSerie();
}

/* A estimativa do que se deveria conseguir em cada numero de repeticoes,
   a partir do melhor 1RM estimado, e a folga que sobra face ao que ja foi
   feito. */
function htmlEstimativas(exercicioId) {
  var m = melhores()[exercicioId];
  if (!m || !Number.isFinite(m.melhor1RM)) return '';

  var linhas = estimativasPorReps(m.melhor1RM, curvaDe(exercicioId), 12);
  if (!linhas.length) return '';

  var s = m.serieDo1RM;

  return '<div class="cartao"><h3>Estimativa por repetições</h3>' +
    '<p class="mini fraco" style="margin:-4px 0 10px">A partir de um 1RM de ' +
      kg(m.melhor1RM) + (s ? ', vindo de ' + kg(s.peso) + ' × ' + s.reps +
      ' em ' + esc(dataLonga(s.data)) : '') + '.</p>' +

    '<div class="linhas-est cab-est">' +
      '<span>reps</span><span>estimado</span><span>feito</span><span>folga</span></div>' +

    linhas.map(function (l) {
      var folga = l.folga;
      var corFolga = folga === null ? 'var(--fraco)'
        : folga > 0.5 ? 'var(--verde)' : folga < -0.5 ? 'var(--ambar)' : 'var(--fraco)';
      return '<div class="linhas-est' + (l.fiavel ? '' : ' fraca') + '">' +
        '<span class="nums suave">' + l.reps + '×</span>' +
        '<span class="nums" style="font-weight:600">' + num(l.estimativa) + '</span>' +
        '<span class="nums">' + (l.feito === null ? '—' : num(l.feito)) + '</span>' +
        '<span class="nums" style="color:' + corFolga + ';font-weight:600">' +
          (folga === null ? '—' : (folga > 0 ? '+' : '') + num(folga)) + '</span>' +
        '</div>';
    }).join('') +

    '<p class="mini fraco" style="margin:12px 0 0">A verde, o que a estimativa diz que ainda ' +
    'tens por explorar nessas repetições. É uma estimativa e não uma promessa: sai das mesmas ' +
    'fórmulas do 1RM, que já são aproximações. Das ' + LIMITE_FIAVEL + ' repetições para cima ' +
    'vale pouco, e por isso essas linhas ficam esbatidas.</p></div>';
}

/* Sugere os valores da ultima vez que se fez este exercicio. */
function sugestaoAnterior(exercicioId) {
  var anteriores = seriesDoExercicio(exercicioId)
    .filter(function (s) { return s.data < Estado.dataAtual; })
    .sort(_ordemCronologica);
  return anteriores[anteriores.length - 1] || null;
}

/* A tabela das cargas maximas, uma linha por numero de repeticoes.
   As linhas dominadas ficam esbatidas: sao numeros de repeticoes onde nunca
   se foi a serio, e mostra-las a cheio dava a entender uma marca que nao e. */
function htmlTabelaRepMax(exercicioId) {
  var linhas = recordesPorReps(Estado.series, exercicioId);
  if (!linhas.length) return '';

  var maiorPeso = Math.max.apply(null, linhas.map(function (l) { return l.peso; }));
  var temHerdadas = linhas.some(function (l) { return l.herdado; });

  return '<div class="cartao"><h3>Carga máxima por repetições</h3>' +
    '<div class="lista" style="margin:0">' +
    linhas.map(function (l) {
      var largura = Math.max(4, l.peso / maiorPeso * 100);
      return '<button class="item" data-serie="' + l.serieId + '">' +
        '<span class="nums suave" style="width:44px;flex:none;font-weight:600">' +
          l.reps + '×</span>' +
        '<div class="crescer">' +
          '<div style="height:6px;background:var(--sup3);border-radius:99px;overflow:hidden">' +
            '<div style="height:100%;width:' + largura.toFixed(1) + '%;background:var(--ambar);' +
            'border-radius:99px"></div></div>' +
          '<div class="mini fraco" style="margin-top:3px">' +
            (l.herdado ? 'de uma série de ' + l.repsOrigem + ' · ' : '') +
            esc(l.data ? dataLonga(l.data) : '') +
            (l.rm1 ? ' · 1RM ~' + kg(l.rm1) : '') + '</div>' +
        '</div>' +
        '<span class="nums" style="font-weight:700;flex:none">' + kg(l.peso) + '</span>' +
        '</button>';
    }).join('') + '</div>' +
    (temHerdadas
      ? '<p class="mini fraco" style="margin:10px 0 0">Quem faz 10 repetições com um peso ' +
        'fez 8 com esse peso pelo caminho. Por isso há linhas cuja marca vem de uma série ' +
        'mais longa.</p>'
      : '') +
    '</div>';
}

function garantirSessao(data) {
  var s = Estado.sessoes.find(function (x) { return x.data === data; });
  if (s) return s;
  s = { id: proximoId(Estado.sessoes), data: data, inicio: null, fim: null, notas: null };
  Estado.sessoes.push(s);
  BD.guardar('sessoes', s);
  return s;
}

/* --------------------------------------------------------------------------
   Editar ou apagar uma serie ja gravada
   ----------------------------------------------------------------------- */
function editarSerie(id) {
  var s = Estado.series.find(function (x) { return x.id === id; });
  if (!s) return;
  var e = exercicioPorId(s.exercicioId);

  // Os campos sao os do tipo do exercicio: editar uma ida de bicicleta nao
  // pode pedir repeticoes.
  var tipoEd = tipoDoExercicio(e);
  var campoNum = function (id, rotulo, valor, modo) {
    return '<label class="campo"><span>' + esc(rotulo) + '</span>' +
      '<input id="' + id + '" type="number" inputmode="' + modo + '" step="any" value="' +
      (Number.isFinite(valor) ? valor : '') + '"></label>';
  };

  abrirFolha(e ? e.nome : 'Série',
    (tipoEd === 'distancia_tempo'
      ? campoNum('eTempo', 'Tempo (segundos)', s.tempoSeg, 'numeric') +
        campoNum('eDist', 'Distância (m)', s.distancia, 'decimal')
      : tipoEd === 'peso_tempo'
        ? campoNum('ePeso', 'Peso (kg)', s.peso, 'decimal') +
          campoNum('eTempo', 'Tempo (segundos)', s.tempoSeg, 'numeric')
        : campoNum('ePeso', 'Peso (kg)', s.peso, 'decimal') +
          campoNum('eReps', 'Repetições', s.reps, 'numeric')) +
    (tipoEd !== 'distancia_tempo'
      ? '<label class="campo"><span>RIR (repetições que ainda dava para fazer)</span>' +
        '<input id="eRir" type="number" inputmode="numeric" min="0" max="10" value="' +
        (Number.isFinite(s.rir) ? s.rir : '') +
        '" placeholder="deixa vazio se não registaste"></label>'
      : '') +
    '<label class="campo"><span>Nota</span>' +
      '<textarea id="eNota" rows="2">' + esc(s.nota || '') + '</textarea></label>' +
    '<button class="btn primaria larga" id="eGuardar">Guardar</button>' +
    '<button class="btn perigo larga" id="eApagar" style="margin-top:8px">Apagar série</button>',
    function (corpo) {
      corpo.querySelector('#eGuardar').onclick = function () {
        // Cada campo so e lido se existir: os campos mudam com o tipo.
        var ler = function (id, inteiro) {
          var el = corpo.querySelector('#' + id);
          if (!el) return undefined;
          var v = inteiro ? parseInt(el.value, 10) : parseFloat(el.value);
          return Number.isFinite(v) ? v : null;
        };
        var peso = ler('ePeso'), reps = ler('eReps', true);
        var tempo = ler('eTempo', true), dist = ler('eDist');
        var elRir = corpo.querySelector('#eRir');

        if (peso !== undefined) s.peso = peso === null ? 0 : peso;
        if (reps !== undefined) s.reps = reps;
        if (tempo !== undefined) s.tempoSeg = tempo;
        if (dist !== undefined) s.distancia = dist;
        if (elRir) {
          var rir = elRir.value.trim();
          s.rir = rir === '' ? null : parseFloat(rir);
        }
        s.nota = corpo.querySelector('#eNota').value.trim() || null;
        reindexar();
        BD.guardar('series', s).then(function () { fecharFolha(); avisar('Série guardada'); render(); });
      };
      corpo.querySelector('#eApagar').onclick = function () {
        Estado.series = Estado.series.filter(function (x) { return x.id !== id; });
        reindexar();
        BD.apagar('series', id).then(function () { fecharFolha(); avisar('Série apagada'); render(); });
      };
    });
}

/* --------------------------------------------------------------------------
   Escolher o exercicio a fazer
   ----------------------------------------------------------------------- */
function escolherExercicio() {
  abrirFolha('Escolher exercício',
    '<label class="campo"><span>Procurar</span>' +
      '<input id="proc" type="search" placeholder="nome do exercício" autocomplete="off"></label>' +
    '<div id="listaEx"></div>' +
    '<button class="btn larga" id="btNovoEx" style="margin-top:10px">+ Criar exercício novo</button>',
    function (corpo) {
      var proc = corpo.querySelector('#proc');
      var lista = corpo.querySelector('#listaEx');

      function desenhar() {
        var termo = normalizarCabecalho(proc.value);
        var frequentes = maisUsados();
        var visiveis = Estado.exercicios.filter(function (e) {
          return !e.arquivado && (!termo || normalizarCabecalho(e.nome).indexOf(termo) !== -1);
        });

        var html = '';
        if (!termo && frequentes.length) {
          html += '<div class="lista"><div class="cab">Mais usados</div>' +
            frequentes.map(itemExercicio).join('') + '</div>';
        }
        var porGrupo = {};
        visiveis.forEach(function (e) { (porGrupo[e.grupo] = porGrupo[e.grupo] || []).push(e); });
        Object.keys(porGrupo).sort(function (a, b) {
          var ia = GRUPOS_APP.indexOf(a), ib = GRUPOS_APP.indexOf(b);
          return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b);
        }).forEach(function (g) {
          html += '<div class="lista"><div class="cab">' + esc(g) + '</div>' +
            porGrupo[g].sort(function (a, b) { return a.nome.localeCompare(b.nome); })
              .map(itemExercicio).join('') + '</div>';
        });
        if (!visiveis.length) html = '<p class="vazio pequeno">Nenhum exercício com esse nome.</p>';
        lista.innerHTML = html;

        Array.prototype.forEach.call(lista.querySelectorAll('[data-ex]'), function (b) {
          b.onclick = function () {
            // Escolher um exercicio poe logo uma serie no dia, por fazer, com
            // os valores da ultima vez. O ecra do exercicio deixou de ter
            // campos de registo: quem regista sao as linhas do treino.
            fecharFolha();
            Estado.vista = 'treino';
            Estado.exercicioAtivo = null;
            acrescentarSerie(+b.dataset.ex);
          };
        });
      }

      proc.oninput = desenhar;
      desenhar();
      corpo.querySelector('#btNovoEx').onclick = function () { editarExercicio(null); };
    });
}

function itemExercicio(e) {
  var m = melhores()[e.id];
  return '<button class="item" data-ex="' + e.id + '">' +
    '<div class="crescer"><div style="font-weight:600">' + esc(e.nome) + '</div>' +
    '<div class="mini fraco">' + esc(e.grupo) +
      (m ? ' · melhor ' + kg(m.pesoMax) : ' · ainda sem séries') + '</div></div>' +
    '<span class="seta">&#8250;</span></button>';
}

/* Os oito exercicios com mais series nos ultimos tres meses. */
function maisUsados() {
  var limite = new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10);
  var contas = {};
  Estado.series.forEach(function (s) {
    if (s.data >= limite) contas[s.exercicioId] = (contas[s.exercicioId] || 0) + 1;
  });
  return Object.keys(contas)
    .sort(function (a, b) { return contas[b] - contas[a]; })
    .slice(0, 8)
    .map(function (id) { return exercicioPorId(+id); })
    .filter(function (e) { return e && !e.arquivado; });
}

/* --------------------------------------------------------------------------
   Mudar o dia que se esta a ver
   ----------------------------------------------------------------------- */
/* O cabecalho de um dia de treino: seta, data, seta.
   A data ao meio abre o calendario. As setas andam um dia de cada vez — e o
   gesto que mais se faz, e obrigar a abrir uma folha para isso era de mais. */
function mostrarNavDia(data) {
  $('#titulo').hidden = true;
  var nav = $('#navDia');
  nav.hidden = false;

  var relativa = dataRelativa(data);
  var longa = dataLonga(data);
  // Quando diz "Hoje" ou "Ontem", a data completa vai por baixo em pequeno.
  $('#diaData').innerHTML = relativa === longa
    ? esc(longa)
    : esc(relativa) + '<small>' + esc(longa) + '</small>';

  // Para a frente vai-se ate ao ultimo treino marcado (o plano); depois disso
  // nao ha nada para ver.
  $('#diaDepois').disabled = data >= limiteFuturo();

  $('#diaAntes').onclick = function () { andarDia(-1); };
  $('#diaDepois').onclick = function () { andarDia(1); };
  $('#diaData').onclick = escolherDia;
}

function esconderNavDia() {
  $('#navDia').hidden = true;
  $('#titulo').hidden = false;
}

/* O dia mais a frente onde ha treino marcado, ou hoje se nao houver nenhum. */
function limiteFuturo() {
  var hoje = hojeIso(), max = hoje;
  Estado.sessoes.forEach(function (s) { if (s.data > max) max = s.data; });
  return max;
}

function andarDia(passo) {
  var nova = recuarDias(Estado.dataAtual, -passo);
  if (nova > limiteFuturo()) return;
  Estado.dataAtual = nova;
  Estado.exercicioAtivo = null;
  vibrar(8);
  render();
}

/* Calendario para saltar para um dia qualquer, com os dias de treino a azul. */
function escolherDia() {
  var comTreino = {};
  Estado.series.forEach(function (s) { comTreino[s.data] = true; });
  var mes = Estado.dataAtual.slice(0, 7);

  abrirFolha('Ir para',
    '<div id="edCal"></div>' +
    '<button class="btn primaria larga" id="edHoje">Voltar a hoje</button>',
    function (corpo) {
      var cal = corpo.querySelector('#edCal');

      function desenhar() {
        var ano = +mes.slice(0, 4), m = +mes.slice(5, 7);
        var recuo = (new Date(Date.UTC(ano, m - 1, 1)).getUTCDay() + 6) % 7;
        var diasNoMes = new Date(Date.UTC(ano, m, 0)).getUTCDate();

        var html = '<div class="cartao" style="margin-top:0">' +
          '<div class="linha entre" style="margin-bottom:12px">' +
            '<button class="btn fina" id="edAntes">&#8249;</button>' +
            '<h3 style="margin:0;text-transform:none;font-size:17px;color:var(--texto)">' +
              esc(MESES[m - 1] + ' ' + ano) + '</h3>' +
            '<button class="btn fina" id="edDepois"' +
              (mes >= limiteFuturo().slice(0, 7) ? ' disabled' : '') + '>&#8250;</button>' +
          '</div><div class="calendario">' +
          ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(function (x) {
            return '<div class="dn">' + x + '</div>';
          }).join('');

        for (var i = 0; i < recuo; i++) html += '<button class="fora"></button>';
        for (var dia = 1; dia <= diasNoMes; dia++) {
          var iso = ano + '-' + String(m).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
          var classes = [];
          if (comTreino[iso]) classes.push('treino');
          if (iso === hojeIso()) classes.push('hoje');
          if (iso === Estado.dataAtual) classes.push('sel');
          html += '<button class="' + classes.join(' ') + '" data-ir="' + iso + '"' +
            (iso > limiteFuturo() ? ' disabled' : '') + '>' + dia + '</button>';
        }
        html += '</div><p class="mini fraco centro" style="margin:12px 0 0">' +
          'Os dias a azul têm treino.</p></div>';
        cal.innerHTML = html;

        cal.querySelector('#edAntes').onclick = function () { mes = mesVizinho(mes, -1); desenhar(); };
        var depois = cal.querySelector('#edDepois');
        if (!depois.disabled) depois.onclick = function () { mes = mesVizinho(mes, 1); desenhar(); };

        Array.prototype.forEach.call(cal.querySelectorAll('[data-ir]'), function (b) {
          if (b.disabled) return;
          b.onclick = function () {
            Estado.dataAtual = b.dataset.ir;
            Estado.exercicioAtivo = null;
            fecharFolha(); render();
          };
        });
      }

      desenhar();
      corpo.querySelector('#edHoje').onclick = function () {
        Estado.dataAtual = hojeIso();
        Estado.exercicioAtivo = null;
        fecharFolha(); render();
      };
    });
}

function mesVizinho(mes, passo) {
  var ano = +mes.slice(0, 4), m = +mes.slice(5, 7) + passo;
  if (m < 1) { m = 12; ano--; }
  if (m > 12) { m = 1; ano++; }
  return ano + '-' + String(m).padStart(2, '0');
}

/* ===========================================================================
   Vista: Historico
   ======================================================================== */

function renderHistorico() {
  $('#titulo').textContent = 'Histórico';
  $('#btVoltar').hidden = true;
  $('#btAcao').hidden = true;

  var mes = Estado.mesCalendario || Estado.dataAtual.slice(0, 7);
  var ano = +mes.slice(0, 4), m = +mes.slice(5, 7);

  var diasComTreino = {};
  Estado.series.forEach(function (s) {
    if (s.data.slice(0, 7) === mes) diasComTreino[s.data] = (diasComTreino[s.data] || 0) + 1;
  });

  // Calendario
  var primeiro = new Date(Date.UTC(ano, m - 1, 1));
  var recuo = (primeiro.getUTCDay() + 6) % 7;         // segunda a domingo
  var diasNoMes = new Date(Date.UTC(ano, m, 0)).getUTCDate();

  var html = '<div class="cartao">' +
    '<div class="linha entre" style="margin-bottom:12px">' +
      '<button class="btn fina" id="mesAnterior">&#8249;</button>' +
      '<h3 style="margin:0;text-transform:none;font-size:17px;color:var(--texto)">' +
        esc(MESES[m - 1] + ' ' + ano) + '</h3>' +
      '<button class="btn fina" id="mesSeguinte">&#8250;</button>' +
    '</div><div class="calendario">' +
    ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(function (d) {
      return '<div class="dn">' + d + '</div>';
    }).join('');

  for (var i = 0; i < recuo; i++) html += '<button class="fora"></button>';
  for (var dia = 1; dia <= diasNoMes; dia++) {
    var iso = ano + '-' + String(m).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
    var classes = [];
    if (diasComTreino[iso]) classes.push('treino');
    if (iso === hojeIso()) classes.push('hoje');
    html += '<button class="' + classes.join(' ') + '" data-dia="' + iso + '">' + dia + '</button>';
  }
  html += '</div></div>';

  // Resumo do mes
  var doMes = Estado.series.filter(function (s) { return s.data.slice(0, 7) === mes; });
  if (doMes.length) {
    var volume = doMes.reduce(function (t, s) {
      return t + (Number.isFinite(s.peso) ? s.peso : 0) * (Number.isFinite(s.reps) ? s.reps : 0);
    }, 0);
    html += '<div class="cartao"><div class="linha entre">' +
      '<div class="centro crescer"><div style="font-size:21px;font-weight:700" class="nums">' +
        Object.keys(diasComTreino).length + '</div><div class="mini fraco">treinos</div></div>' +
      '<div class="centro crescer"><div style="font-size:21px;font-weight:700" class="nums">' +
        doMes.length + '</div><div class="mini fraco">séries</div></div>' +
      '<div class="centro crescer"><div style="font-size:21px;font-weight:700" class="nums">' +
        volumeCurto(volume) + '</div><div class="mini fraco">volume</div></div>' +
      '</div></div>';
  }

  // Lista dos treinos do mes, do mais recente para tras
  var datas = Object.keys(diasComTreino).sort().reverse();
  if (datas.length) {
    html += '<div class="lista"><div class="cab">Treinos deste mês</div>';
    datas.forEach(function (d) {
      var series = seriesDoDia(d);
      var nomes = [...new Set(series.map(function (s) {
        var e = exercicioPorId(s.exercicioId); return e ? e.grupo : 'Outros';
      }))];
      html += '<button class="item" data-dia="' + d + '">' +
        '<div class="crescer"><div style="font-weight:600">' + esc(dataLonga(d)) + '</div>' +
        '<div class="mini fraco">' + plural(series.length, 'série', 'séries') + ' · ' + esc(nomes.join(', ')) + '</div></div>' +
        '<span class="seta">&#8250;</span></button>';
    });
    html += '</div>';
  } else {
    html += '<p class="vazio pequeno">Nenhum treino neste mês.</p>';
  }

  $('#v-historico').innerHTML = html;

  $('#mesAnterior').onclick = function () { andarMes(-1); };
  $('#mesSeguinte').onclick = function () { andarMes(1); };
  // Carregar num dia mostra primeiro o que la foi feito, em vez de saltar
  // logo para dentro do treino.
  Array.prototype.forEach.call(document.querySelectorAll('[data-dia]'), function (b) {
    if (!b.dataset.dia) return;
    b.onclick = function () { verTreinoDoDia(b.dataset.dia); };
  });
}

function andarMes(passo) {
  var mes = Estado.mesCalendario || Estado.dataAtual.slice(0, 7);
  var ano = +mes.slice(0, 4), m = +mes.slice(5, 7) + passo;
  if (m < 1) { m = 12; ano--; }
  if (m > 12) { m = 1; ano++; }
  Estado.mesCalendario = ano + '-' + String(m).padStart(2, '0');
  render();
}

/* ===========================================================================
   Vista: Analises
   ======================================================================== */

var ABAS_ANALISE = [
